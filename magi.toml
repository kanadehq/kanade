# Repo-owned magi settings (not kata-managed). Only what is peculiar to this
# repository lives here; roster and run shape live at the machine layer.

[verify]
# The final gate mirrors the required jobs in .github/workflows/ci.yml, in
# order: check, test (all targets, then doc tests), rustfmt, clippy and the
# locked check. The editorconfig and coverage jobs need tools that are not part
# of the local toolchain and stay with CI.
gate = [
  "cargo check --all-targets",
  "cargo test --all-targets",
  "cargo test --doc",
  "cargo fmt --all -- --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo check --locked --all-targets",
]

# Focused end-to-end checks of the signed package manifest / managed publisher
# trust path with real temporary keys and directories. The NATS-backed
# `--ignored` tests of .github/workflows/integration.yml are opt-in there (they
# need nats-server and local sockets) and are not part of this local run.
e2e = [
  "cargo test -p kanade-shared --lib -- package_manifest publisher_trust package_admission",
  "cargo test -p kanade --test app_manifest_cli --test app_trust_cli",
]

[merge]
base = "main"
