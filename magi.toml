# Repo-owned magi settings (not kata-managed). Only what is peculiar to this
# repository lives here; roster and run shape live at the machine layer.

[verify]
# The final gate mirrors the Rust jobs of .github/workflows/ci.yml, in order:
# check, test (all targets), rustfmt, clippy and the locked check. No frontend
# step is needed: CI does not build the SPA either, because the backend
# build.rs seeds a placeholder web/dist. `cargo test --doc` is deliberately
# absent: CI gates it on a root `src/lib.rs`, which this workspace does not
# have, so it is not a CI check. The editorconfig and coverage jobs need tools
# outside the local toolchain and stay with CI, as do the Windows and Linux
# legs of the check/test/clippy matrices; a run here covers the host OS only.
gate = [
  "cargo check --all-targets",
  "cargo test --all-targets",
  "cargo fmt --all -- --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo check --locked --all-targets",
]

# Focused end-to-end checks of what recent deploy stages added. Stage 1b runs
# the `--ignored` backend publication/store tests of
# .github/workflows/integration.yml against real temporary NATS JetStream
# Object Stores. runner は CI の固定版 NATS を target/magi-tools に準備し、
# 子テストの PATH にだけ追加する。準備失敗ではスキップせず失敗する。
# オフラインでは KANADE_TEST_NATS_SERVER で取得済みの固定版を指定する。
# Stage 2a/2b run the signed
# package manifest, publisher trust and admission tests plus their CLI tests
# with real temporary keys and directories.
e2e = [
  "python3 scripts/ci/magi-e2e.py",
]

[merge]
base = "main"
