[package]
name = "kanade-agent"
description = "Windows-side resident daemon for the kanade endpoint-management system. Subscribes to commands.* over NATS, runs scripts, publishes WMI inventory + heartbeats, watches for self-updates"
readme = "../../README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
kanade-shared = { workspace = true }

anyhow     = { workspace = true }
async-nats = { workspace = true }
# Verifies the operator's support-unlock codes locally (KLP
# `support.unlock`), so a helpdesk can still open a machine while the
# backend is unreachable. Same hasher the backend mints them with.
argon2     = { workspace = true }
base64     = { workspace = true }
bytes      = { workspace = true }
chrono     = { workspace = true }
clap       = { workspace = true }
futures    = { workspace = true }
humantime  = { workspace = true }
rand       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
tokio      = { workspace = true }
tokio-cron-scheduler = { workspace = true }
tracing    = { workspace = true }
tracing-appender   = { workspace = true }
tracing-subscriber = { workspace = true }
uuid       = { workspace = true }
sysinfo    = { workspace = true }
# #219 collect: zip the script's listed files into a bundle before
# uploading to OBJECT_COLLECTIONS. Minimal feature set (deflate only) —
# no bzip2/zstd/aes — keeps the build lean.
zip        = { version = "2.4.2", default-features = false, features = ["deflate"] }
# #841 PR2: the native Windows Event Log reader renders each record to XML
# (EvtRender) and plucks specific nested elements/attributes out of it
# (System/EventRecordID, EventData/Data[@Name]). A read-only DOM (roxmltree)
# is far simpler and less error-prone for that than quick-xml's pull API;
# it's pure-Rust with no transitive deps. Kept out of the windows-only block
# so the parse/shape helpers stay unit-testable on every platform.
roxmltree  = "0.21.1"

[dev-dependencies]
tempfile = "3.27.0"
# Integration test harness (Issue #141) needs to talk to the same
# broker the agent does — pin to workspace `async-nats` so wire
# protocol stays in lockstep.
async-nats = { workspace = true }
# JetStream bootstrap helper lives in kanade-shared. Reuse from the
# integration tests instead of duplicating the stream / KV catalogue.
kanade-shared = { workspace = true }
# Allocate a free TCP port per spawned nats-server so multiple
# integration tests can run in parallel without colliding.
portpicker = "0.1.1"
# Skip integration tests cleanly when `nats-server` isn't in PATH
# (developer running `--ignored` on a fresh checkout).
which = "8.0.5"
# Workspace deps used by integration tests but already in
# [dependencies] don't need re-declaration; the agent's own
# integration tests inherit them.

[target.'cfg(target_os = "windows")'.dependencies]
# wmi crate dropped in v0.12.0 — inventory now shells out to
# powershell.exe to get past WBEM_E_INVALID_CLASS under LocalSystem.
# SCM (Service Control Manager) integration. Without this the agent
# runs under sc.exe but never calls StartServiceCtrlDispatcher, so
# Windows times out after 30 s and marks the service "did not respond"
# (Event ID 7009). The crate provides the dispatcher + control-handler
# scaffolding plus the typed status struct (Running / Stopped + accepted
# control codes) that SCM expects.
windows-service = "0.8.1"
# #1140 PR2: JPEG encode of captured frames, so the probe measures the
# on-the-wire size a relay would actually push — a raw BGRA frame is
# ~8 MB at 1080p and tells us nothing about bandwidth. Windows-only
# because the only consumer is the (Windows-only) capture path.
# `default-features = false` + `jpeg` keeps every other codec (and the
# rayon/tiff/png dependency fan-out) out of the tree.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# v0.21: CreateProcessAsUserW + WTSQueryUserToken for run_as: user /
# system_gui. Feature flags scope the binding to just what we need.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    # SDDL → SECURITY_DESCRIPTOR for the KLP Named Pipe ACL (SPEC
    # §2.12.1: `Authenticated Users RW, deny Anonymous`). Needs
    # `ConvertStringSecurityDescriptorToSecurityDescriptorW` from
    # the Authorization sub-feature.
    "Win32_Security_Authorization",
    # #418 `on: network_change`: NotifyAddrChange (blocking) to wake the
    # network-change watcher when the IP address table changes.
    "Win32_NetworkManagement_IpHelper",
    # #1140 PR2: DXGI Desktop Duplication screen capture. D3D11CreateDevice
    # gives us the device the duplication is bound to; the Dxgi features
    # carry IDXGIOutput1::DuplicateOutput + AcquireNextFrame and the
    # DXGI_FORMAT_* / RECT types the frame descriptors use.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # #418 `constraints.require.network`: GetNetworkConnectivityHint
    # (iphlpapi) returns NL_NETWORK_CONNECTIVITY_HINT, which lives under
    # the WinSock module — so the connectivity gate needs this feature.
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    # #841 PR2: native Windows Event Log reader (EvtQuery / EvtNext /
    # EvtRender / EvtClose) replacing the collect-winlog-events PowerShell
    # job — drops the per-tick Get-WinEvent process spawn.
    "Win32_System_EventLog",
    "Win32_System_IO",
    # v0.43: Job Objects so a kill/timeout tears down the whole
    # process tree (host + descendants), not just the immediate
    # powershell/cmd. Fixes the "強制終了 → 実行中 のまま" hang where
    # an orphaned grandchild kept the stdout pipe open and the agent
    # never returned an ExecResult.
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    # #418 constraints.require: GetSystemPowerStatus (ac_power gate).
    # The idle gate reuses Win32_System_RemoteDesktop (WTSINFOW /
    # WTSQuerySessionInformationW), already enabled below.
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    # #841 PR2b: GetComputerNameExW(ComputerNameDnsDomain) — detect whether
    # the box is domain-joined (and its domain) so the winlog SID→name
    # translation can gate domain-SID lookups on DC reachability.
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # #855 session-agent: GetLastInputInfo / LASTINPUTINFO — the in-session
    # idle read the resident session-agent does (WTS LastInputTime, read by a
    # SYSTEM service, is stale for an active console session; GetLastInputInfo
    # is session-affine and only truthful inside the user's session).
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
# Embeds VERSIONINFO into the .exe at build time so backend's upload
# endpoint can read ProductVersion via `pelite` without spawning the
# binary. See build.rs.
winres = { workspace = true }
