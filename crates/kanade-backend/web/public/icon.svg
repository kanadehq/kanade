<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 30 180 140" role="img" aria-label="kanade baton">
  <title>kanade — baton</title>
  <defs>
    <linearGradient id="g-baton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#5b3a8c"/>
      <stop offset="0.5" stop-color="#d4a017"/>
      <stop offset="1"   stop-color="#2a9d8f"/>
    </linearGradient>
  </defs>
  <!--
    Baton (タクト) — identical geometry to the canonical mark in
    assets/icon.svg, just cropped to its own bounding box so it can
    sit beside the wordmark in the SPA header without dragging the
    奏 kanji into the icon.
  -->
  <path d="M 54 60 A 12 12 0 1 1 68 41 L 212 162 Z" fill="url(#g-baton)"/>
</svg>
