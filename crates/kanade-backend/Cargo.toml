[package]
name = "kanade-backend"
description = "axum + SQLite projection backend for the kanade endpoint-management system. Hosts /api/* and the embedded SPA dashboard, projects JetStream streams into SQLite, drives the cron scheduler"
readme = "../../README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true
include = [
    "src/**/*",
    "migrations/**/*",
    # The four installer payloads the agent-install endpoints serve. Copies
    # of the workspace-root originals, kept in the crate because
    # `cargo package` cannot reach outside it — see the note at the top of
    # `src/api/agent_installer.rs` (#1364).
    "assets/**/*",
    # Only the built SPA bundle — rust-embed reads dist/ at compile
    # time. The source under web/src/ + node_modules/ + the Vite
    # config don't ship to crates.io.
    "web/dist/**/*",
    "Cargo.toml",
]

[dependencies]
kanade-shared = { workspace = true }

anyhow     = { workspace = true }
argon2     = { workspace = true }
async-nats = { workspace = true }
axum       = { workspace = true }
base64     = { workspace = true }
bytes      = { workspace = true }
chrono     = { workspace = true }
clap       = { workspace = true }
futures    = { workspace = true }
humantime  = { workspace = true }
# #1270: GET the NATS monitoring endpoint (`/connz`). hyper directly
# rather than reqwest, because the monitoring port speaks plain HTTP and
# nothing else: reqwest's default TLS stack would pull a SECOND rustls
# crypto provider (aws-lc-rs) into a binary that today has exactly one
# (ring, via async-nats + lettre), and rustls then refuses to pick one —
# the #1187 panic, landing on the SMTP path. Every crate here is already
# in the tree via axum, so this adds no packages.
http-body-util = "0.1.5"
hyper      = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
jsonwebtoken = { workspace = true }
lettre     = { workspace = true }
mime_guess = { workspace = true }
rand       = { workspace = true }
regex      = { workspace = true }
rust-embed = { workspace = true }
schemars   = { workspace = true }
serde_yaml = { workspace = true }
tokio-cron-scheduler = { workspace = true }
uuid       = { workspace = true }

# Re-exported above already; explicit so the watch loop's `Mutex` use
# is obvious.
serde      = { workspace = true }
serde_json = { workspace = true }
# SHA-256 of password setup/reset tokens — the DB stores the hash, the
# emailed URL carries the raw token (so a DB read can't mint a live link).
sha2       = { workspace = true }
sqlx       = { workspace = true }
tokio      = { workspace = true }
# `ReaderStream` wraps the NATS Object Store's `AsyncRead` for
# axum's `Body::from_stream` — keeps `/api/app-packages/.../get`
# from buffering 100-200 MB MSIs into RAM.
tokio-util = { version = "0.7.19", features = ["io"] }
tower      = { workspace = true }
tower-http = { workspace = true }
tracing    = { workspace = true }
tracing-appender   = { workspace = true }
tracing-subscriber = { workspace = true }
totp-rs = { workspace = true }
# Agent installer ZIP (GET /api/agents/installer): same minimal feature
# set kanade-agent's collect bundle uses — deflate only, no bzip2/zstd/aes.
zip        = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Linux agent installer tarball (GET /api/agents/installer?os=linux) —
# versions match the existing lockfile entries (both already in the tree
# transitively).
tar        = "0.4.46"
flate2     = "1.1.9"

[dev-dependencies]
# The #1270 live test spawns a throwaway token-auth `nats-server` on a
# random port, like kanade-shared's kv_cas_live harness.
portpicker = "0.1.1"
tempfile = "3.27.0"

[target.'cfg(target_os = "windows")'.dependencies]
# SCM (Service Control Manager) integration. Same role as in
# kanade-agent — without StartServiceCtrlDispatcher the backend
# process never tells Windows it's alive and SCM kills it after
# 30 s with Event ID 7009 / 'service did not respond'.
windows-service = "0.8.1"

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = { workspace = true }
