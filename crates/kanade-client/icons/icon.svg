<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="client app icon (baton)">
  <title>baton — client app icon</title>

  <!--
    SOURCE for crates/kanade-client/icons/icon.ico (the exe-embedded /
    taskbar / Start-Menu-shortcut icon). The client is branded per
    customer, so the icon is the タクト (baton) MARK ONLY — no 奏 kanji,
    no wordmark — the same baton geometry as the SPA's leftmost icon
    (crates/kanade-backend/web/public/icon.svg), just centred + scaled
    to fill a square canvas.

    Regenerate the .ico after editing this file (ImageMagick w/ rsvg):
      magick -background none icon.svg -define icon:auto-resize=256,128,64,48,32,24,16 icon.ico

    The baton path is the canonical mark's baton (assets/icon.svg); the
    transform centres its bbox (~x[49,212] y[38,162], centre ~(130.5,100))
    on the 256 canvas and scales it up to ~1.35 so the thin baton still
    reads at small sizes.
  -->
  <defs>
    <linearGradient id="g-baton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#5b3a8c"/>
      <stop offset="0.5" stop-color="#d4a017"/>
      <stop offset="1"   stop-color="#2a9d8f"/>
    </linearGradient>
  </defs>

  <g transform="translate(128 128) scale(1.35) translate(-130.5 -100)">
    <path d="M 54 60 A 12 12 0 1 1 68 41 L 212 162 Z" fill="url(#g-baton)"/>
  </g>
</svg>
