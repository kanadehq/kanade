[package]
name = "kanade-client"
description = "End-user-facing Tauri Client App for the kanade endpoint-management system. Talks to the local agent over KLP (SPEC §2.12); presents notifications, health and self-service jobs through a desktop UI."
readme = "../../README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true

# The GUI supports Windows and Apple Silicon macOS; Linux keeps the shim.

# `custom-protocol` is a DEFAULT feature rather than pinned directly on
# the `tauri` dependency, so it can be turned off on purpose.
#
# It is the switch that decides which frontend the binary loads, and its
# polarity is inverted from what the name suggests: `tauri`'s own build
# script does `let dev = !custom_protocol`, and `Manager::get_app_url()`
# reads `build.devUrl` under `cfg(dev)` and the embedded `frontendDist`
# under `cfg(not(dev))`. Pinned on the dependency, the feature could not
# be removed by any command-line flag — so `cargo tauri dev` started
# Vite and then launched a binary that ignored it. The window showed
# whatever had been embedded at compile time while the very same URL
# rendered correctly in a browser beside it, and nothing in the output
# named the cause.
#
# Keeping it in `default` leaves every existing build path unchanged:
# `cargo build --release --workspace --bins` (what `release.yml` runs)
# still produces a production binary. Only an explicit
# `--no-default-features` opts into the dev-server flow.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
kanade-shared = { workspace = true }

# Cross-platform policy and KLP dependencies.
anyhow = { workspace = true }
# Needed by `window_size`, whose pure logic is built + tested on every
# platform.
serde      = { workspace = true }
serde_json = { workspace = true }

# Tokio, tracing, and UUID are shared by the cross-platform KLP library.
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(any(target_os = "windows", all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
# Tauri 2.x runtime.
#
# `custom-protocol` is REQUIRED for a working production binary. Without
# it Tauri compiles in "dev" mode (`cfg(dev)`) and at runtime loads
# `build.devUrl` (http://localhost:1420, the Vite dev server) instead of
# the embedded `frontendDist` assets — so a shipped client shows
# "localhost — ERR_CONNECTION_REFUSED" because nothing is serving that
# port. `tauri build` injects this feature automatically, but we build
# the client with plain `cargo build --release --workspace`, so it must
# be on by default — see `[features]` below, which keeps it on for every
# existing build path while making it possible to turn OFF deliberately.
tauri = { version = "2.11.5", features = [] }
# Single-instance guard (#624): the agent launches a fresh client per
# emergency (#102 fallback), so without this a second emergency >10s after
# the first piles up another hidden process. This forwards the second
# launch's argv to the running instance and exits it. Also the path a
# `kanade-client://` toast-click protocol launch takes back to the running
# instance (#647 reveal-on-click).
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "windows")'.dependencies]
# Native OS toast notifications — used for info/warn toasts. Emergencies are
# built as raw WinRT toasts in `app.rs` (the plugin can't persist a toast nor
# carry the click-to-open `launch`).
tauri-plugin-notification = "2.3.3"
# WinRT/Win32: `SetCurrentProcessExplicitAppUserModelID` (AUMID pin so toasts
# render at all, #102) plus `UI_Notifications` + `Data_Xml_Dom` to build the
# emergency toast directly — `scenario=Reminder` (persists until dismissed) and
# a toast-level `launch="kanade-client://…" activationType="protocol"` so a body
# OR button click opens the client, no COM activator needed (#647).
windows = { version = "0.62.2", features = [
    "Win32_UI_Shell",
    # `ShellExecuteW` + `SW_SHOWNORMAL` (`open_external_url`): open a link found
    # in a notification body in the default browser, instead of letting the
    # WebView navigate to it and replace the embedded app page.
    "Win32_UI_WindowsAndMessaging",
    "UI_Notifications",
    "Data_Xml_Dom",
] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.build-dependencies]
# `tauri-build` reads `tauri.conf.json` at build time and
# generates the context macro consumed in `app::run`. Gated to
# native GUI hosts. build.rs also checks the actual target OS/architecture
# before invoking the helper; Linux retains the shim.
#
# #260: `build.rs` syncs `version` in tauri.conf.json with the
# workspace's CARGO_PKG_VERSION before tauri-build runs, so the
# binary's embedded VERSIONINFO ProductVersion stays in lockstep
# with the Cargo version instead of drifting. Uses a targeted
# string-replace (no `serde_json` round-trip) so the rewrite
# preserves the file's original key order, formatting, and any
# future comments — anything an `serde_json::Value` round-trip
# would silently rewrite alphabetically (Gemini #266).
tauri-build = { version = "2.6.3", features = [] }
