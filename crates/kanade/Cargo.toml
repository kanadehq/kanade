[package]
name = "kanade"
description = "Admin CLI for the kanade endpoint-management system. Deploy YAML manifests, schedule cron jobs, kill running jobs, revoke commands, publish new agent releases — over NATS + HTTP"
readme = "../../README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
kanade-shared = { workspace = true }

anyhow     = { workspace = true }
async-nats = { workspace = true }
base64     = { workspace = true }
bytes      = { workspace = true }
chrono     = { workspace = true }
dirs       = { workspace = true }
kaishin    = { workspace = true }
clap       = { workspace = true }
futures    = { workspace = true }
glob       = { workspace = true }
humantime  = { workspace = true }
reqwest    = { workspace = true }
rpassword  = { workspace = true }
rustls     = { workspace = true }   # #1187: install a crypto provider in main()
serde      = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2       = { workspace = true }
tokio      = { workspace = true }
toml       = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
uuid       = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = { workspace = true }
