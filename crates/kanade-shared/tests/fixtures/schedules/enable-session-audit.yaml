# Issue #378 — fires `enable-session-audit` once per PC so lock /
# unlock (Security 4800 / 4801) start flowing into the obs_events
# timeline (read by the agent's native Event Log reader, #841).
# Same lifecycle pattern as `kitting-once`:
#
#   * each internal poll (every minute) enumerates alive agents
#   * a PC that completed with exit 0 is skipped forever
#   * a failed PC retries on the next tick (until it succeeds)
#   * a PC that joins the fleet later is picked up automatically
#
# `per_pc: once` (#418) — "success → never again" is exactly the
# semantics for a one-shot policy enable, while replacement / newly
# imaged PCs keep getting caught forever. A new PC missing
# lock/unlock events for a minute or two after first heartbeat is
# fine — the native reader's bootstrap window (24 h) will backfill
# the gap on its next poll anyway.
#
# Install:
#
#   kanade job create      configs/jobs/enable-session-audit.yaml
#   kanade schedule create configs/schedules/enable-session-audit.yaml

id: enable-session-audit
tags: [observability, setup]   # operator taxonomy for the SPA tag filter
when:
  per_pc: once
enabled: true
job_id: enable-session-audit
target:
  all: true
