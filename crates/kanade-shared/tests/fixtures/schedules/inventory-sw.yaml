# Schedule wrapper that fires the registered job `inventory-sw` (see
# `configs/jobs/inventory-sw.yaml`) with a per-PC 6-hour cadence.
#
# Matches `inventory-hw.yaml`'s cadence (`per_pc: { every: 6h }`) so
# the two probes share the same scan rhythm and an operator only has
# to think about one cadence instead of two. Software inventory
# changes (installs, uninstalls, version bumps) also rarely happen
# at sub-6h granularity in practice, so the same bucket fits both
# probes well.
#
# Order of operations:
#
#   1. Register the job:
#         kanade job create configs/jobs/inventory-sw.yaml
#   2. Register this schedule:
#         kanade schedule create configs/schedules/inventory-sw.yaml

id: inventory-sw
tags: [inventory]   # operator taxonomy for the SPA tag filter
when:
  per_pc: { every: 6h }
enabled: true
job_id: inventory-sw
target:
  all: true
# Stagger agent start times by up to 5 min so 3000 PCs don't all
# walk Uninstall hives + Get-AppxPackage at the same wall-clock
# instant — the AppX repository is shared per-machine and contended
# enumeration is slower than serial.
jitter: 5m
