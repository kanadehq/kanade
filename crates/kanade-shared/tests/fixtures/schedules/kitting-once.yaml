# Kitting / first-boot schedule — fires the registered job
# `kitting-setup` once per new PC that joins the fleet.
#
# Install (job + schedule):
#
#   kanade job create configs/jobs/kitting-setup.yaml
#   kanade schedule create configs/schedules/kitting-once.yaml
#
# Lifecycle (when: per_pc: once):
#   * 内部 poll (毎分) 毎に alive 全 agent を列挙
#   * 既に exit_code=0 で完了した pc は次回からスキップ
#   * 失敗した pc は次の tick で再試行 (= 成功するまで)
#   * 新 PC が後で heartbeat してきたら次の tick で拾う
#
# `once` は「成功 → 永久にスキップ」—— 故障交換などで後から新 PC が
# 来ても forever catch する (本来のキッティング用途)。
# 「完了から X 経つと再 fire」(daily compliance に転用するパターン)
# なら `per_pc: { every: 1d }` に変える。
# 「特定の N 台でセットアップしたら schedule 自体は終わらせたい」
# (バッチキャンペーン) 用途なら、target を pcs: [...] に固定 +
# active.until で期限を切るのが筋 (#418)。

id: kitting-once
tags: [setup, sample]   # operator taxonomy for the SPA tag filter
when:
  per_pc: once
enabled: true
job_id: kitting-setup
target:
  all: true
