# Sprint 1: minimal config. `system.host` (cross-platform hostname) is the
# only teravars helper used here — full [vars] self-reference + is_windows()
# branching (see docs/SPEC.md §2.4.4) is deferred until the loader switches
# to teravars' extract_vars + resolve + render pipeline.

[agent]
id = '{{ system.host }}'
nats_url = 'nats://127.0.0.1:4222'
# Sprint 4a — wave rollout: declare which `commands.group.*` subjects
# this agent listens on. Smoke-test default puts the local agent in
# both canary and wave1 so jobs/wave-test.yaml fires through.
groups = ['canary', 'wave1']

[log]
path = 'logs/agent.log'
level = 'info'
