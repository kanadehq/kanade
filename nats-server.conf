# Sample nats-server config for kanade — JetStream + token auth.
#
# Start with:
#   nats-server -c nats-server.conf
#
# Then export the matching token on every kanade host (agent /
# backend / CLI):
#   $env:KANADE_NATS_TOKEN = "kanade-fleet-secret-2026"
#
# All three binaries auto-attach the token via the shared
# kanade-shared::nats_client::connect() helper; nats_url in
# agent.toml / backend.toml stays plain (the token never lands in
# config files or process listings).
#
# For dev / single-machine use without auth, drop the
# `authorization { ... }` block and start with `nats-server -js`
# — the kanade clients connect unauthenticated when
# $KANADE_NATS_TOKEN isn't set.

port: 4222
http_port: 8222   # /jsz endpoint for `kanade jetstream status` curl probes

jetstream {
  store_dir: "./jetstream"     # absolute path recommended for production
  max_memory_store: 1GB        # JetStream in-memory soft limit
  max_file_store: 50GB         # disk soft limit
}

authorization {
  # Single shared bearer token. For multi-tenant / per-agent
  # identity, switch to NKeys or NATS JWT (spec §2.7.1). Stick
  # with token while operating ≤ ~1000 hosts.
  token: "kanade-fleet-secret-2026"
}
