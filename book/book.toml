[book]
title = "kanade — 奏"
description = "Operator + developer documentation for the kanade endpoint management system."
authors = ["yukimemi"]
language = "en"
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/yukimemi/kanade"
edit-url-template = "https://github.com/yukimemi/kanade/edit/main/book/{path}"
# Empty default so `mdbook serve` and local `mdbook build` produce
# assets at the root. CI overrides this via
# MDBOOK_OUTPUT__HTML__SITE_URL to /kanade/en/ or /kanade/ja/
# for the GH Pages deploy (see .github/workflows/docs.yml).
site-url = ""

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2

[preprocessor.links]

# mdbook-gettext applies translations from `book/po/<lang>.po` at
# build time. With no MDBOOK_BOOK__LANGUAGE set, it's a no-op and
# English (the source) renders directly. With
# MDBOOK_BOOK__LANGUAGE=ja the msgids in the markdown source are
# replaced with the matching msgstr from po/ja.po. Untranslated
# entries fall back to the source English, so a partial
# translation shows whichever paragraphs haven't been touched yet
# in English instead of an empty page.
#
# Intentionally no `[output.xgettext]` section here, despite the
# `book/po/README.md` workflow using mdbook-xgettext: registering
# a second renderer makes the html output land under
# `build/en/html/` instead of `build/en/`, which would break the
# `/kanade/en/` GH Pages path. The extraction workflow sets
# `MDBOOK_OUTPUT__XGETTEXT__POT_FILE=...` instead, which enables
# the renderer for that single invocation only.
[preprocessor.gettext]
after = ["links"]
