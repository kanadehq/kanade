# renri.toml — language-agnostic worktree config for yukimemi/* projects.
# pj-base ships the minimum hook chain that any PJ benefits from
# (refresh installed agent skills); language-specific layers
# (pj-rust, pj-go, pj-bun) overwrite this file with a richer hook
# that delegates to the project's build-system on-add task.

[ui]
# Surface the GitHub PR # next to each worktree in `renri list`.
# renri batches `gh pr list` lookups (one call per `list` run
# regardless of worktree count) and caches the result; pass
# `renri list --refresh` to bypass the cache when a new PR has
# just been opened or merged.
show_pr = true
# renri.toml — fresh worktrees run `cargo make on-add`, which
# refreshes apm skills *and* fetches the upstream remote so the
# new worktree is rebase-ready without a second command.
# Schema and examples: https://github.com/yukimemi/renri

[[hooks.post_create]]
type = "command"
run = "cargo make on-add"
shell = "auto"

# Install the SPA's bun deps so a fresh worktree can build / preview
# the kanade-backend frontend immediately. Without this every new
# worktree hits `Cannot find module .../vite` on the first SPA build
# and the operator has to run `bun install` by hand. Kept as its own
# hook rather than wired into the language-agnostic `on-add` task so
# it doesn't trip non-SPA projects that share the pj-rust base.
#
# MUST stay AFTER the on-add hook: kata owns `hooks.post_create[0]`
# (`how = "merge-toml"`, `paths = ["hooks.post_create[0]"]` in
# pj-rust's template.toml) and re-pokes it to `cargo make on-add` on
# every `kata apply`. Consumers append later entries; moving this to
# index 0 would get it overwritten by on-add on the next apply
# (leaving a duplicated on-add and no web-install). If on-add's flaky
# `apm install` aborts the chain before this runs (stale local apm
# CLI → content-hash mismatch), the fix is `scoop update apm`, not a
# reorder.
[[hooks.post_create]]
type = "command"
run = "cargo make web-install"
shell = "auto"
