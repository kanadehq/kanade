[config]
# cargo-make's default is to enter every workspace member and run the
# requested task once per member. The convention here runs cargo
# directly at the workspace root with --workspace / --all-targets
# (see pj-rust's Makefile.toml), so per-member recursion just
# duplicates work and slows `cargo make check` noticeably.
#
# Turning the recursion off here keeps the task list semantically
# identical — cargo still visits every member via its own
# --workspace / --all-targets flag — and shaves the wall-clock cost.
default_to_workspace = false
[tasks.default]
alias = "check"

[tasks.check]
description = "Run fmt + clippy + test + lock-check (same as CI)"
dependencies = ["fmt-check", "clippy", "test", "lock-check"]

[tasks.fmt-check]
description = "Check formatting"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.fmt]
description = "Apply formatting"
command = "cargo"
args = ["fmt", "--all"]

[tasks.clippy]
description = "Run clippy with warnings as errors"
command = "cargo"
args = ["clippy", "--locked", "--all-targets", "--", "-D", "warnings"]

[tasks.test]
description = "Run all tests (targets + doc)"
# `cargo test --all-targets` covers lib / bins / tests / benches /
# examples but EXCLUDES doc tests. Run --doc separately so the
# task name still matches its description ("all tests"). CI runs
# both jobs in parallel; locally we sequence them via dependencies.
dependencies = ["test-targets", "test-doc"]

[tasks.test-targets]
description = "cargo test --all-targets (lib / bins / tests / benches / examples — no doc)"
command = "cargo"
args = ["test", "--locked", "--all-targets"]

[tasks.test-doc]
description = "cargo test --doc (doc tests only — excluded from --all-targets). Skipped on bin-only packages, since `cargo test --doc` errors with `no library targets found` when there is no library to extract doc tests from. Drop the `condition` line once yukimemi/todoke#50 and yukimemi/rvpm#176 (lib + bin refactor) both land."
command = "cargo"
args = ["test", "--locked", "--doc"]
condition = { files_exist = ["${CARGO_MAKE_WORKING_DIRECTORY}/src/lib.rs"] }

[tasks.lock-check]
description = "Verify Cargo.lock is in sync with Cargo.toml"
command = "cargo"
args = ["check", "--locked", "--all-targets"]

[tasks.publish-dry]
description = "Dry-run crates.io publish"
command = "cargo"
args = ["publish", "--dry-run", "--allow-dirty"]

[tasks.web-install]
description = "Install kanade-backend SPA deps via bun"
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}/crates/kanade-backend/web"
# duckscript body so the bun-presence check runs cross-platform.
# `renri add` calls this via the post_create hook, and a backend-
# only contributor who doesn't keep a JS toolchain around shouldn't
# have worktree creation fail on an SPA install step — pure Rust
# work in the worktree stays buildable. SPA work needs bun anyway,
# so the explicit `bun missing` log surfaces clearly.
#
# --ignore-scripts skips postinstall hooks that occasionally trip
# over ENOTCONN on Windows (some packages reach out to the network
# during postinstall). The deps we actually need at runtime — vite,
# monaco, react etc. — don't require their postinstalls.
script_runner = "@duckscript"
script = '''
bun_path = which bun
bun_missing = is_empty ${bun_path}
if ${bun_missing}
    echo "skipping web-install: bun not on PATH"
else
    exec --fail-on-error bun install --ignore-scripts
end
'''

[tasks.web-build]
description = "Build the React SPA into web/dist (consumed by rust-embed)"
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}/crates/kanade-backend/web"
command = "bun"
args = ["run", "build"]

[tasks.apm-install-update]
description = "Refresh APM dependencies to upstream latest. Skipped when apm.yml/apm absent, or when apm.lock.yaml already records the current upstream renri HEAD (kicks in on every cargo make on-add after the first to keep worktree creation fast)."
script_runner = "@duckscript"
script = '''
exists = is_path_exists "apm.yml"
if not ${exists}
    echo "no apm.yml; skipping apm-install-update"
    exit 0
end
apm_path = which apm
if is_empty ${apm_path}
    echo "apm CLI not on PATH; skipping apm-install-update (install via aka.ms/apm-unix or your platform's package manager)"
    exit 0
end

# Fast-path: if apm.lock.yaml already records the current
# upstream HEAD of yukimemi/renri (the only APM dependency for
# projects using these templates), don't re-run `apm install --update` —
# git ls-remote is ~100ms, an actual reinstall is several
# seconds. This makes `cargo make on-add` cheap on every
# `renri add` after the first.
lock_exists = is_path_exists "apm.lock.yaml"
if ${lock_exists}
    ls_result = exec git ls-remote https://github.com/yukimemi/renri.git refs/heads/main
    ls_ok = eq ${ls_result.code} 0
    if ${ls_ok}
        upstream_line = trim ${ls_result.stdout}
        # `substring` errors out (failing the whole task) if the
        # input is shorter than the requested range, so length-check
        # *before* the call. Empty / short `upstream_line` happens
        # when `git ls-remote` succeeds-with-empty (deleted main ref,
        # weird CI mirror, etc.) — in that case we skip the fast-
        # path and fall through to a real `apm install --update`.
        line_len = length ${upstream_line}
        line_long_enough = greater_than ${line_len} 39
        if ${line_long_enough}
            upstream_sha = substring ${upstream_line} 0 40
            # Defense-in-depth: still re-check sha_len in case
            # duckscript's substring semantics ever change.
            # `contains "haystack" ""` returns true (empty needle is
            # always a substring), so a stray empty sha would also
            # incorrectly skip the install without this guard.
            sha_len = length ${upstream_sha}
            sha_valid = eq ${sha_len} 40
        else
            sha_valid = set false
        end
        if ${sha_valid}
            lock_body = readfile apm.lock.yaml
            already_synced = contains ${lock_body} ${upstream_sha}
            if ${already_synced}
                echo "apm.lock.yaml already at upstream renri ${upstream_sha}; skipping apm install --update"
                exit 0
            end
        end
    end
end

exec apm install --update -t copilot,claude,gemini
'''

[tasks.web-dev]
description = "Vite dev server with HMR — proxies /api to the dev backend on :8081 (paired with `cargo make backend-dev`)."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}/crates/kanade-backend/web"
command = "bun"
args = ["run", "dev"]

[tasks.web-dev-prod]
description = "Vite dev server with HMR — proxies /api to the installed KanadeBackend service on :8080. Use this to iterate on the UI against the real fleet data; SPA login dialog needs the operator's bearer token if KANADE_AUTH_STATIC_TOKEN is configured."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}/crates/kanade-backend/web"
env = { "BACKEND_PROXY" = "http://localhost:8080" }
command = "bun"
args = ["run", "dev"]

[tasks.nats-dev]
description = "Run an unauthenticated nats-server for dev (listens on :4223, JetStream store under target/dev-data/nats-jetstream). Coexists with the production KanadeNats service on :4222 — they use distinct ports + distinct JetStream stores, so dev exec/job/schedule registrations stay isolated from prod."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
command = "nats-server"
args = ["-js", "-p", "4223", "-m", "8223", "-sd", "${CARGO_MAKE_WORKING_DIRECTORY}/target/dev-data/nats-jetstream"]

[tasks.on-add]
description = "Wired to renri's [[hooks.post_create]] — runs in a freshly created worktree"
# `apm-install` (no `--update`) is idempotent against the existing
# `apm.lock.yaml` — fresh worktrees install the recorded skills
# without rewriting the lock. Upstream-refresh is delegated to
# pj-base's `.github/workflows/apm-bump.yml` (weekly cron + manual
# dispatch); same Renovate-equivalent pattern as `kata-apply.yml`.
# Avoids the per-`renri add` lock churn that `apm install --update`
# produced whenever upstream renri (or any other apm dep) had
# moved — see yukimemi/pj-base#8 for the companion change in
# `renri.toml.base`.
dependencies = ["apm-install", "vcs-fetch"]

[tasks.backend-dev]
description = "Run kanade-backend in dev mode (loopback :8081, workspace-local DB + logs, auth disabled, NATS :4223). Coexists with an installed KanadeBackend Windows service running on :8080."
# cwd pinned to the workspace root: `cargo make dev` runs in
# parallel with `web-dev` (which uses cwd=crates/.../web), and
# without an explicit cwd here the parallel runner's per-task
# directory state isn't guaranteed — that meant `./backend.dev.toml`
# (and the SQLite path inside it) resolved to whatever the last
# task touched. Absolute config path via the env var below adds a
# belt-and-braces fallback.
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
env = { "KANADE_BACKEND_CONFIG" = "${CARGO_MAKE_WORKING_DIRECTORY}/configs/backend.dev.toml", "KANADE_AUTH_DISABLE" = "1", "RUST_LOG" = "info,kanade_backend=debug,tower_http=info" }
command = "cargo"
args = ["run", "-p", "kanade-backend"]

[tasks.agent-dev]
description = "Run kanade-agent in dev mode against the dev NATS broker (:4223). Fully isolated from the installed KanadeAgent service: dev agent talks to :4223 + writes log under target/dev-data/, prod agent stays on :4222 + %ProgramData%. Same hostname/pc_id is fine because the brokers don't share state."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
env = { "KANADE_AGENT_CONFIG" = "${CARGO_MAKE_WORKING_DIRECTORY}/configs/agent.dev.toml", "RUST_LOG" = "info,kanade_agent=debug" }
command = "cargo"
args = ["run", "-p", "kanade-agent"]

[tasks.dev]
description = "One-shot sandbox: spawns `nats-dev` (:4223), `backend-dev` (:8081), `agent-dev` (NATS :4223), and `web-dev` (:5173) in parallel — full dev stack isolated from the installed Windows services. Ctrl+C once to tear all four down. Skip this when you'd rather iterate against the production backend — use `web-dev-prod` for that."
run_task = { name = ["nats-dev", "backend-dev", "agent-dev", "web-dev"], parallel = true }

# `agent-dev-N` (N = 1, 2, 3) spawn dev agents with distinct pc_ids
# and isolated data/log directories so a single host can host a
# multi-agent dev fleet. Each task overlays two env vars:
#   * KANADE_DEV_AGENT_ID    → templated into agent.dev.toml as
#     vars.pc_id, which then drives agent.id and the [log] path
#   * KANADE_AGENT_DATA_DIR  → honored by default_paths::data_dir(),
#     so outbox / state.db / local_completions.json live under the
#     per-agent target/dev-data/agents/{pc_id}/ tree
# Same agent.dev.toml is reused — no per-agent config file needed.
#
# `agent-dev-fleet-member` is the cargo-make `extend` base — keeps
# the shared env (config path + RUST_LOG) and command in one place
# so changes (e.g. raising the log level fleet-wide) don't have to
# fan out by hand to every numbered task.

[tasks.agent-dev-fleet-member]
private = true
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
command = "cargo"
args = ["run", "-p", "kanade-agent"]
env = { "KANADE_AGENT_CONFIG" = "${CARGO_MAKE_WORKING_DIRECTORY}/configs/agent.dev.toml", "RUST_LOG" = "info,kanade_agent=debug" }

[tasks.agent-dev-1]
extend = "agent-dev-fleet-member"
private = false
description = "Dev agent #1 — pc_id=dev-pc-1. Pair with agent-dev-2 / agent-dev-3 via `cargo make dev-fleet` to reproduce fan-out behaviour on a single host."
env = { "KANADE_DEV_AGENT_ID" = "dev-pc-1", "KANADE_AGENT_DATA_DIR" = "${CARGO_MAKE_WORKING_DIRECTORY}/target/dev-data/agents/dev-pc-1" }

[tasks.agent-dev-2]
extend = "agent-dev-fleet-member"
private = false
description = "Dev agent #2 — pc_id=dev-pc-2."
env = { "KANADE_DEV_AGENT_ID" = "dev-pc-2", "KANADE_AGENT_DATA_DIR" = "${CARGO_MAKE_WORKING_DIRECTORY}/target/dev-data/agents/dev-pc-2" }

[tasks.agent-dev-3]
extend = "agent-dev-fleet-member"
private = false
description = "Dev agent #3 — pc_id=dev-pc-3."
env = { "KANADE_DEV_AGENT_ID" = "dev-pc-3", "KANADE_AGENT_DATA_DIR" = "${CARGO_MAKE_WORKING_DIRECTORY}/target/dev-data/agents/dev-pc-3" }

[tasks.dev-fleet]
description = "Multi-agent sandbox: nats-dev (:4223) + backend-dev (:8081) + web-dev (:5173) + agent-dev-{1,2,3} in parallel. Reproduces fan-out scenarios (`kanade exec --target all`) on a single host so you can spot bugs that only surface with N>1 agents (e.g. request_id collisions in execution_results)."
run_task = { name = ["nats-dev", "backend-dev", "web-dev", "agent-dev-1", "agent-dev-2", "agent-dev-3"], parallel = true }

[tasks.hook-install]
description = "Install git pre-push hook that runs 'cargo make check'"
script_runner = "@duckscript"
script = '''
hook_dir = set ".git/hooks"
hook_file = set "${hook_dir}/pre-push"
mkdir ${hook_dir}
hook_content = set "#!/bin/sh\n# Installed by: cargo make hook-install\ncargo make check"
writefile ${hook_file} ${hook_content}
# chmod +x is needed on Unix; on Windows the exec bit is a no-op
# AND `chmod` may not be on PATH (it's only present when Git for
# Windows / busybox is wired into the shell). Skip silently if
# `chmod` isn't reachable so plain Windows shells don't fail this
# task with `program not found`.
chmod_path = which chmod
if not is_empty ${chmod_path}
    exec chmod +x ${hook_file}
else
    echo "chmod not on PATH; skipping exec-bit (no-op on Windows; on Unix this means the hook may not be executable)"
end
echo "Installed pre-push hook -> ${hook_file}"
'''

[tasks.apm-install]
description = "Install agent skills declared in apm.yml (Copilot / Claude / Gemini targets). Skipped silently when apm.yml or the apm CLI is absent."
script_runner = "@duckscript"
script = '''
exists = is_path_exists "apm.yml"
if not ${exists}
    echo "no apm.yml; skipping apm-install"
    exit 0
end
apm_path = which apm
if is_empty ${apm_path}
    echo "apm CLI not on PATH; skipping apm-install (install via aka.ms/apm-unix or your platform's package manager)"
    exit 0
end
exec apm install -t copilot,claude,gemini
'''

[tasks.setup]
description = "One-time setup for new contributors: pre-push hook + APM install"
dependencies = ["hook-install", "apm-install"]

[tasks.vcs-fetch]
description = "Fetch latest refs (jj when in a jj workspace, otherwise git)"
# Best-effort: a missing `jj` / `git` binary, an unreachable remote, etc.
# should log but not fail `cargo make on-add` and break `renri add`.
ignore_errors = true
script_runner = "@duckscript"
script = '''
# A non-colocated jj workspace has `.jj/` but no `.git/`, and `git fetch`
# fails there with "not a git repository". Prefer `jj git fetch`, which
# works in pure-jj and colocated repos. Fall back to `git fetch` for
# pure-git (no `.jj/`) worktrees.
jj_present = is_path_exists ".jj"
if ${jj_present}
    exec jj git fetch
else
    exec git fetch
end
'''

# ─── Local deploy (dev / debug) ──────────────────────────────────────
#
# Build the workspace from source, stage into dist/<role>/ via
# build-release.ps1 -FromSource, and run each deploy-<role>.ps1 under
# gsudo. Strictly for the maintainer's own box — production hosts
# should always use the GitHub Releases artifacts via
# `build-release.ps1` (no flags) + `deploy-<role>.ps1` directly.
#
# Tokens injected at deploy time (env override → safe-named default):
#   NATS bearer    : $env:KANADE_DEV_NATS_TOKEN    or 'dev-token-not-for-prod'
#   HTTP static    : $env:KANADE_DEV_STATIC_TOKEN  or 'dev-static-token-not-for-prod'
# Both written to the hardened registry path the deploy scripts
# manage; LocalSystem services pick them up at startup. After the
# install completes, drive the CLI / SPA with:
#   $env:KANADE_AUTH_TOKEN = 'dev-static-token-not-for-prod'
#
# Each task passes -ForceConfig + -Recreate so re-running picks up
# any edits to configs/ and starts from a clean service state.

[tasks.local-deploy]
description = "[dev] Build + install agent + backend + nats + CLI locally. One gsudo prompt for the services; CLI install runs unelevated."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "powershell"
script_extension = "ps1"
script = '''
$ErrorActionPreference = 'Stop'

if (-not (Get-Command gsudo -ErrorAction SilentlyContinue)) {
    throw "gsudo not on PATH. Install via `scoop install gsudo` (https://github.com/gerardog/gsudo)."
}

$token       = if ($env:KANADE_DEV_NATS_TOKEN)   { $env:KANADE_DEV_NATS_TOKEN }   else { 'dev-token-not-for-prod' }
$staticToken = if ($env:KANADE_DEV_STATIC_TOKEN) { $env:KANADE_DEV_STATIC_TOKEN } else { 'dev-static-token-not-for-prod' }
$root        = $env:CARGO_MAKE_WORKING_DIRECTORY

Write-Host "[1/3] Staging service binaries from source..."
& "$root\scripts\build-release.ps1" -FromSource
if ($LASTEXITCODE -ne 0) { throw "build-release.ps1 failed (exit $LASTEXITCODE)" }

Write-Host ""
Write-Host "[2/3] Installing kanade CLI into ~/.cargo/bin (unelevated, no service)..."
& cargo install --path "$root\crates\kanade" --locked --force
if ($LASTEXITCODE -ne 0) { throw "cargo install kanade failed (exit $LASTEXITCODE)" }

Write-Host ""
Write-Host "[3/3] Elevating via gsudo to install services"
Write-Host "      NATS token:   $token"
Write-Host "      Static token: $staticToken"
Write-Host ""
Write-Host "After install, drive the API with:"
Write-Host "    `$env:KANADE_AUTH_TOKEN = '$staticToken'"
Write-Host ""
# Single elevated invocation so the operator sees one UAC prompt.
# Temp .ps1 keeps the command line short + avoids quoting hell.
$tmp = [System.IO.Path]::GetTempFileName()
Remove-Item $tmp -Force
$tmp = "$tmp.ps1"
@"
`$ErrorActionPreference = 'Stop'
& '$root\dist\nats\deploy-nats.ps1'       -NatsToken '$token' -ForceConfig -Recreate
& '$root\dist\backend\deploy-backend.ps1' -NatsToken '$token' -StaticToken '$staticToken' -ForceConfig -Recreate
& '$root\dist\agent\deploy-agent.ps1'     -NatsToken '$token' -ForceConfig -Recreate
"@ | Set-Content -Path $tmp -Encoding utf8
try {
    & gsudo powershell -NoProfile -ExecutionPolicy Bypass -File $tmp
    if ($LASTEXITCODE -ne 0) { throw "Elevated deploy failed (exit $LASTEXITCODE)" }
} finally {
    if (Test-Path $tmp) { Remove-Item -Force $tmp }
}
'''

[tasks.local-deploy-cli]
description = "[dev] Build kanade CLI from source + cargo install into ~/.cargo/bin. No service, no admin."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "powershell"
script_extension = "ps1"
script = '''
$ErrorActionPreference = 'Stop'
$root = $env:CARGO_MAKE_WORKING_DIRECTORY
& cargo install --path "$root\crates\kanade" --locked --force
if ($LASTEXITCODE -ne 0) { throw "cargo install kanade failed (exit $LASTEXITCODE)" }
Write-Host ""
& "$env:USERPROFILE\.cargo\bin\kanade.exe" --version
'''

[tasks.local-deploy-agent]
description = "[dev] Build kanade-agent from source + install via gsudo as KanadeAgent service."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "powershell"
script_extension = "ps1"
script = '''
$ErrorActionPreference = 'Stop'
if (-not (Get-Command gsudo -ErrorAction SilentlyContinue)) {
    throw "gsudo not on PATH. Install via `scoop install gsudo`."
}
$token = if ($env:KANADE_DEV_NATS_TOKEN) { $env:KANADE_DEV_NATS_TOKEN } else { 'dev-token-not-for-prod' }
$root  = $env:CARGO_MAKE_WORKING_DIRECTORY

& "$root\scripts\build-release.ps1" -FromSource -Roles agent
if ($LASTEXITCODE -ne 0) { throw "build-release.ps1 failed (exit $LASTEXITCODE)" }

& gsudo "$root\dist\agent\deploy-agent.ps1" -NatsToken $token -ForceConfig -Recreate
if ($LASTEXITCODE -ne 0) { throw "deploy-agent failed (exit $LASTEXITCODE)" }
'''

[tasks.local-deploy-backend]
description = "[dev] Build kanade-backend from source + install via gsudo as KanadeBackend service."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "powershell"
script_extension = "ps1"
script = '''
$ErrorActionPreference = 'Stop'
if (-not (Get-Command gsudo -ErrorAction SilentlyContinue)) {
    throw "gsudo not on PATH. Install via `scoop install gsudo`."
}
$token       = if ($env:KANADE_DEV_NATS_TOKEN)   { $env:KANADE_DEV_NATS_TOKEN }   else { 'dev-token-not-for-prod' }
$staticToken = if ($env:KANADE_DEV_STATIC_TOKEN) { $env:KANADE_DEV_STATIC_TOKEN } else { 'dev-static-token-not-for-prod' }
$root        = $env:CARGO_MAKE_WORKING_DIRECTORY

& "$root\scripts\build-release.ps1" -FromSource -Roles backend
if ($LASTEXITCODE -ne 0) { throw "build-release.ps1 failed (exit $LASTEXITCODE)" }

& gsudo "$root\dist\backend\deploy-backend.ps1" -NatsToken $token -StaticToken $staticToken -ForceConfig -Recreate
if ($LASTEXITCODE -ne 0) { throw "deploy-backend failed (exit $LASTEXITCODE)" }

Write-Host ""
Write-Host "Drive the API with:  `$env:KANADE_AUTH_TOKEN = '$staticToken'"
'''

[tasks.local-deploy-nats]
description = "[dev] Download nats-server + install via gsudo as KanadeNats service."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "powershell"
script_extension = "ps1"
script = '''
$ErrorActionPreference = 'Stop'
if (-not (Get-Command gsudo -ErrorAction SilentlyContinue)) {
    throw "gsudo not on PATH. Install via `scoop install gsudo`."
}
$token = if ($env:KANADE_DEV_NATS_TOKEN) { $env:KANADE_DEV_NATS_TOKEN } else { 'dev-token-not-for-prod' }
$root  = $env:CARGO_MAKE_WORKING_DIRECTORY

# `nats` is External in build-release.ps1, so it always downloads
# regardless of -FromSource. Omit the flag for clarity.
& "$root\scripts\build-release.ps1" -Roles nats
if ($LASTEXITCODE -ne 0) { throw "build-release.ps1 failed (exit $LASTEXITCODE)" }

& gsudo "$root\dist\nats\deploy-nats.ps1" -NatsToken $token -ForceConfig -Recreate
if ($LASTEXITCODE -ne 0) { throw "deploy-nats failed (exit $LASTEXITCODE)" }
'''

[tasks.local-undeploy]
description = "[dev] Stop + remove KanadeAgent / KanadeBackend / KanadeNats services. Leaves binaries + config on disk."
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}"
script_runner = "powershell"
script_extension = "ps1"
script = '''
$ErrorActionPreference = 'Stop'
if (-not (Get-Command gsudo -ErrorAction SilentlyContinue)) {
    throw "gsudo not on PATH. Install via `scoop install gsudo`."
}

$tmp = [System.IO.Path]::GetTempFileName()
Remove-Item $tmp -Force
$tmp = "$tmp.ps1"
@'
$ErrorActionPreference = 'Continue'
foreach ($svc in 'KanadeAgent', 'KanadeBackend', 'KanadeNats') {
    if (Get-Service -Name $svc -ErrorAction SilentlyContinue) {
        Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
        & sc.exe delete $svc | Out-Null
        Write-Host "Removed $svc"
    } else {
        Write-Host "$svc not installed (skipping)"
    }
}
'@ | Set-Content -Path $tmp -Encoding utf8
try {
    & gsudo powershell -NoProfile -ExecutionPolicy Bypass -File $tmp
} finally {
    if (Test-Path $tmp) { Remove-Item -Force $tmp }
}
'''
