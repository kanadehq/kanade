# kanade NATS — Linux (ARM64) single-VM deployment.
#
# Two listeners:
#   :4222 on localhost — the backend, on the same box, connects here
#     over plain TCP (nats.url = nats://127.0.0.1:4222). Never exposed.
#   WebSocket :8443 on localhost, no_tls — Caddy terminates TLS at :443
#     and reverse-proxies wss://nats.<domain> to this. Remote agents
#     connect wss://nats.<domain>.
#
# The token is read from the process environment ($KANADE_NATS_TOKEN),
# provisioned in /etc/kanade/kanade.env and injected by the systemd unit.
# nats-server expands $VAR references in config from its environment.

listen: "127.0.0.1:4222"
http: "127.0.0.1:8222"          # /varz, /jsz for local health probes

jetstream {
  store_dir: "/var/lib/kanade/nats/jetstream"
  max_memory_store: 1GB
  max_file_store: 20GB
}

websocket {
  listen: "127.0.0.1:8443"
  # Caddy terminates TLS in front; this hop is loopback-only, so plain
  # WebSocket here is not exposed to the network.
  no_tls: true
  # Non-browser clients (async-nats) send no Origin header; do not require
  # a matching one.
  same_origin: false
}

authorization {
  # Provisioned per-deployment by setup.sh — NOT the placeholder/`dev`
  # token. A leaked token here compromises this one customer's fleet.
  token: $KANADE_NATS_TOKEN
}
