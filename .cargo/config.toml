# Binary CPU floors are documented in README.md; keep toolchains current.
# Keep compilers current; do not inherit their distro/host ISA defaults.
# CPU-dispatched native routines may still use newer instructions after probing.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=x86-64"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=generic"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=generic"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1"]

[env]
# Rust codegen options alone do not constrain C/C++ dependencies such as AWS-LC.
# Target-specific flags keep each platform's floor independent of the build host.
CFLAGS_x86_64_unknown_linux_musl = { value = "-march=x86-64 -mtune=generic", force = true }
CXXFLAGS_x86_64_unknown_linux_musl = { value = "-march=x86-64 -mtune=generic", force = true }
CFLAGS_x86_64_unknown_linux_gnu = { value = "-march=x86-64 -mtune=generic", force = true }
CXXFLAGS_x86_64_unknown_linux_gnu = { value = "-march=x86-64 -mtune=generic", force = true }
CFLAGS_x86_64_pc_windows_msvc = { value = "/arch:SSE2", force = true }
CXXFLAGS_x86_64_pc_windows_msvc = { value = "/arch:SSE2", force = true }
CFLAGS_aarch64_unknown_linux_musl = { value = "-march=armv8-a -mtune=generic", force = true }
CXXFLAGS_aarch64_unknown_linux_musl = { value = "-march=armv8-a -mtune=generic", force = true }
CFLAGS_aarch64_unknown_linux_gnu = { value = "-march=armv8-a -mtune=generic", force = true }
CXXFLAGS_aarch64_unknown_linux_gnu = { value = "-march=armv8-a -mtune=generic", force = true }
CFLAGS_aarch64_apple_darwin = { value = "-mcpu=apple-m1", force = true }
CXXFLAGS_aarch64_apple_darwin = { value = "-mcpu=apple-m1", force = true }
