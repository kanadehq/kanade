[profile.dev]
# Windows MSVC link.exe hits PDB LIMIT (LNK1318) once the dependency
# tree gets big (axum + sqlx + reqwest + jsonwebtoken + tokio-cron-
# scheduler + tracing all carry many monomorphisations). Line-tables-
# only debug info keeps backtraces useful while keeping the PDB inside
# the linker's per-record limit on Windows.
debug = "line-tables-only"

[workspace]
resolver = "2"
members = [
    "crates/kanade-shared",
    "crates/kanade-agent",
    "crates/kanade-backend",
    "crates/kanade",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT"
repository   = "https://github.com/yukimemi/kanade"
homepage     = "https://github.com/yukimemi/kanade"
authors      = ["yukimemi <yukimemi@gmail.com>"]
keywords     = ["nats", "jetstream", "endpoint-management", "orchestration"]
categories   = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
tokio              = { version = "1.52", features = ["full"] }
async-nats         = "0.48"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "1.1"
teravars           = { version = "0.1.4", features = ["merge"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"
thiserror          = "2"
clap               = { version = "4.6", features = ["derive", "env"] }
uuid               = { version = "1", features = ["v4", "serde"] }
chrono             = { version = "0.4", features = ["serde"] }
futures            = "0.3"
bytes              = "1"
humantime          = "2"
rand               = "0.9"
axum               = "0.8"
sqlx               = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "migrate"] }
tower              = "0.5"
tower-http         = { version = "0.6", features = ["cors", "trace"] }
serde_yaml         = "0.9"
reqwest            = { version = "0.13", features = ["json"] }
tokio-cron-scheduler = "0.15"
rust-embed         = "8"
mime_guess         = "2"
jsonwebtoken       = "10"
sha2               = "0.10"
