[profile.dev]
# Windows MSVC link.exe hits PDB LIMIT (LNK1318) once the dependency
# tree gets big (axum + sqlx + reqwest + jsonwebtoken + tokio-cron-
# scheduler + tracing all carry many monomorphisations). Line-tables-
# only debug info keeps backtraces useful while keeping the PDB inside
# the linker's per-record limit on Windows.
debug = "line-tables-only"

[workspace]
resolver = "2"
members = [
    "crates/kanade-shared",
    "crates/kanade-agent",
    "crates/kanade-backend",
    "crates/kanade",
    "crates/kanade-client",
]

[workspace.package]
version      = "0.43.7"
edition      = "2024"
rust-version = "1.85"
license      = "MIT"
repository   = "https://github.com/yukimemi/kanade"
homepage     = "https://github.com/yukimemi/kanade"
authors      = ["yukimemi <yukimemi@gmail.com>"]
keywords     = ["nats", "jetstream", "endpoint-management", "orchestration"]
categories   = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
# Internal workspace members — centralised here so the version bump
# from a release PR touches one place instead of three. Each consumer
# crate uses `kanade-shared.workspace = true` and inherits the path
# + version from this single declaration.
kanade-shared      = { path = "crates/kanade-shared", version = "0.43.7" }

tokio              = { version = "1.52.3", features = ["full"] }
async-nats         = "0.49.0"
serde              = { version = "1.0.228", features = ["derive"] }
serde_json         = "1.0.150"
toml               = "1.1.2"
teravars           = { version = "0.1.6", features = ["merge"] }
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender   = "0.2.5"
anyhow             = "1.0.102"
thiserror          = "2.0.18"
clap               = { version = "4.6.1", features = ["derive", "env"] }
uuid               = { version = "1.23.2", features = ["v4", "v5", "serde"] }
chrono             = { version = "0.4.44", features = ["serde"] }
futures            = "0.3.32"
bytes              = "1.11.1"
humantime          = "2.3.0"
rand               = "0.10"
regex              = "1.12.3"
axum               = { version = "0.8.9", features = ["multipart"] }
sqlx               = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "chrono", "migrate"] }
tower              = "0.5.3"
tower-http         = { version = "0.6.11", features = ["cors", "trace"] }
serde_yaml         = "0.9.34"
schemars           = { version = "1.2.1", features = ["chrono04", "uuid1"] }
reqwest            = { version = "0.13.4", features = ["json"] }
tokio-cron-scheduler = "0.15"
rust-embed         = "8.11.0"
mime_guess         = "2.0.5"
jsonwebtoken       = "10.4.0"
sha2               = "0.11.0"
# Decoding NATS Object Store digest strings (`SHA-256=<base64>`)
# back into raw bytes so the agent's hex-formatted Command field
# (#210 / #213) compares cleanly with sha2's hex output.
base64             = "0.22.1"
winreg             = "0.56"
pelite             = "0.10"
# v0.37 Part 2: agent process self-perf via NT process info APIs
# (Win32) / /proc (Linux). v0.40 Part 1: add `disk` + `network`
# features for the host-wide perf loop (Disks / Networks). Still
# avoid `multithread` since we refresh on a 30–60 s cadence.
sysinfo            = { version = "0.39.3", default-features = false, features = ["system", "disk", "network"] }
winres             = "0.1.12"
