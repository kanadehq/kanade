# Sprint 4a smoke-test — wave rollout with a 5-second gap.
# Operator workflow:
#   * agent must be subscribed to commands.group.canary + commands.group.wave1.
#     For the local smoke test we just point the canary group at minipc by
#     publishing to commands.pc.minipc separately, OR run an extra agent that
#     listens on the group subject; the easier path is to flip the agent
#     subscription temporarily (Sprint 4a doesn't ship a group-membership
#     mechanism — that's Sprint 4d alongside the dynamic group KV).
#   * Sprint 4a's deploy_manifest publishes wave[0] immediately,
#     schedules wave[1] for delay=5s via tokio::spawn.

id: wave-echo
version: 1.0.0
description: "Sprint 4a — wave-rollout smoke test"

# `target` is still required by the schema but it's purely informational
# when `rollout` is set; the deploy pipeline iterates `rollout.waves`
# instead of `target.groups`.
target:
  groups: [canary, wave1]

execute:
  shell: powershell
  script: "echo 'wave-fired'"
  timeout: 30s
  jitter: 3s

rollout:
  strategy: wave
  waves:
    - { group: canary, delay: 0s }
    - { group: wave1,  delay: 5s }
