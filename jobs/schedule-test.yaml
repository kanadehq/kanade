# Sprint 3c.scheduler smoke-test schedule. 10-second cadence so a
# `kanade schedule create jobs/schedule-test.yaml` followed by a
# `kanade schedule list` plus a 30-second wait will demonstrate
# multiple firings via GET /api/results and GET /api/audit.

id: echo-every-10s
cron: "*/10 * * * * *"
enabled: true
manifest:
  id: scheduled-echo
  version: 1.0.0
  description: "Sprint 3c.scheduler smoke test — fires every 10 seconds"
  target:
    pcs: [minipc]
  execute:
    shell: powershell
    script: "echo 'scheduler-fired'"
    timeout: 30s
