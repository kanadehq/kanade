# Release-extras — sibling to `release.yml` for project-specific
# post-tag steps. `release.yml` is kata-managed (template.toml
# registers it `when = "always"`), so per-PJ additions have to live
# in a separate workflow file or they'd be clobbered on every kata
# apply. The release.yml comment block documents this contract.
#
# Two jobs run on every `v*.*.*` tag push:
#
# `publish-client-to-backend` — when `KANADE_BACKEND_URL` (+ optional
# `KANADE_BACKEND_TOKEN`) are configured as repo secrets, builds
# kanade-client.exe and POSTs it to that backend's
# `/api/app-packages/kanade-client/<version>` (#207). Closes the loop
# opened by #217 — `install-kanade-client.yaml` can then deploy the
# freshly-tagged client without an operator curl step in between.
# When the secrets are unset the job short-circuits with a notice
# annotation explaining what to set, so open forks aren't accidentally
# trying to POST somewhere they shouldn't. This job stays here because
# release.yml has no client→operator-backend path; it is NOT redundant
# with the kata-managed pipeline.
#
# `sbom` — generates one CycloneDX document per shipped binary and attaches
# them to the GitHub Release (#1450). Lives here rather than in release.yml
# for the reason that file's own header gives: it is kata-managed and names
# "SBOM generation" as an example of what belongs in a sibling workflow.
# THIRD-PARTY-NOTICES.md (#1449) answers "did we honour the licences" for a
# human; this answers "what is inside this binary" for a tool, which is what
# a consumer needs when an advisory lands. Per binary rather than per
# workspace because the four do not contain the same code.
#
# History: this file also carried `upload-windows-bins` and
# `publish-crates`, both workarounds for the windows-msvc multi-bin
# hardlink race that failed release.yml's build and (via `needs:
# build`) blocked the GitHub Release + crates.io publish. That race is
# fixed at the source in pj-rust-workspace 0.3.1 (release.yml now
# builds windows-msvc per-package, applied in #309), so release.yml's
# native `release` + `publish` jobs cover all bins (incl. the Windows
# client) and crates.io again — the two fallbacks were removed.

name: Release extras

on:
  push:
    tags: ["v*.*.*"]
  # `workflow_dispatch` lets an operator manually re-publish a
  # specific tag's client without re-tagging — useful for the
  # "rebuilt with a fix to the installer manifest" case.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      # Job-scoped override of the workflow's `contents: read`: uploading
      # release assets needs write. Nothing else in this workflow does, so the
      # grant stays on the one job that needs it.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here runs an authenticated git operation — the release
          # upload uses GITHUB_TOKEN via the API, not git. Same reasoning as
          # licenses.yml.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - uses: oven-sh/setup-bun@v2

      # The npm half of each BOM comes from the same resolver that produces
      # THIRD-PARTY-NOTICES.md, so both need the installed trees on disk.
      # --ignore-scripts for the reason licenses.yml gives: this job reads
      # dependency content rather than running it.
      - name: Install SPA deps
        working-directory: crates/kanade-backend/web
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install client WebView deps
        working-directory: crates/kanade-client/web
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate SBOMs
        run: node scripts/licenses/sbom.mjs --out sbom

      # Fail loudly rather than attaching an empty or partial asset set. The
      # count is checked against the binaries cargo actually reports, so a new
      # workspace binary cannot ship without an SBOM just because nobody
      # updated a hardcoded number here.
      - name: Verify one SBOM per shipped binary
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cargo metadata --no-deps --format-version 1 \
            | jq '[.packages[] | select(any(.targets[]; .kind | index("bin")))] | length')
          actual=$(find sbom -name '*.cdx.json' | wc -l | tr -d ' ')
          echo "binaries: $expected, SBOMs: $actual"
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::expected $expected SBOMs (one per binary-producing workspace member) but found $actual"
            exit 1
          fi

      - uses: softprops/action-gh-release@v3
        with:
          files: sbom/*.cdx.json
          fail_on_unmatched_files: true

  publish-client-to-backend:
    name: Publish kanade-client to operator backend
    runs-on: windows-latest
    env:
      KANADE_BACKEND_URL: ${{ secrets.KANADE_BACKEND_URL }}
      KANADE_BACKEND_TOKEN: ${{ secrets.KANADE_BACKEND_TOKEN }}
    steps:
      # Gate the rest of the job on whether secrets are configured.
      # `if:` can't reference `secrets.*` directly, so we pass them
      # via `env:` (above) and check in shell. Output drives the
      # subsequent step-level `if:` conditions.
      - name: Short-circuit when no backend configured
        id: gate
        shell: bash
        run: |
          if [[ -z "${KANADE_BACKEND_URL:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KANADE_BACKEND_URL secret not set — skipping publish. Set repo secrets KANADE_BACKEND_URL (+ optional KANADE_BACKEND_TOKEN bearer) to auto-upload kanade-client.exe to OBJECT_APP_PACKAGES on tag push."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.configured == 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.configured == 'true'
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.configured == 'true'

      # Build the Tauri WebView BEFORE `cargo build`. Tauri bakes
      # `crates/kanade-client/web/dist` into the binary at compile time
      # (frontendDist + the custom-protocol feature), but plain
      # `cargo build` does NOT run tauri.conf's `beforeBuildCommand`, and
      # `dist/assets/` is .gitignored. Without this step the binary embeds
      # only the committed index.html stub (broken asset refs) and the
      # shipped client's WebView fails to load. release.yml builds this via
      # `cargo make web-build`; this standalone job builds just the client
      # WebView directly. (--frozen-lockfile: the committed bun.lock pins it.)
      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.configured == 'true'
      - name: Build kanade-client WebView
        if: steps.gate.outputs.configured == 'true'
        shell: bash
        run: |
          cd crates/kanade-client/web
          bun install --frozen-lockfile
          bun run build

      # Build only kanade-client (not the full workspace) — this is
      # the only target this workflow ships. release.yml's matrix
      # already builds every workspace bin for the GitHub Release
      # artifacts; this is a separate consumer with a different
      # destination.
      - name: Build kanade-client (release)
        if: steps.gate.outputs.configured == 'true'
        run: cargo build -p kanade-client --release --target x86_64-pc-windows-msvc

      # Resolve the version from the pushed tag (strip leading `v`)
      # for manual workflow_dispatch runs that target an older tag,
      # `GITHUB_REF_NAME` is still the tag name, so the same shape
      # works.
      - name: POST kanade-client.exe to backend
        if: steps.gate.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          binary="target/x86_64-pc-windows-msvc/release/kanade-client.exe"
          if [[ ! -f "$binary" ]]; then
            echo "::error::expected $binary missing — cargo build step did not produce the artifact"
            exit 1
          fi
          size=$(wc -c < "$binary")
          url="${KANADE_BACKEND_URL%/}/api/app-packages/kanade-client/${version}"
          echo "Uploading kanade-client ${version} (${size} bytes) to ${url}"
          curl_args=(
            --fail-with-body
            --silent
            --show-error
            -F "file=@${binary}"
            -H "X-Kanade-Source: release-workflow"
          )
          if [[ -n "${KANADE_BACKEND_TOKEN:-}" ]]; then
            curl_args+=(-H "Authorization: Bearer ${KANADE_BACKEND_TOKEN}")
          fi
          curl "${curl_args[@]}" "${url}"
          echo "Publish succeeded — operator can now `kanade exec install-kanade-client` without a manual curl step."
