# SPA unit tests + build/type-check + browser component tests for the
# kanade-backend frontend.
#
# Lives in its own workflow file (not the kata-managed ci.yml) so a future
# `kata apply` from the upstream preset doesn't clobber it — same reasoning
# as integration.yml.
#
# Runs on EVERY pull request, not just ones touching the SPA. It used to be
# path-filtered to `crates/kanade-backend/web/**`, which is cheaper on a
# Rust-only PR but makes the check un-requireable: a required status check
# that never runs on a given PR is reported as forever-pending and blocks the
# merge. Because it was advisory rather than required, #1096 and #1101 both
# auto-merged with this job RED, breaking `main`'s SPA build and producing two
# tagged releases (v0.44.27, v0.44.28) with no binaries — the builds died at
# `cargo make web-build`. Running unconditionally is the price of the job
# being able to block a merge (#1100).
#
# Deliberately NOT conditionally skipped on non-SPA changes. A skip needs
# change-detection logic, and a bug in THAT would let a red frontend through
# again — reintroducing the exact failure this exists to prevent. For a gate,
# "cannot be skipped" is the safety property; the ~40s on a Rust-only PR is a
# fair price for it.

name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate the CT screenshot baselines and upload them as an artifact (Linux). Download + commit the artifact; never generate baselines on a dev machine — a win32/darwin render never matches the CI run.'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bun test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        working-directory: crates/kanade-backend/web
        # --frozen-lockfile: the committed bun.lock pins the tree, so a
        # transitive bump can't silently change what's under test.
        run: bun install --frozen-lockfile
      - name: Unit tests
        working-directory: crates/kanade-backend/web
        run: bun test
      - name: Type-check and build
        working-directory: crates/kanade-backend/web
        # `bun run build` is `tsc -b && vite build` — this is the only place
        # the SPA's types are checked in CI, since ci.yml is Rust-only and
        # release.yml builds the SPA but only on a tag.
        run: bun run build

  component:
    name: playwright ct
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        working-directory: crates/kanade-backend/web
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: crates/kanade-backend/web
        # Chromium only (matches playwright-ct.config.ts) with its OS libs.
        # Pinned to the version the installed @playwright/experimental-ct-react
        # ships, so the browser can't drift from the runner independently.
        run: bunx playwright install --with-deps chromium
      - name: Component tests (hit-testing, non-overlap, screenshots)
        working-directory: crates/kanade-backend/web
        # Browser-level coverage for what jsdom can't see — layout, stacking,
        # hit-testing, and screenshot baselines (Issue #1094). CI=1 switches
        # the reporter to `line`. On a `workflow_dispatch` with
        # `update_snapshots`, regenerate the baselines instead of comparing —
        # the upload step below then hands them back to be committed.
        env:
          CI: '1'
        run: >-
          bun run test:ct
          ${{ (github.event_name == 'workflow_dispatch' && inputs.update_snapshots) && '-- --update-snapshots' || '' }}
      - name: Upload regenerated screenshot baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: ct-screenshots-linux
          path: crates/kanade-backend/web/src/__screenshots__/
          if-no-files-found: error
