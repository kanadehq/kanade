# Offline-boot regression coverage from #141 (closes #165).
#
# Lives in its own workflow file (not the kata-managed ci.yml) so a
# future `kata apply` from the upstream preset doesn't clobber the
# integration job. Triggers match ci.yml — push to main + every PR
# + manual dispatch — so the agent's offline-tolerant boot path is
# verified end-to-end on every change.

name: Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      conformance_repeat:
        description: >-
          How many times to run the NATS role conformance suite on each
          operating system (the timing distribution is in the step summary).
        type: string
        default: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned so a `nats-server` release with a behaviour change can't
  # silently break the offline_boot suite. Bump when intentionally
  # upgrading.
  NATS_SERVER_VERSION: "2.14.1"

jobs:
  offline-boot:
    # Spawns a real `nats-server` + the agent binary per test;
    # verifies the agent (a) survives broker-unavailable boot,
    # (b) catches up when broker appears, (c) reconnects after
    # broker restart. The suite is `#[ignore]`-gated so the main
    # `cargo test` in ci.yml stays fast for runners without
    # `nats-server`; this job explicitly opts in via `-- --ignored`.
    name: offline-boot (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Same save-only-on-main policy as ci.yml's other matrix
          # jobs — see ci.yml:30-35 for the windows tar.exe rationale.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install nats-server (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          archive="nats-server-v${NATS_SERVER_VERSION}-linux-amd64"
          curl -fsSL -o ns.tar.gz \
            "https://github.com/nats-io/nats-server/releases/download/v${NATS_SERVER_VERSION}/${archive}.tar.gz"
          tar -xzf ns.tar.gz
          # Linux/macOS install into /usr/local/bin which is on
          # PATH for the default bash shell on GitHub-hosted runners
          # (no GITHUB_PATH append needed); the Windows step below
          # has to opt in explicitly via $env:GITHUB_PATH.
          sudo mv "${archive}/nats-server" /usr/local/bin/
          nats-server --version

      - name: Install nats-server (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # macos-latest is arm64 (macOS 14+ runners). If GitHub ever
          # pivots back to Intel-only macos-latest, switch the arch
          # suffix to amd64.
          archive="nats-server-v${NATS_SERVER_VERSION}-darwin-arm64"
          curl -fsSL -o ns.tar.gz \
            "https://github.com/nats-io/nats-server/releases/download/v${NATS_SERVER_VERSION}/${archive}.tar.gz"
          tar -xzf ns.tar.gz
          sudo mv "${archive}/nats-server" /usr/local/bin/
          nats-server --version

      - name: Install nats-server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Match the Linux/macOS `set -euo pipefail` strictness so a
          # 404 on a renamed release archive surfaces with a clean
          # "download failed" instead of a confusing "Expand-Archive:
          # path does not exist" downstream.
          $ErrorActionPreference = 'Stop'
          $archive = "nats-server-v$env:NATS_SERVER_VERSION-windows-amd64"
          $url = "https://github.com/nats-io/nats-server/releases/download/v$env:NATS_SERVER_VERSION/$archive.zip"
          Invoke-WebRequest -Uri $url -OutFile ns.zip
          Expand-Archive ns.zip -DestinationPath .
          $bin = Join-Path $PWD $archive
          # Append to GITHUB_PATH so the harness's
          # `which("nats-server")` probe finds the binary.
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & "$bin\nats-server.exe" --version

      - name: Offline-boot integration tests
        run: cargo test -p kanade-agent --test offline_boot -- --ignored

      - name: NATS auth (user / token fallback) integration tests
        run: cargo test -p kanade-shared --test nats_auth_live -- --ignored

      - name: NATS authentication-mode switch under injected probe faults
        # Restarts a real broker between `token` and `users` under running
        # supervised role child processes while a proxy drops, holds or
        # slows probes and stalls role handshakes. Assert actual non-zero
        # exits and receive progress against a shared recovery deadline.
        run: cargo test -p kanade-shared --test nats_auth_switch -- --ignored

      - name: Agent config watch does not lose a write made before the watch opens
        run: cargo test -p kanade-agent --bin kanade-agent config_supervisor::live -- --ignored

      - name: Build backend, agent and CLI for the role conformance test
        # The backend is built in release: a debug build overflows the
        # main-thread stack on Windows, and release is what ships there.
        shell: bash
        run: |
          cargo build -p kanade-agent -p kanade
          cargo build --release -p kanade-backend
          echo "KANADE_CONFORMANCE_BACKEND_BIN=$GITHUB_WORKSPACE/target/release/kanade-backend${{ runner.os == 'Windows' && '.exe' || '' }}" >> "$GITHUB_ENV"

      - name: Build the role conformance test once
        run: cargo test -p kanade-agent --test nats_role_conformance --no-run

      - name: NATS role-level authorization conformance
        # Runs the suite `conformance_repeat` times (1 unless dispatched by
        # hand) without rebuilding, keeps going after a failed run so the
        # distribution includes it, then writes the per-OS timing table to the
        # step summary and fails if any run failed.
        shell: bash
        env:
          CONFORMANCE_REPEAT: ${{ inputs.conformance_repeat || '1' }}
        run: |
          # No -e: a failed run must not end the step before the rest of the
          # repeats and the summary.
          set +e
          set -uo pipefail
          case "$CONFORMANCE_REPEAT" in
            ''|*[!0-9]*|0) echo "conformance_repeat must be a positive integer" >&2; exit 2 ;;
          esac
          timings="$RUNNER_TEMP/conformance-timings.jsonl"
          : > "$timings"
          export KANADE_CONFORMANCE_TIMINGS="$timings"
          failures=0
          for i in $(seq 1 "$CONFORMANCE_REPEAT"); do
            echo "::group::conformance run $i of $CONFORMANCE_REPEAT"
            start=$SECONDS
            cargo test -p kanade-agent --test nats_role_conformance -- --ignored --nocapture
            rc=$?
            secs=$((SECONDS - start))
            echo "::endgroup::"
            outcome=ok
            if [ "$rc" -ne 0 ]; then outcome=failed; failures=$((failures + 1)); fi
            printf '{"kind":"suite","os":"%s","test":"all","switch":"","step":"suite","secs":%s,"outcome":"%s","concurrent":0}\n' \
              "$(echo "$RUNNER_OS" | tr 'A-Z' 'a-z')" "$secs" "$outcome" >> "$timings"
            echo "run $i: $outcome in ${secs}s"
          done
          status=0
          py=$(command -v python3 || command -v python)
          if [ -z "$py" ]; then
            echo "::error::python is not available to summarize the conformance timings"
            status=1
          else
            "$py" scripts/ci/conformance_timings.py "$timings"
            summary_rc=$?
            if [ "$summary_rc" -ne 0 ]; then
              echo "::error::conformance timing summary failed (exit $summary_rc)"
              status=1
            fi
          fi
          if [ "$failures" -ne 0 ]; then
            echo "$failures of $CONFORMANCE_REPEAT conformance runs failed" >&2
            status=1
          fi
          exit "$status"
