# Repo-owned: keep GUI bundle checks outside kata-managed ci.yml.
name: Client desktop
on:
  pull_request:
  workflow_dispatch:

jobs:
  macos-bundle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Stable release signing identity regressions
        run: bash scripts/ci/test-macos-codesign.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Build and validate production app (Apple Silicon, macOS 14 target)
        run: sh scripts/build-client-macos.sh
      - name: Unix KLP, shared policy and private storage regressions
        run: cargo test --locked -p kanade-client --all-targets
      - name: Package validator regressions (negative cases on a synthetic app)
        run: python3 -I scripts/ci/test_client_macos_pkg.py
      - name: Build and validate the unsigned payload-only .pkg
        run: SKIP_APP_BUILD=1 sh scripts/build-client-macos-pkg.sh
      - name: Upload test .pkg (short-lived, unsigned, not a release)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kanade-client-macos-test-pkg
          path: target/client-macos-pkg
          retention-days: 7
          if-no-files-found: error

  windows-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo check --locked -p kanade-client --all-targets
      - run: cargo test --locked -p kanade-client --all-targets
