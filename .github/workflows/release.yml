name: Release to crates.io

# Publish all four kanade crates to crates.io when a `v*` tag is pushed.
# Internal `kanade-shared` dep is declared with both `path` and `version`
# so cargo publish keeps the version on the published manifest while
# local builds keep using the path.
#
# Requires the `CARGO_REGISTRY_TOKEN` repo secret (cargo login output).
#
# Run on Windows so the kanade-agent verify step can compile the
# wmi crate (Windows-only dep). Publishing itself is OS-agnostic.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # upload binaries to the GitHub Release

jobs:
  # crates.io publish is OS-agnostic and only needs to run once per
  # tag, so keep it on a single Windows runner (cargo publish
  # --verify of kanade-agent needs to compile the wmi crate, which
  # only resolves on a Windows target).
  publish-crates:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2.9.1
        # rust-cache restore has flaked on transient GH Actions cache
        # backend errors before; fall through to a cold cargo build
        # instead of failing the whole release pipeline.
        continue-on-error: true

      # Re-build the SPA bundle before any cargo step touches
      # kanade-backend. The committed web/dist/ is what cargo would
      # otherwise package, and a stale dist (e.g., operator forgot
      # to run `cargo make web-build` before bumping) shouldn't slip
      # through to crates.io. bun's install + Vite build adds ~30s.
      - uses: oven-sh/setup-bun@v2
      - name: Build SPA bundle
        working-directory: crates/kanade-backend/web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Publish kanade-shared
        run: cargo publish -p kanade-shared --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index to settle
        shell: bash
        run: sleep 60

      - name: Publish kanade-agent
        run: cargo publish -p kanade-agent --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # --allow-dirty because the SPA bundle was just (re-)built in the
      # step above — the freshly-generated `web/dist/` carries
      # different content-hash filenames than whatever the committer
      # had locally, so cargo's clean-tree check is guaranteed-stale
      # for kanade-backend specifically. The published crate IS the
      # CI-built bundle by design (rust-embed bakes it in at compile
      # time); committing the local dist is only for `cargo run`
      # convenience on the maintainer's box.
      - name: Publish kanade-backend
        run: cargo publish -p kanade-backend --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish kanade (CLI)
        run: cargo publish -p kanade --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Build native release binaries on every supported OS and attach
  # them to the GitHub Release. kanade-agent's wmi / windows-service
  # crates are target_os="windows" gated, so the binary compiles
  # cleanly on Linux / macOS — it just does nothing useful there
  # (no WMI inventory, no SCM hooks). Backend + CLI work on all 3.
  build-artifacts:
    needs: publish-crates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_suffix: '.exe'
            target_label: 'windows'
          - os: ubuntu-latest
            asset_suffix: ''
            target_label: 'linux'
          - os: macos-latest
            asset_suffix: ''
            target_label: 'macos-arm64'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true

      # rust-embed bakes web/dist/ into kanade-backend.exe at compile
      # time. Build the SPA fresh on each runner before cargo builds
      # so the artefact uploaded to the Release page carries the
      # bundle produced from this exact commit (rather than whatever
      # was last `cargo make web-build`-ed locally and committed).
      - uses: oven-sh/setup-bun@v2
      - name: Build SPA bundle
        working-directory: crates/kanade-backend/web
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build release binaries
        run: cargo build --release --workspace --bins

      # Rename per-OS for the release page. Windows keeps the bare
      # `kanade-agent.exe` form to stay backwards-compatible with
      # build-release.ps1 -FromRelease (it currently fetches
      # `<bin>.exe`); Linux + macOS append a target label so the
      # three OSes coexist on one release tag.
      - name: Stage artefacts
        shell: bash
        run: |
          mkdir -p staged
          if [ "${{ matrix.target_label }}" = "windows" ]; then
            cp target/release/kanade-agent.exe   staged/
            cp target/release/kanade-backend.exe staged/
            cp target/release/kanade.exe         staged/
          else
            cp target/release/kanade-agent   staged/kanade-agent-${{ matrix.target_label }}
            cp target/release/kanade-backend staged/kanade-backend-${{ matrix.target_label }}
            cp target/release/kanade         staged/kanade-${{ matrix.target_label }}
          fi
          ls -la staged/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: staged/*
          fail_on_unmatched_files: true
