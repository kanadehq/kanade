name: Debug — Windows workspace --bins drop

# Diagnostic workflow for the issue where `cargo build --release
# --workspace --bins --target x86_64-pc-windows-msvc` on
# windows-latest reports success but only produces ONE of the
# four workspace binaries. PR #243 worked around this; this
# workflow's job is to find the root cause so the workaround can
# be removed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-bins-mirror-release:
    # Mirrors release.yml's build step exactly — same checkout
    # version, same toolchain action, WITH Swatinem/rust-cache,
    # NO -vv. If the bug reproduces here but not in the -vv-only
    # diagnostic that was tried first, rust-cache (or the lack of
    # -vv) is implicated. If it still doesn't reproduce, the
    # remaining difference is the matrix wrapper around the
    # release.yml job — that's all that's left.
    name: cargo build --workspace --bins (mirrors release.yml exactly)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Disk space before
        shell: bash
        run: df -h /

      - name: cargo --version
        run: cargo --version --verbose

      - name: cargo build (capture stdout+stderr)
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --workspace --bins --target x86_64-pc-windows-msvc 2>&1 | tee build.log
          echo "exit_code=$?"

      - name: Disk space after
        shell: bash
        run: df -h /

      - name: Inventory target/release after build
        shell: bash
        run: |
          set -x
          ls -laR target/x86_64-pc-windows-msvc/release/ > tree.log 2>&1 || true
          echo "---"
          echo "EXEs at target/x86_64-pc-windows-msvc/release/:"
          ls target/x86_64-pc-windows-msvc/release/*.exe 2>&1 || true
          echo "---"
          echo "EXEs at target/x86_64-pc-windows-msvc/release/deps/:"
          ls target/x86_64-pc-windows-msvc/release/deps/*.exe 2>&1 || true

      - name: Grep build.log for link-related lines
        shell: bash
        run: |
          echo "=== Running rustc invocations (--crate-type bin) ==="
          grep -E "Running.*--crate-type bin" build.log | head -20 || true
          echo "=== hardlink / copy mentions ==="
          grep -iE "hardlink|hard link|copying|copied" build.log | head -40 || true
          echo "=== link.exe / lld-link invocations ==="
          grep -iE "link\.exe|lld-link" build.log | head -20 || true
          echo "=== warnings ==="
          grep -iE "warning" build.log | head -40 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-workspace-bins
          path: |
            build.log
            tree.log

  per-package-baseline:
    # Control group: build each bin via `cargo build -p <pkg>` in
    # sequence. This is what PR #243's release-extras.yml does
    # and is known to produce all 4 bins. If the workspace job
    # above only produces 1, this should produce all 4 — that
    # rules in "--workspace --bins" as the trigger.
    name: cargo build -p <pkg> sequential (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build each bin in sequence
        run: |
          cargo build -p kanade-shared --release --target x86_64-pc-windows-msvc
          cargo build -p kanade-agent  --release --target x86_64-pc-windows-msvc
          cargo build -p kanade-backend --release --target x86_64-pc-windows-msvc
          cargo build -p kanade         --release --target x86_64-pc-windows-msvc
          cargo build -p kanade-client  --release --target x86_64-pc-windows-msvc

      - name: Inventory target/release after per-package builds
        shell: bash
        run: ls target/x86_64-pc-windows-msvc/release/*.exe || true
