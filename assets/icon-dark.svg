<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="kanade icon (dark)">
  <title>kanade — 奏 (dark)</title>

  <defs>
    <linearGradient id="g-baton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#9a73d9"/>
      <stop offset="0.5" stop-color="#f5cf5a"/>
      <stop offset="1"   stop-color="#4dc4b5"/>
    </linearGradient>
  </defs>

  <!--
    Dark-mode twin of icon.svg. Baton gradient is brightened a notch
    and 奏 renders in warm cream so the character holds up against
    GitHub's dark-theme card backgrounds.
  -->

  <line x1="58" y1="40" x2="210" y2="158"
        stroke="url(#g-baton)" stroke-width="8" stroke-linecap="round"/>

  <circle cx="52" cy="34" r="14" fill="#9a73d9"/>

  <text x="128" y="226"
        font-family="'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', 'IPAexMincho', 'Source Han Serif JP', serif"
        font-size="108" font-weight="700"
        fill="#f5f0e6" text-anchor="middle">奏</text>
</svg>
