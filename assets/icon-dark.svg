<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="kanade icon (dark)">
  <title>kanade — 奏 (dark)</title>

  <!--
    Dark-mode twin of icon.svg. Strokes are brightened a notch and
    奏 renders in warm cream so the character holds up against
    GitHub's dark-theme card backgrounds.
  -->
  <g fill="none" stroke-width="11" stroke-linecap="round">
    <path d="M 44 110 C 56 18, 200 18, 212 110" stroke="#9a73d9"/>
    <path d="M 74 110 C 84 50, 172 50, 182 110" stroke="#4dc4b5"/>
    <path d="M 102 110 C 110 78, 146 78, 154 110" stroke="#f5cf5a"/>
  </g>

  <text x="128" y="210"
        font-family="'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', 'IPAexMincho', 'Source Han Serif JP', serif"
        font-size="112" font-weight="700"
        fill="#f5f0e6" text-anchor="middle">奏</text>
</svg>
