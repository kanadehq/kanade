<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 160" role="img" aria-label="kanade — orchestrate fleets of Windows endpoints (dark)">
  <title>kanade — 奏 — orchestrate fleets of Windows endpoints (dark)</title>

  <defs>
    <linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4dc4b5"/>
      <stop offset="1" stop-color="#2a9d8f"/>
    </linearGradient>
    <linearGradient id="g-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5cf5a"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
    <linearGradient id="g-violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a73d9"/>
      <stop offset="1" stop-color="#5b3a8c"/>
    </linearGradient>
  </defs>

  <g transform="translate(8, 4) scale(0.6)">
    <g>
      <rect x="36"  y="184" width="20" height="48"  rx="6" fill="url(#g-teal)"/>
      <rect x="68"  y="160" width="20" height="72"  rx="6" fill="url(#g-teal)"/>
      <rect x="100" y="124" width="20" height="108" rx="6" fill="url(#g-amber)"/>
      <rect x="132" y="100" width="20" height="132" rx="6" fill="url(#g-amber)"/>
      <rect x="164" y="124" width="20" height="108" rx="6" fill="url(#g-violet)"/>
      <rect x="196" y="160" width="20" height="72"  rx="6" fill="url(#g-violet)"/>
    </g>
    <text x="128" y="78"
          font-family="'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', 'IPAexMincho', 'Source Han Serif JP', serif"
          font-size="72" font-weight="700"
          fill="#f5f0e6" text-anchor="middle">奏</text>
  </g>

  <text x="180" y="88"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="64" letter-spacing="-2"
        fill="#f5f0e6">kanade</text>

  <text x="182" y="122"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
