<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>kanade — orchestrate fleets of Windows endpoints</title>

  <defs>
    <linearGradient id="g-baton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#5b3a8c"/>
      <stop offset="0.5" stop-color="#d4a017"/>
      <stop offset="1"   stop-color="#2a9d8f"/>
    </linearGradient>
    <linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7f0"/>
      <stop offset="1" stop-color="#f0ece0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#g-bg)"/>

  <!-- icon tile, scaled up, left-centered -->
  <g transform="translate(180, 128) scale(1.5)">
    <rect x="6" y="6" width="244" height="244" rx="46" fill="#f5f0e6" stroke="#d9d2c4" stroke-width="3"/>
    <path d="M 54 60 A 12 12 0 1 1 68 41 L 212 162 Z" fill="url(#g-baton)"/>
    <text x="128" y="222"
          font-family="'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', 'IPAexMincho', 'Source Han Serif JP', serif"
          font-size="104" font-weight="700"
          fill="#1a1a1a" text-anchor="middle">奏</text>
  </g>
  <!-- wordmark -->
  <text x="620" y="330"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="120" letter-spacing="-3"
        fill="#1a1a1a">kanade</text>

  <!-- tagline -->
  <text x="624" y="390"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-style="italic" font-size="28"
        fill="#5a5a5a">奏 — orchestrate fleets of Windows endpoints</text>

  <!-- subtitle -->
  <text x="624" y="440"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="24"
        fill="#8a8a8a">Rust · NATS JetStream · kanadehq</text>
</svg>
