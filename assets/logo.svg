<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 160" role="img" aria-label="kanade — orchestrate fleets of Windows endpoints">
  <title>kanade — 奏 — orchestrate fleets of Windows endpoints</title>

  <defs>
    <linearGradient id="g-baton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#5b3a8c"/>
      <stop offset="0.5" stop-color="#d4a017"/>
      <stop offset="1"   stop-color="#2a9d8f"/>
    </linearGradient>
  </defs>

  <!-- icon (matches assets/icon.svg, scaled into the wordmark band) -->
  <g transform="translate(4, 4) scale(0.6)">
    <line x1="58" y1="40" x2="210" y2="158"
          stroke="url(#g-baton)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="52" cy="34" r="14" fill="#5b3a8c"/>
    <text x="128" y="226"
          font-family="'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', 'IPAexMincho', 'Source Han Serif JP', serif"
          font-size="108" font-weight="700"
          fill="#1a1a1a" text-anchor="middle">奏</text>
  </g>

  <!-- wordmark -->
  <text x="180" y="88"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="64" letter-spacing="-2"
        fill="#1a1a1a">kanade</text>

  <!-- tagline -->
  <text x="182" y="122"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-style="italic" font-size="16"
        fill="#5a5a5a">奏 — orchestrate fleets of Windows endpoints</text>
</svg>
