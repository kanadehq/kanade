<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="kanade icon">
  <title>kanade — 奏</title>

  <defs>
    <linearGradient id="g-baton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#5b3a8c"/>
      <stop offset="0.5" stop-color="#d4a017"/>
      <stop offset="1"   stop-color="#2a9d8f"/>
    </linearGradient>
  </defs>

  <!--
    奏 (kanade) — a conductor's baton (タクト) cuts diagonally across
    the field above the character. Handle ball (violet) at upper-left
    is the conductor's grip; the shaft fades through amber to teal at
    the tip (lower-right). The colour triad rides along the baton
    itself rather than the surrounding space, so 奏 carries the visual
    weight as the answering chord.
  -->

  <!-- baton shaft -->
  <line x1="58" y1="40" x2="210" y2="158"
        stroke="url(#g-baton)" stroke-width="8" stroke-linecap="round"/>

  <!-- handle ball -->
  <circle cx="52" cy="34" r="14" fill="#5b3a8c"/>

  <!-- 奏 anchored centre-bottom -->
  <text x="128" y="226"
        font-family="'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', 'IPAexMincho', 'Source Han Serif JP', serif"
        font-size="108" font-weight="700"
        fill="#1a1a1a" text-anchor="middle">奏</text>
</svg>
