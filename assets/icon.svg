<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="kanade icon">
  <title>kanade — 奏</title>

  <!--
    奏 (kanade) — three concentric conductor's baton sweeps crown
    the character. The gesture radiates outward like a downbeat
    broadcast to every endpoint in the fleet; amber is the moment
    of the strike, teal the immediate echo, violet the farthest
    reach. Open arcs (not full circles) keep the motion of the
    swing — the baton has just lifted, not landed.
  -->
  <g fill="none" stroke-width="11" stroke-linecap="round">
    <path d="M 44 110 C 56 18, 200 18, 212 110" stroke="#5b3a8c"/>
    <path d="M 74 110 C 84 50, 172 50, 182 110" stroke="#2a9d8f"/>
    <path d="M 102 110 C 110 78, 146 78, 154 110" stroke="#d4a017"/>
  </g>

  <text x="128" y="210"
        font-family="'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', 'IPAexMincho', 'Source Han Serif JP', serif"
        font-size="112" font-weight="700"
        fill="#1a1a1a" text-anchor="middle">奏</text>
</svg>
