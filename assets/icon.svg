<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="kanade icon">
  <title>kanade — 奏</title>

  <defs>
    <linearGradient id="g-baton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#5b3a8c"/>
      <stop offset="0.5" stop-color="#d4a017"/>
      <stop offset="1"   stop-color="#2a9d8f"/>
    </linearGradient>
  </defs>

  <!--
    奏 (kanade) — a single tapered baton (タクト) sweeps diagonally
    across the upper half: a rounded handle on the upper-left grows
    seamlessly into the tip on the lower-right. The colour triad
    rides the gradient from violet handle → amber midline → teal
    tip. 奏 anchors the lower half as the answering chord.

    Geometry: handle is a circle at (60, 50) with r=20; the two
    tangent points from the tip (212, 162) land at ≈(47, 66) and
    ≈(73, 35). The path traces the back half of the handle (arc)
    then both tangent lines (to the tip and back), so the silhouette
    flows smoothly from full circle into a point.
  -->
  <path d="M 47 66 A 20 20 0 1 0 73 35 L 212 162 Z"
        fill="url(#g-baton)"/>

  <text x="128" y="226"
        font-family="'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', 'IPAexMincho', 'Source Han Serif JP', serif"
        font-size="108" font-weight="700"
        fill="#1a1a1a" text-anchor="middle">奏</text>
</svg>
