# Spec §2.4.4 — same file drives Windows + Linux backends. teravars
# (≥ 0.1.5 fixes [vars] self-reference through load_merged) resolves
# vars.base / vars.log_dir up front, so sqlite_path and log.path can
# reference them cleanly.

[vars]
base    = '''{% if is_windows() %}{{ env(name="ProgramData") }}\Kanade\data{% else %}/var/lib/kanade{% endif %}'''
log_dir = '''{% if is_windows() %}{{ env(name="ProgramData") }}\Kanade\logs{% else %}/var/log/kanade{% endif %}'''

[server]
bind = '0.0.0.0:8080'

[nats]
url = 'nats://127.0.0.1:4222'

[db]
sqlite_path = '{{ vars.base }}/backend.db'

[log]
path  = '{{ vars.log_dir }}/backend.log'
level = 'info'
