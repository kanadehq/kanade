# Restart the kanade-agent Windows service (KanadeAgent) on a target PC.
#
# The agent runs the job as LocalSystem but CANNOT stop its own service
# inline — that would kill the very PowerShell executing this script
# before it could finish (and the result would never be reported). Same
# constraint install-kanade-agent.yaml works around. So instead of a
# direct `Restart-Service`, this registers a one-shot SYSTEM Scheduled
# Task that performs the restart a few seconds later, DETACHED from the
# agent's process tree. The job result reports "restart scheduled" and
# publishes before the agent bounces; the agent comes back on its own.
#
# Register (operator-fired, no schedule):
#   kanade job create configs/jobs/restart-kanade-agent.yaml
#   kanade exec restart-kanade-agent --pcs <id>
#     (flag is `--pcs <id>`, pc_id VERBATIM — match the registered
#      casing of $env:COMPUTERNAME exactly, do NOT case-fold; NATS
#      subjects are case-sensitive so a mis-cased id sticks at pending)
#
# Handy when something in-memory in the agent is wedged — e.g. the
# client_shortcut sync loop has cached `last_applied` and won't re-check
# after an out-of-band client reinstall until the process restarts.
#
# `require_approval: true`: bouncing the control-plane agent is a
# fan-out an operator should ack before it goes wide.

id: restart-kanade-agent
tags: [infra]   # operator taxonomy for the SPA tag filter
version: 1.0.0
description: "Restart the kanade-agent service (KanadeAgent) via a detached one-shot task"

execute:
  shell: powershell
  # SYSTEM — Register-ScheduledTask with a SYSTEM principal + the
  # service stop/start all need admin.
  run_as: system
  timeout: 60s
  script: |
    $ErrorActionPreference = 'Stop'

    # Build the restart command the detached task will run, then hand it
    # over base64-encoded (-EncodedCommand) so there's no nested-quoting
    # fragility in the task argument. The task restarts KanadeAgent and
    # then unregisters itself so no stale task is left behind.
    $inner = 'try { Restart-Service -Name KanadeAgent -Force } ' +
             'finally { Unregister-ScheduledTask -TaskName kanade-agent-restart ' +
             '-Confirm:$false -ErrorAction SilentlyContinue }'
    $enc = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($inner))

    $action = New-ScheduledTaskAction -Execute 'powershell.exe' `
        -Argument "-NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand $enc"
    # ~5s out: enough for THIS script to return and the agent to publish
    # its result before the service bounces.
    $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(5)
    $principal = New-ScheduledTaskPrincipal -UserId 'NT AUTHORITY\SYSTEM' `
        -LogonType ServiceAccount -RunLevel Highest
    # -StartWhenAvailable: if registration overhead pushes the +5s
    # trigger slightly into the past (e.g. under load), Task Scheduler
    # still runs it instead of silently dropping the one-shot trigger.
    $settings = New-ScheduledTaskSettingsSet -StartWhenAvailable

    Register-ScheduledTask -TaskName 'kanade-agent-restart' `
        -Action $action -Trigger $trigger -Principal $principal `
        -Settings $settings -Force | Out-Null

    Write-Output 'KanadeAgent restart scheduled (~5s, detached scheduled task).'

require_approval: true
