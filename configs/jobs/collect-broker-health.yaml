# #512 broker-sizing companion: capture NATS/JetStream health for a
# retro-analysis of fleet scaling (e.g. the 500→3000 PC ramp).
#
# Run this ON THE BACKEND / NATS HOST, ideally DURING or right after a
# synchronised reconnect event (broker restart, the morning power-on
# wave) — that herd moment is what decides whether a startup splay or a
# bigger broker is needed (see book/src/operations/broker-sizing.md).
#
#   kanade exec collect-broker-health --pcs <backend-host-id>
#
# Zero pre-setup: it reads NATS' unauthenticated HTTP monitoring port
# (default 8222 — /jsz /connz /varz /healthz), so it needs NO `nats` CLI
# on the SYSTEM PATH and NO token. The script samples the broker over a
# few minutes (connections + JetStream consumer footprint), grabs static
# snapshots + log tails, writes everything to a temp dir, and prints a
# single JSON `{files:[...]}` on stdout. The agent zips those files and
# uploads to OBJECT_COLLECTIONS; download from the SPA Collect page (or
# hand the zip to your reviewer).
#
# Tunable via env on the target (optional): KANADE_BH_SAMPLES (default 12),
# KANADE_BH_INTERVAL_SEC (default 15) → ~3 min window; KANADE_BH_MON_PORT
# (default 8222) if the broker's http_port differs.
#
# stdout MUST be a single pure JSON object. ALL progress / diagnostics go
# to stderr via [Console]::Error.WriteLine — never Write-Host (it would
# corrupt the JSON the agent parses).

id: collect-broker-health
tags: [infra, nats, scaling]
version: 0.2.0
description: "Capture NATS/JetStream health (consumer footprint, connections, logs) for fleet-scaling analysis"

execute:
  shell: powershell
  # SYSTEM so it can read the SYSTEM-owned nats/backend logs. (The metrics
  # come from the localhost HTTP monitoring port, which needs no privilege
  # and no token.)
  run_as: system
  # 600s comfortably exceeds the worst-case sampling window + HTTP budget
  # (12 samples x 15s sleeps + per-call timeouts) so the script always
  # reaches its final JSON even if some monitoring calls stall.
  timeout: 600s
  script: |
    $ErrorActionPreference = 'Stop'
    function Note($m) { [Console]::Error.WriteLine($m) }

    # Unique per-run dir: avoids a Remove-Item that would throw (Stop) when a
    # prior run's dir is locked by an AV scanner / hung session.
    $dir = Join-Path $env:TEMP ('kanade-broker-health-' + (Get-Date -Format 'yyyyMMddHHmmss') + '-' + [guid]::NewGuid().ToString('N').Substring(0, 8))
    New-Item -ItemType Directory -Path $dir -Force | Out-Null
    $files = New-Object System.Collections.Generic.List[string]
    function Add-Artifact($p) { if (Test-Path $p) { $files.Add((Resolve-Path $p).Path) } }
    # Strip anything token/secret-looking from captured text (logs can carry
    # connection strings); the monitoring JSON doesn't, but be safe.
    function Redact($s) { $s -replace '(?i)(token|secret|password|nkey|bearer)["'':=\s]+\S+', '$1=<redacted>' }

    # --- NATS monitoring endpoint (no CLI, no token, no env required) -----
    # nats-server exposes an unauthenticated HTTP monitoring port (kanade's
    # nats-server.conf sets http_port: 8222) with /jsz /connz /varz /healthz.
    # Using it means the job runs with ZERO pre-setup on the backend host.
    $port = $env:KANADE_BH_MON_PORT -as [int]; if (-not $port -or $port -lt 1 -or $port -gt 65535) { $port = 8222 }
    $base = "http://127.0.0.1:$port"
    function Mon($path, $outfile) {
      try {
        $raw = Invoke-WebRequest -UseBasicParsing -Uri "$base/$path" -TimeoutSec 5 -ErrorAction Stop
        Redact($raw.Content) | Out-File -FilePath $outfile -Encoding utf8
        Add-Artifact $outfile
      } catch { Note "GET $base/$path failed: $_" }
    }

    $meta = @{
      captured_at = [DateTime]::UtcNow.ToString('o')
      host        = $env:COMPUTERNAME
      mon_base    = $base
    }
    ($meta | ConvertTo-Json) | Out-File (Join-Path $dir 'capture-meta.json') -Encoding utf8
    Add-Artifact (Join-Path $dir 'capture-meta.json')

    # --- time series over the herd window ---------------------------------
    # `-as [int]` yields $null on a non-integer instead of throwing.
    $samples  = $env:KANADE_BH_SAMPLES  -as [int]; if (-not $samples  -or $samples  -lt 1) { $samples  = 12 }
    $interval = $env:KANADE_BH_INTERVAL_SEC -as [int]; if (-not $interval -or $interval -lt 1) { $interval = 15 }
    Note "sampling $samples x ${interval}s (~$([int]($samples*$interval/60)) min) from $base"
    for ($i = 1; $i -le $samples; $i++) {
      $tag = '{0:000}-{1}' -f $i, [DateTime]::UtcNow.ToString('yyyyMMddTHHmmssZ')
      # The two herd signals: connection churn and JetStream consumer count.
      Mon 'connz'  (Join-Path $dir "connz-$tag.json")
      Mon 'jsz'    (Join-Path $dir "jsz-$tag.json")
      if ($i -lt $samples) { Start-Sleep -Seconds $interval }
    }

    # --- static one-shot snapshots ----------------------------------------
    Mon 'varz'                            (Join-Path $dir 'varz.json')      # mem / cpu / conns / slow consumers
    Mon 'healthz'                         (Join-Path $dir 'healthz.json')   # health status
    Mon 'jsz?consumers=true&streams=true' (Join-Path $dir 'jsz-full.json')  # full ~7N consumer footprint

    # --- log tails (redacted) ---------------------------------------------
    $logDir = Join-Path $env:ProgramData 'Kanade\logs'
    if (Test-Path $logDir) {
      # -ErrorAction SilentlyContinue: a failed enumeration yields nothing
      # instead of throwing (Stop) and aborting before the final JSON.
      Get-ChildItem -Path $logDir -Filter 'backend.*.log' -ErrorAction SilentlyContinue |
        Sort-Object LastWriteTime -Descending | Select-Object -First 2 |
        ForEach-Object {
          # try/catch: a locked/unreadable log must NOT kill the script
          # before it emits the final JSON (ErrorActionPreference=Stop).
          $f = $_
          try {
            $dst = Join-Path $dir ("log-" + $f.Name)
            Redact((Get-Content $f.FullName -Tail 2000 -ErrorAction Stop | Out-String)) | Out-File $dst -Encoding utf8
            Add-Artifact $dst
          } catch { Note "skip log $($f.Name): $_" }
        }
    }
    # nats-server log/dir (location varies; grab what exists).
    $natsDir = Join-Path $env:ProgramData 'Kanade\nats'
    if (Test-Path $natsDir) {
      $nl = Join-Path $dir 'nats-dir-listing.txt'
      Get-ChildItem $natsDir -Recurse -File -ErrorAction SilentlyContinue |
        Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize | Out-String |
        Out-File $nl -Encoding utf8
      Add-Artifact $nl
      Get-ChildItem $natsDir -Filter '*.log' -ErrorAction SilentlyContinue |
        Sort-Object LastWriteTime -Descending | Select-Object -First 1 |
        ForEach-Object {
          $f = $_
          try {
            $dst = Join-Path $dir ("nats-" + $f.Name)
            Redact((Get-Content $f.FullName -Tail 2000 -ErrorAction Stop | Out-String)) | Out-File $dst -Encoding utf8
            Add-Artifact $dst
          } catch { Note "skip nats log $($f.Name): $_" }
        }
    }

    # capture-meta.json is always written + bundled above, so the list is
    # never empty even if every metric/log capture failed (each failure is
    # noted to stderr). The bundle therefore always documents the run.

    # The ONLY thing on stdout: the JSON file list the agent bundles.
    @{ files = @($files) } | ConvertTo-Json -Compress

collect:
  name: "ブローカー健全性の採取"
  description: "NATS/JetStream の consumer 数・接続・ログを採取（フリート増強の後追い分析用）"
  max_size: 50MB

# Read-only diagnostics that an operator fires deliberately during a
# time-sensitive herd event — no approval gate so it isn't delayed.
require_approval: false
