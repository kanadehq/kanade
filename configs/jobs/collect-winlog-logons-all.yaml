# Issue #366 — on-demand UNFILTERED logon/logoff collection.
#
# The scheduled `collect-winlog-events` job keeps the Events
# timeline human-shaped: it drops non-interactive logon types and
# noise principals (SYSTEM / DWM-* / UMFD-* / machine accounts).
# This companion job is the forensic escape hatch — it captures
# EVERY Security 4624 / 4634 with no LogonType or account filter,
# so an operator investigating "what touched this box?" can pull
# service / network / batch logons too.
#
# Deliberately NOT scheduled. Register it once:
#
#     kanade job create configs/jobs/collect-winlog-logons-all.yaml
#
# then fire it ad-hoc against the PCs under investigation:
#
#     kanade exec collect-winlog-logons-all --pcs <pc-id>
#
# Mechanics mirror `collect-winlog-events` (watermark per (log,
# kind), 24h bootstrap/rolling window, NDJSON `ObsEvent` on stdout,
# `emit.type=events`) with two deltas:
#
#   - Separate watermark file (`winlog-logons-all-watermark.txt`)
#     so this job's progress never interferes with the scheduled
#     job's, and vice versa.
#   - `kind` stays `logon` / `logoff` and `source` stays
#     `winlog:Security`, identical to the scheduled job — the
#     backend's UNIQUE constraint on (pc_id, source,
#     event_record_id) therefore collapses the overlap: human
#     logons already collected by the scheduled job de-dup, and
#     only the noise rows land as new. The SPA's `logon_type`
#     filter (Issue #366) separates them on read.

id: collect-winlog-logons-all
tags: [observability]   # operator taxonomy for the SPA tag filter
version: 0.1.0
description: "On-demand: ALL Security logon/logoff events (no LogonType / account filter) → ObsEvent timeline"

execute:
  shell: powershell
  # Same 60 s headroom rationale as collect-winlog-events; the
  # unfiltered 4624 set is bigger but Get-WinEvent still walks a
  # 24h window in seconds.
  timeout: 60s
  run_as: system
  script: |
    $ErrorActionPreference = 'Stop'

    # Watermark file: one line per (log, kind) — `<log>:<kind>\t<lastRecordId>`.
    # Separate file from the scheduled job's so the two never race.
    $stateDir = Join-Path $env:ProgramData 'Kanade\state'
    if (-not (Test-Path $stateDir)) {
        New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
    }
    $watermarkPath = Join-Path $stateDir 'winlog-logons-all-watermark.txt'
    $watermarks = @{}
    if (Test-Path $watermarkPath) {
        # Same corrupted-line tolerance as collect-winlog-events
        # (Gemini #250 medium): a bad row is warned + dropped, an
        # unreadable file bootstraps fresh.
        try {
            foreach ($line in Get-Content $watermarkPath -ErrorAction Stop) {
                if ([string]::IsNullOrWhiteSpace($line)) { continue }
                $parts = $line -split "`t", 2
                if ($parts.Length -ne 2) { continue }
                try {
                    $watermarks[$parts[0]] = [int64]$parts[1]
                } catch {
                    Write-Warning "winlog watermark: dropping malformed line ($($parts[0])): $_"
                }
            }
        } catch {
            Write-Warning "winlog watermark: file unreadable, bootstrapping fresh: $_"
            $watermarks = @{}
        }
    }

    # Only the Security logon pair — System-log kinds (boot /
    # shutdown / sleep / ...) are low-volume and stay with the
    # scheduled job.
    $sources = @(
        @{ Log='Security'; Id=4624; Kind='logon' }
        @{ Log='Security'; Id=4634; Kind='logoff' }
    )

    # 24h bootstrap + rolling window, same trade as the scheduled
    # job: this is "what's happening now / today", not a deep
    # forensic archive. Run the job again tomorrow if the
    # investigation spans days.
    $bootstrapStart = (Get-Date).AddHours(-24)

    foreach ($s in $sources) {
        $key = "$($s.Log):$($s.Kind)"
        $cutoff = $watermarks[$key]
        $filter = @{
            LogName   = $s.Log
            Id        = $s.Id
            StartTime = $bootstrapStart
        }
        $events = Get-WinEvent -FilterHashtable $filter -ErrorAction SilentlyContinue
        if ($null -eq $events) { continue }
        $events = $events | Sort-Object -Property RecordId
        $maxSeen = $cutoff
        foreach ($e in $events) {
            if ($null -ne $cutoff -and $e.RecordId -le $cutoff) { continue }
            if ($null -eq $maxSeen -or $e.RecordId -gt $maxSeen) { $maxSeen = $e.RecordId }
            # 4624 schema: TargetUserName (event[5]), LogonType (event[8]).
            # 4634 schema: TargetUserName (event[1]), LogonType (event[4]).
            # No filtering here — a row whose Properties are corrupt
            # still emits, just with a null payload, because for
            # forensics "an event happened" beats "we could parse it".
            # Explicit per-ID property map (Gemini #368 medium): a
            # future Security ID added to the matrix gets its own
            # row here; an unmapped ID still emits with a null
            # payload rather than guessing 4634's indices.
            $payload = $null
            $userIdx = $null
            $typeIdx = $null
            if ($s.Id -eq 4624)     { $userIdx = 5; $typeIdx = 8 }
            elseif ($s.Id -eq 4634) { $userIdx = 1; $typeIdx = 4 }
            if ($null -ne $typeIdx -and $null -ne $e.Properties -and $e.Properties.Count -gt $typeIdx) {
                $payload = @{
                    user       = [string]$e.Properties[$userIdx].Value
                    logon_type = [int]$e.Properties[$typeIdx].Value
                }
            }
            $obj = [ordered]@{
                pc_id           = $env:COMPUTERNAME
                at              = $e.TimeCreated.ToUniversalTime().ToString('o')
                kind            = $s.Kind
                source          = "winlog:$($s.Log)"
                event_record_id = [string]$e.RecordId
                payload         = $payload
            }
            Write-Output ($obj | ConvertTo-Json -Depth 5 -Compress)
        }
        if ($null -ne $maxSeen -and $maxSeen -ne $cutoff) { $watermarks[$key] = $maxSeen }
    }

    # Persist watermark file LAST so a crash mid-loop re-emits on
    # the next run; the backend UNIQUE constraint absorbs the
    # re-send.
    $tmp = "$watermarkPath.tmp"
    $watermarks.GetEnumerator() |
        ForEach-Object { "{0}`t{1}" -f $_.Key, $_.Value } |
        Set-Content -Path $tmp -Encoding utf8 -Force
    Move-Item -Force -Path $tmp -Destination $watermarkPath

emit:
  type: events
  watermark_path: state/winlog-logons-all-watermark.txt
