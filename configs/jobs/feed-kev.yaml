# CISA KEV (Known Exploited Vulnerabilities) feed — the showcase for the
# config-driven correlation layer (#901). This job fetches CISA's KEV catalog
# and projects it into the global `feeds` table under feed_id `kev`; the
# companion `kev-exposure` view then JOINs it against `inventory_sw_apps` to
# surface hosts running a product family with actively-exploited CVEs.
#
#   kanade job create      configs/jobs/feed-kev.yaml
#   kanade schedule create  configs/schedules/feed-kev.yaml
#   kanade view create      configs/views/kev-exposure.yaml
#
# Zero bespoke Rust — this is a normal `feed:` job on top of the generic
# platform (execution tier #905 + feed: hint #906 + SQL views #907).
#
# `tier: controller` (also IMPLIED by `feed:`) confines the fetch to the
# operator-configured `controller_group` (server_settings KV) — an external
# network fetch must never run on an employee endpoint. The schedule's target
# is intersected with that group by the dispatch guard; an unset group means
# the job runs nowhere (fail-safe), so set `controller_group` before scheduling.
#
# Honest limitation: CISA KEV carries NO version ranges, so a match means
# "this host runs a product family with known-exploited CVEs" — a coarse but
# high-signal "prioritize patching" signal, not "this exact build is
# vulnerable". (Comprehensive NVD CPE matching is a name-normalization swamp
# with heavy false positives — out of scope.)

id: feed-kev
version: 0.1.0
description: CISA Known Exploited Vulnerabilities catalog → feeds table (feed_id=kev)
tags: [feed, security, vulnerability]

# Redundant with the `feed:` implication below, but explicit so a reader sees
# at a glance that this job is confined to trusted infrastructure.
tier: controller

execute:
  shell: powershell
  # `run_as: system` — no interactive user needed; the fetch is a plain HTTPS
  # GET. Runs on the controller host, which has outbound internet.
  run_as: system
  # Network fetch of a ~2 MB document + reserialization. Generous headroom for
  # a slow link; the work itself is a few seconds.
  timeout: 180s
  script: |
    $ErrorActionPreference = 'Stop'
    $url = 'https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json'

    # Fetch the raw body with Invoke-WebRequest (NOT Invoke-RestMethod) so we
    # control deserialization: Windows PowerShell 5.1's built-in JSON parser
    # — which Invoke-RestMethod uses — trips `MaxJsonLength` on the ~2 MB,
    # ~1500-entry KEV feed. `System.Web.Extensions` lets us raise that cap.
    $resp = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 120
    Add-Type -AssemblyName System.Web.Extensions
    $ser = New-Object System.Web.Script.Serialization.JavaScriptSerializer
    $ser.MaxJsonLength = [int]::MaxValue
    $data = $ser.DeserializeObject($resp.Content)

    # Trim each entry to the fields the `kev-exposure` view reads, so the
    # fenced stdout stays manageable even as KEV grows (the view matches on
    # `product` and counts distinct `cveID`). The `@(...)` around the loop is
    # load-bearing: a bare `$items = foreach {}` is `$null` on an empty feed,
    # which would serialize to `[null]`; `@(foreach {})` yields `[]` (Gemini).
    $items = @(foreach ($v in $data.vulnerabilities) {
      @{
        cveID                      = [string]$v.cveID
        vendorProject              = [string]$v.vendorProject
        product                    = [string]$v.product
        vulnerabilityName          = [string]$v.vulnerabilityName
        dateAdded                  = [string]$v.dateAdded
        knownRansomwareCampaignUse = [string]$v.knownRansomwareCampaignUse
      }
    })

    # Fail fast on an empty result rather than publishing an empty feed. CISA
    # KEV always has ~1500 entries, so zero means the fetch or parse silently
    # failed (an error page served with 200, a changed JSON shape, …). Since
    # the projector REPLACES the feed_id=kev partition wholesale on a clean
    # run, emitting `[]` would wipe KEV and blank the kev-exposure view until
    # the next good fetch. Throwing exits non-zero, so the projector (clean-
    # exit only) skips it and the last-good partition survives (CodeRabbit).
    if ($items.Count -eq 0) {
      throw "KEV feed returned no vulnerabilities — refusing to publish an empty feed that would wipe feed_id=kev (fetch/parse failure?)"
    }

    # `feed:` reads the array under `field:` from the fenced block. A single-
    # hint job could skip the fence, but fencing keeps any stray stdout line
    # from leaking into the JSON the projector parses.
    $payload = $ser.Serialize(@{ vulnerabilities = $items })
    Write-Output '#KANADE-FEED-BEGIN'
    Write-Output $payload
    Write-Output '#KANADE-FEED-END'

# The whole `feed:` hint: point at the array, name the item key. One fetch,
# one feed. `id: kev` is the partition in the shared `feeds` table (data lands
# in a `data` JSON column, read by views via `json_extract(data, '$.cveID')`).
feed:
  - id: kev
    field: vulnerabilities
    primary_key: [cveID]
