# USER-INVOKABLE job (#291) — the software catalog (Catalog) tab.
#
# Self-service install of 7-Zip via winget. `run_as: system` so the
# machine-wide install elevates without a UAC prompt. See
# fix-teams-cache.yaml for the full `client:` contract.
#
# Register (user-fired, no schedule):
#   kanade job create configs/jobs/install-7zip.yaml
id: install-7zip
version: 1.0.0
description: Install the 7-Zip archiver via winget (operator note)
execute:
  shell: powershell
  run_as: system
  timeout: 600s
  script: |
    $ErrorActionPreference = 'Stop'
    winget install --id 7zip.7zip --silent --accept-source-agreements --accept-package-agreements
    # 0x8A15002F (-1978335185) = already installed; treat as success so a
    # re-run on an already-equipped machine isn't reported as a failure.
    if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne -1978335185) {
      throw "winget install failed with exit code $LASTEXITCODE"
    }
    Write-Output '7-Zip をインストールしました（または既にインストール済みです）。'
client:
  name: "7-Zip をインストール"
  description: "圧縮・解凍ツール 7-Zip"
  category: catalog
  icon: archive
