# Issue #246 — Windows Event Log → per-PC observability timeline.
#
# Pipes real HUMAN session events (logon / logoff via Winlogon,
# lock / unlock via Security auditing — see Issue #378) and System
# log lifecycle events (boot / shutdown / sleep / resume /
# unexpected_shutdown) into the `obs_events` stream via the
# `emit:` manifest block:
#
#   1. PowerShell script reads its watermark file (one TEXT line
#      per `(source, kind)` row: `<RecordId>\n`). On first run the
#      file is absent → the script seeds from "last 24h" so a brand-
#      new agent gets a sensible bootstrap window instead of either
#      "nothing" or "all history since the box was built".
#   2. Get-WinEvent walks each (log, ID set) since that watermark.
#   3. Each event becomes ONE JSON `ObsEvent` on stdout (NDJSON —
#      one event per line, see `wire::ObsEvent` for the schema).
#   4. Watermark file is updated AFTER all events emit so a crash
#      mid-run re-emits — the backend's UNIQUE constraint on
#      (pc_id, source, event_record_id) collapses re-sends.
#   5. Agent's `emit.type=events` handler (PR #3 / #249) parses
#      each line as `ObsEvent` and enqueues to obs-outbox. Stdout
#      is dropped from the resulting `ExecResult.stdout` so the
#      timeline data doesn't double-up in execution_results.
#
# Schedule (see `configs/schedules/collect-winlog-events.yaml`)
# fires every 15 min — short enough that a logon shows up on the
# SPA Activity timeline before the user has finished booting their
# IDE, long enough that a 1000-PC fleet doesn't hammer the broker.
#
# Required by Security log (4800 / 4801): `run_as: system` —
# Security log reads need SeSecurityPrivilege. The agent already
# runs as LocalSystem in prod so this is the default anyway; spelt
# out so a future runas-default change can't silently break event
# collection.
#
# Issue #378 (supersedes the #366 LogonType gate): logon / logoff
# come from the Winlogon provider (System log, 7001 / 7002), which
# fires exactly once per REAL interactive session — Security 4624
# answers "a token was created" and even with LogonType filtering
# still contains UAC split-token pairs and ms-lived
# credential-validation sessions. Lock / unlock come from Security
# 4800 / 4801 so "stepped away / came back" stays on the timeline
# (Winlogon does not fire on unlock). For investigations that need
# every token-level logon (service / network / batch / transients),
# run the on-demand companion job `collect-winlog-logons-all`
# (separate watermark; the backend's UNIQUE constraint on
# (pc_id, source, event_record_id) de-dups any overlap).

# Issue #385: power-transition coverage. The fleet host (and
# modern laptops generally) are Modern Standby (S0) machines where
# classic S3 sleep does not exist, so Kernel-Power 42/107 never
# fire there — 506/507 are the S0 equivalents and fold into the
# same sleep/resume kinds. Resume from hibernation emits neither —
# it surfaces as Kernel-Boot 27 with BootType=0x2 (emitted here as
# a `resume`). Power-Troubleshooter Event 1 adds a `wake_detail`
# row (sleep start / wake time / wake source) for "what woke this
# machine at 3am?" forensics.

id: collect-winlog-events
version: 0.4.0
description: "Windows Event Log → ObsEvent timeline (human logon / logoff / lock / unlock / boot / shutdown / sleep / resume / wake_detail)"

execute:
  shell: powershell
  # 60 s on the timeout — a busy box with 15 min of accumulated
  # events should finish in seconds; the headroom protects against
  # a stuck Get-WinEvent against a corrupted .evtx (rare, but
  # observed in practice).
  timeout: 60s
  run_as: system
  script: |
    $ErrorActionPreference = 'Stop'

    # Watermark file: one line per source row —
    # `<log>:<eventId>:<kind>\t<lastRecordId>`. The event ID joined
    # the key in 0.4.0 (#385): multiple IDs now share a kind (42
    # and 506 are both `sleep`), and with the old `<log>:<kind>`
    # key the first row's cutoff would silently skip the second
    # row's interleaved RecordIds. Old-format lines linger in the
    # file harmlessly (never read, never rewritten); the new keys
    # bootstrap from the 24h window below and the backend's UNIQUE
    # constraint absorbs the one-time overlap re-send.
    # Stored under %ProgramData%\Kanade\state\ so the agent's outbox /
    # logs / config dirs stay structurally separate. First run reads
    # nothing → bootstrap from "last 24h" per key so a fresh agent
    # doesn't dump every event since the box was built.
    $stateDir = Join-Path $env:ProgramData 'Kanade\state'
    if (-not (Test-Path $stateDir)) {
        New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
    }
    $watermarkPath = Join-Path $stateDir 'winlog-events-watermark.txt'
    $watermarks = @{}
    if (Test-Path $watermarkPath) {
        # Gemini #250 medium: a corrupted watermark line (non-integer
        # RecordId, malformed key) would throw inside the [int64] cast
        # under `$ErrorActionPreference = 'Stop'` and pin the script
        # to failure forever. Wrap each line's parse in try/catch; a
        # bad row gets warned + dropped, the remaining good rows
        # still load. If the WHOLE file is unreadable (permissions /
        # disk error), bootstrap from "last 24h" same as a missing file.
        try {
            foreach ($line in Get-Content $watermarkPath -ErrorAction Stop) {
                if ([string]::IsNullOrWhiteSpace($line)) { continue }
                $parts = $line -split "`t", 2
                if ($parts.Length -ne 2) { continue }
                try {
                    $watermarks[$parts[0]] = [int64]$parts[1]
                } catch {
                    Write-Warning "winlog watermark: dropping malformed line ($($parts[0])): $_"
                }
            }
        } catch {
            Write-Warning "winlog watermark: file unreadable, bootstrapping fresh: $_"
            $watermarks = @{}
        }
    }

    # Source matrix: (log, [provider,] event_id, kind). Hard-coded
    # list rather than a config lookup so the agent script is
    # self-contained; adding a new kind = one row + a redeploy.
    #
    # System 7001 / 7002 (provider Microsoft-Windows-Winlogon) —
    #                logon / logoff. Issue #378: Winlogon fires
    #                exactly once per REAL interactive session
    #                (console and RDP alike), so the timeline gets
    #                none of Security 4624's token-level noise.
    #                Provider filter is REQUIRED — Service Control
    #                Manager also writes Event ID 7001 into the
    #                System log.
    # Security 4800 / 4801 — workstation lock / unlock. These need
    #                the "Other Logon/Logoff Events" audit
    #                subcategory, which is DISABLED on stock
    #                Windows. This collector stays read-only — the
    #                enable lives in the companion
    #                `enable-session-audit` job, fired once per PC
    #                by its `per_pc: once` schedule (see
    #                configs/schedules/enable-session-audit.yaml).
    #                Until that job has run on a box, 4800/4801
    #                simply return no rows here.
    # System 12 / 13 — kernel-general boot / shutdown.
    # System 41    — unexpected shutdown (kernel-power, "the system
    #                rebooted without cleanly shutting down").
    # System 42 / 107 (kernel-power) — classic S3 sleep / resume.
    #                Provider pinned in 0.4.0 — System-log event
    #                IDs collide across providers (same lesson as
    #                Winlogon 7001 vs SCM, #378).
    # System 506 / 507 (kernel-power) — Modern Standby (S0)
    #                enter / exit. Issue #385: S0 machines (the
    #                fleet host included — its firmware doesn't
    #                even offer S3, per `powercfg /a`) never emit
    #                42/107; these are the equivalents and fold
    #                into the same sleep / resume kinds with
    #                payload {standby: "modern"}.
    # System 27 (kernel-boot) — boot-type record. Only
    #                BootType=0x2 (resume from hibernation) is
    #                emitted, as `resume` {from: "hibernate"} —
    #                hibernate wake produces neither 107 nor 507
    #                and would otherwise masquerade as a plain
    #                boot. 0x0 cold boot / 0x1 fast startup are
    #                skipped (kind `boot` already covers them).
    # System 1 (power-troubleshooter) — `wake_detail`: sleep
    #                start / wake time / wake source ("what woke
    #                this machine at 3am?"). Deliberately its own
    #                kind, NOT a second `resume`, so the per-wake
    #                pairing with 107/507 doesn't read as
    #                duplication and can be filtered out by kind.
    # System 6005 / 6006 — Event Log service start / stop, a stable
    #                fallback signal for boot/shutdown when the
    #                kernel-general 12/13 are noisy.
    $sources = @(
        @{ Log='System';   Provider='Microsoft-Windows-Winlogon'; Id=7001; Kind='logon' }
        @{ Log='System';   Provider='Microsoft-Windows-Winlogon'; Id=7002; Kind='logoff' }
        @{ Log='Security'; Id=4800; Kind='lock' }
        @{ Log='Security'; Id=4801; Kind='unlock' }
        @{ Log='System';   Id=12;   Kind='boot' }
        @{ Log='System';   Id=13;   Kind='shutdown' }
        @{ Log='System';   Id=41;   Kind='unexpected_shutdown' }
        @{ Log='System';   Provider='Microsoft-Windows-Kernel-Power'; Id=42;  Kind='sleep' }
        @{ Log='System';   Provider='Microsoft-Windows-Kernel-Power'; Id=107; Kind='resume' }
        @{ Log='System';   Provider='Microsoft-Windows-Kernel-Power'; Id=506; Kind='sleep' }
        @{ Log='System';   Provider='Microsoft-Windows-Kernel-Power'; Id=507; Kind='resume' }
        @{ Log='System';   Provider='Microsoft-Windows-Kernel-Boot';  Id=27;  Kind='resume' }
        @{ Log='System';   Provider='Microsoft-Windows-Power-Troubleshooter'; Id=1; Kind='wake_detail' }
        @{ Log='System';   Id=6005; Kind='log_service_started' }
        @{ Log='System';   Id=6006; Kind='log_service_stopped' }
    )

    # Winlogon 7001/7002 carry the user as a SID, not a name.
    # Translate where possible; an untranslatable SID stays raw in
    # `payload.user`, which is still investigable. The leaf name
    # (sans DOMAIN\) keeps `payload.user` shaped like the
    # historical Security-sourced rows so SPA filters/searches
    # keep working across the source switch.
    #
    # Gemini #379 high: `Translate()` on a DOMAIN SID can block
    # 15-30 s per SID while LSA retries an unreachable DC (think
    # off-network laptop). With the 60 s job timeout and the
    # watermark only written at the end, a few domain logons would
    # pin this script in a timeout-forever loop. Gate: well-known /
    # built-in SIDs and this machine's own account SIDs always
    # translate (purely local lookups); domain-style SIDs from
    # other authorities only translate when a quick DNS probe of
    # the machine's AD domain answers — otherwise keep the raw SID.
    $cs = Get-CimInstance Win32_ComputerSystem
    $domainReachable = $false
    if ($cs.PartOfDomain) {
        try {
            $null = Resolve-DnsName -Name $cs.Domain -QuickTimeout -ErrorAction Stop
            $domainReachable = $true
        } catch {
            Write-Warning "AD domain $($cs.Domain) not resolvable; domain SIDs stay raw this tick: $_"
        }
    }
    $machineSidPrefix = $null
    try {
        $firstLocal = Get-LocalUser -ErrorAction Stop | Select-Object -First 1
        if ($firstLocal) { $machineSidPrefix = $firstLocal.SID.AccountDomainSid.Value }
    } catch {
        Write-Warning "machine SID prefix lookup failed; local-account SIDs may stay raw: $_"
    }

    $sidNameCache = @{}
    function Resolve-SidLeafName([string]$sidStr) {
        if ($sidNameCache.ContainsKey($sidStr)) { return $sidNameCache[$sidStr] }
        $name = $sidStr
        $isDomainStyle = $sidStr -match '^S-1-5-21-'
        $isThisMachine = $isDomainStyle -and $null -ne $machineSidPrefix -and $sidStr.StartsWith("$machineSidPrefix-")
        if (-not $isDomainStyle -or $isThisMachine -or $domainReachable) {
            try {
                $sid  = New-Object System.Security.Principal.SecurityIdentifier($sidStr)
                $full = $sid.Translate([System.Security.Principal.NTAccount]).Value
                $name = ($full -split '\\')[-1]
            } catch {
                Write-Warning "SID translate failed for ${sidStr}: $_"
            }
        }
        $sidNameCache[$sidStr] = $name
        return $name
    }

    # Bootstrap window for first run / new (log, kind) entries. 24h
    # keeps the seeded set bounded; the watermark immediately moves
    # forward so the next tick only catches NEW events. Older
    # history isn't ever back-filled — operators wanting deep
    # history can backfill out-of-band.
    $bootstrapStart = (Get-Date).AddHours(-24)

    # Gemini #250 high: subsequent runs (with a watermark in hand)
    # ALSO need a StartTime, otherwise Get-WinEvent scans the entire
    # event log from the beginning for the configured IDs — slow on
    # boxes with months of Security log retention (4624/4634 dominate
    # log volume). Use the same 24h rolling window: events older than
    # that won't be re-emitted on this tick, and the watermark+RecordId
    # filter de-dups within the window. Trade: an agent offline > 24h
    # misses events older than 24h before its reconnect; acceptable
    # since the timeline is "what's happening now" rather than a
    # forensic archive.
    foreach ($s in $sources) {
        # Event ID in the key — see the watermark-format comment up
        # top (0.4.0: two IDs can share a kind).
        $key = "$($s.Log):$($s.Id):$($s.Kind)"
        $cutoff = $watermarks[$key]
        $filter = @{
            LogName   = $s.Log
            Id        = $s.Id
            StartTime = $bootstrapStart
        }
        # Winlogon rows pin the provider — Event ID 7001 in the
        # System log is also used by Service Control Manager.
        if ($s.ContainsKey('Provider')) { $filter.ProviderName = $s.Provider }
        $events = Get-WinEvent -FilterHashtable $filter -ErrorAction SilentlyContinue
        if ($null -eq $events) { continue }
        # Sort ascending so the projector sees events in source order
        # (helps SQLite's INSERT-after-UNIQUE-check pattern stay on
        # the natural index ordering).
        $events = $events | Sort-Object -Property RecordId
        $maxSeen = $cutoff
        foreach ($e in $events) {
            if ($null -ne $cutoff -and $e.RecordId -le $cutoff) { continue }
            # Watermark advances over EVERY event walked — including
            # rows skipped as unparsable below — so the next tick
            # never re-scans them.
            if ($null -eq $maxSeen -or $e.RecordId -gt $maxSeen) { $maxSeen = $e.RecordId }
            $payload = $null
            # Per-kind payload extraction. `Properties` ordering is
            # stable across Win 10+/Server; null-check before
            # `.Count` (Gemini #250 medium) — exotic event-source
            # corruption can leave `$e.Properties` null even when
            # the row itself exists. A row too short to parse emits
            # with a null payload rather than vanishing — for these
            # session kinds "it happened" beats "we could parse it".
            if ($s.Id -eq 7001 -or $s.Id -eq 7002) {
                # Winlogon schema: TSId (event[0]), UserSid (event[1]).
                if ($null -ne $e.Properties -and $e.Properties.Count -ge 2) {
                    $sidStr = [string]$e.Properties[1].Value
                    $payload = @{
                        user       = Resolve-SidLeafName $sidStr
                        sid        = $sidStr
                        session_id = ($e.Properties[0].Value -as [int])
                    }
                }
            } elseif ($s.Id -eq 4800 -or $s.Id -eq 4801) {
                # 4800/4801 schema: TargetUserSid (event[0]),
                # TargetUserName (event[1]), TargetDomainName
                # (event[2]), TargetLogonId (event[3]),
                # SessionId (event[4]).
                if ($null -ne $e.Properties -and $e.Properties.Count -ge 5) {
                    $payload = @{
                        user       = [string]$e.Properties[1].Value
                        session_id = ($e.Properties[4].Value -as [int])
                    }
                }
            } elseif ($s.Id -eq 506 -or $s.Id -eq 507) {
                # Modern Standby enter/exit — same kinds as 42/107,
                # payload distinguishes the standby flavour.
                $payload = @{ standby = 'modern' }
            } elseif ($s.Id -eq 27) {
                # Kernel-Boot 27: BootType (event[0]).
                #   0x0 cold boot, 0x1 fast startup, 0x2 resume
                #   from hibernation. Only 0x2 emits (as `resume`);
                #   the rest are already covered by kind `boot`
                #   and would double every power-on. Skipped rows
                #   still advanced the watermark above.
                if ($null -eq $e.Properties -or $e.Properties.Count -lt 1) { continue }
                # `-as` instead of a cast: a malformed value yields
                # $null (→ skip) rather than throwing under
                # `$ErrorActionPreference = 'Stop'` and killing the
                # whole collection tick (Gemini #386 medium).
                $bootType = $e.Properties[0].Value -as [int]
                if ($null -eq $bootType -or $bootType -ne 2) { continue }
                $payload = @{ from = 'hibernate' }
            } elseif ($s.Kind -eq 'wake_detail') {
                # Power-Troubleshooter 1. Positional Properties
                # ordering for this event is NOT verifiable on a
                # box that never slept (the fleet host has zero
                # such events), so extract by NAME from the event
                # XML instead of by index — robust to layout
                # differences across Windows builds. A parse
                # failure emits with a null payload ("it happened"
                # beats "we could parse it").
                try {
                    $x = [xml]$e.ToXml()
                    $data = @{}
                    # `GetAttribute('Name')` rather than `$d.Name`:
                    # PowerShell's XML adapter does surface the
                    # Name ATTRIBUTE through `.Name` (verified on
                    # 5.1 and 7), but GetAttribute is immune to the
                    # adapter's shadowing rules (e.g. a child
                    # element literally named "Name") — zero
                    # ambiguity for one extra call.
                    foreach ($d in $x.Event.EventData.Data) {
                        if ($d -isnot [System.Xml.XmlElement]) { continue }
                        $n = $d.GetAttribute('Name')
                        if (-not [string]::IsNullOrEmpty($n)) { $data[$n] = [string]$d.'#text' }
                    }
                    $src = $data['WakeSourceText']
                    if ([string]::IsNullOrWhiteSpace($src)) { $src = $data['WakeSourceType'] }
                    $payload = @{
                        sleep_start = $data['SleepTime']
                        wake_time   = $data['WakeTime']
                        wake_source = $src
                    }
                } catch {
                    Write-Warning "wake_detail parse failed for record $($e.RecordId): $_"
                }
            }
            # `ConvertTo-Json -Depth 5 -Compress` keeps one JSON
            # value per `Write-Output`; the agent splits stdout on
            # newlines. `null` payloads serialise as JSON `null`.
            $obj = [ordered]@{
                pc_id           = $env:COMPUTERNAME
                at              = $e.TimeCreated.ToUniversalTime().ToString('o')
                kind            = $s.Kind
                source          = "winlog:$($s.Log)"
                event_record_id = [string]$e.RecordId
                payload         = $payload
            }
            Write-Output ($obj | ConvertTo-Json -Depth 5 -Compress)
        }
        if ($null -ne $maxSeen -and $maxSeen -ne $cutoff) { $watermarks[$key] = $maxSeen }
    }

    # Persist watermark file LAST (after all stdout has been emitted)
    # so a crash mid-loop re-emits on the next tick. The agent's
    # backend UNIQUE constraint on (pc_id, source, event_record_id)
    # makes the re-emit a no-op.
    $tmp = "$watermarkPath.tmp"
    $watermarks.GetEnumerator() |
        ForEach-Object { "{0}`t{1}" -f $_.Key, $_.Value } |
        Set-Content -Path $tmp -Encoding utf8 -Force
    Move-Item -Force -Path $tmp -Destination $watermarkPath

emit:
  type: events
  watermark_path: state/winlog-events-watermark.txt
