# USER-INVOKABLE job (#291) — "アップデート" (SoftwareUpdate) tab.
#
# READ-ONLY: scans for pending Windows Updates and lists them. It does
# NOT install anything (install needs a reboot policy decision that's an
# operator concern), so it's safe for an end user to run any time to see
# whether their machine is behind. `run_as: system` — the Windows Update
# COM API needs the elevated agent context.
#
# Register (user-fired, no schedule):
#   kanade job create configs/jobs/windows-update-scan.yaml
id: windows-update-scan
version: 1.0.0
description: Scan for pending Windows Updates (read-only, no install) (operator note)
execute:
  shell: powershell
  run_as: system
  timeout: 300s
  script: |
    $ErrorActionPreference = 'Stop'
    $session = New-Object -ComObject Microsoft.Update.Session
    $searcher = $session.CreateUpdateSearcher()
    $result = $searcher.Search("IsInstalled=0 and Type='Software' and IsHidden=0")
    $n = $result.Updates.Count
    if ($n -eq 0) {
      Write-Output '保留中の Windows Update はありません。最新です。'
    } else {
      Write-Output "$n 件の更新が見つかりました:"
      foreach ($u in $result.Updates) { Write-Output "  - $($u.Title)" }
      Write-Output ''
      Write-Output '更新は管理者の設定に従って適用されます。'
    }
client:
  name: "Windows Update を確認"
  description: "保留中の Windows 更新プログラムを確認します(確認のみ・インストールはしません)"
  category: software_update
  icon: shield-check
