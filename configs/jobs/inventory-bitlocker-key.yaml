# BitLocker recovery-key inventory probe.
#
# Collects the *recovery password* (48-digit numerical password) for
# every encryptable volume, keyed by its KeyProtector GUID, and lands
# them in a per-key `bitlocker_recovery_keys` sub-table operators can
# look up on the SPA when a user is locked out at the recovery prompt.
#
# SECURITY — read before deploying:
#   A BitLocker recovery password unlocks the drive. Storing it in the
#   inventory DB means anyone with read access to the backend / SPA can
#   decrypt that machine. Treat this job as a privileged escrow:
#     * restrict who can view the Inventory page / query the backend,
#     * prefer Azure AD / AD DS key escrow where available and use this
#       only as a fallback or audit cross-check,
#     * be deliberate about retention (the projector replaces this PC's
#       rows on every run, so stale keys don't accumulate, but the
#       latest key is always present in plaintext).
#   Do NOT enable `track_history` here — you do not want every past
#   recovery password retained in `inventory_history`.
#
# `run_as: system` is required: the MicrosoftVolumeEncryption WMI
# namespace and the GetKeyProtectorNumericalPassword method are
# admin-only. The agent runs as LocalSystem, so this succeeds in
# production even though a non-elevated `kanade exec` would not.
#
# Install:
#   kanade job create      configs/jobs/inventory-bitlocker-key.yaml
#   kanade schedule create configs/schedules/inventory-bitlocker-key.yaml
id: inventory-bitlocker-key
version: 0.1.0
description: BitLocker recovery passwords per volume / key protector (escrow)
tags: [inventory, security]
execute:
  shell: powershell
  run_as: system
  timeout: 60s
  # Emits ONE JSON object on stdout. For each encryptable volume we ask
  # the volume for its RecoveryPassword key protectors (type 3) and then
  # resolve each protector GUID to its 48-digit numerical password.
  script: |
    $ErrorActionPreference = 'Stop'
    $ns = 'root/CIMV2/Security/MicrosoftVolumeEncryption'
    $keys = @()
    try {
      $vols = @(Get-CimInstance -Namespace $ns -ClassName Win32_EncryptableVolume)
      foreach ($vol in $vols) {
        $drive      = $vol.DriveLetter
        $protection = [int]$vol.ProtectionStatus   # 1=On, 0=Off, 2=Unknown
        try {
          # KeyProtectorType 3 = RecoveryPassword (the 48-digit key).
          $ids = @((Invoke-CimMethod -InputObject $vol -MethodName GetKeyProtectors `
                      -Arguments @{ KeyProtectorType = [uint32]3 }).VolumeKeyProtectorID)
          foreach ($id in $ids) {
            if (-not $id) { continue }
            # Per-protector isolation: a failure on one protector must not
            # skip the rest of this volume's protectors. Wrap the single
            # query so a throw here only drops THIS protector.
            try {
              # Invoke-CimMethod does NOT throw on a non-zero ReturnValue
              # (e.g. FVE_E_LOCKED_VOLUME) — it returns the object with a
              # null NumericalPassword. Check ReturnValue explicitly so a
              # locked / errored protector is skipped, not escrowed blank.
              $result = Invoke-CimMethod -InputObject $vol -MethodName GetKeyProtectorNumericalPassword `
                         -Arguments @{ VolumeKeyProtectorID = $id }
              if ($result.ReturnValue -ne 0) { continue }
              $pw = $result.NumericalPassword
              # Only escrow rows that carry BOTH a protector GUID and a
              # password. A null key_protector_id would violate the
              # bitlocker_recovery_keys primary key, and a null password
              # has no escrow value — skip either way.
              if (-not $pw) { continue }
              $keys += [pscustomobject]@{
                drive            = $drive
                protection       = $protection
                key_protector_id = $id
                recovery_password = $pw
              }
            } catch {
              # Drop only this protector; we emit no placeholder row, since
              # a null key_protector_id can't be escrowed and would break
              # the exploded table's primary key.
              continue
            }
          }
        } catch {
          # A genuine WMI exception enumerating THIS volume's protectors
          # (access-denied, CIM transport error, etc.) — an unencrypted
          # volume does NOT land here (GetKeyProtectors returns an empty
          # array and the loop body never runs). Skip the volume; again, no
          # placeholder row, for the same null-PK reason as above.
        }
      }
      # 'ok' once we enumerated volumes successfully, even if none carry a
      # recovery-password protector (a fully-unencrypted box is a normal,
      # determinate state — not 'unknown'). 'unknown' is reserved for the
      # outer catch where the WMI enumeration itself failed.
      $status = if ($vols.Count -gt 0) { 'ok' } else { 'unknown' }
      $detail = "$($keys.Count) recovery key(s) across $($vols.Count) volume(s)"
    } catch {
      $status = 'unknown'; $detail = $_.Exception.Message; $keys = @()
    }
    [pscustomobject]@{
      hostname = $env:COMPUTERNAME
      status   = $status
      detail   = $detail
      keys     = $keys
    } | ConvertTo-Json -Compress -Depth 4

inventory:
  display:
    - { field: hostname, label: Hostname }
    - { field: status,   label: Status   }
    - { field: detail,   label: Detail   }
    - field: keys
      label: Recovery Keys
      type: table
      columns:
        - { field: drive,             label: Drive }
        - { field: protection,        label: Protection, type: number }
        - { field: key_protector_id,  label: Key ID }
        - { field: recovery_password, label: Recovery Password }
  summary:
    - { field: hostname, label: Hostname }
    - { field: status,   label: Status   }
    - { field: detail,   label: Detail   }
  # Explode into a flat per-key table so an operator can look a machine
  # up by hostname / drive and read off its recovery password at the
  # recovery prompt. PK = (pc_id, job_id, key_protector_id) — re-runs
  # replace this PC's rows in place.
  #
  # NOTE: track_history is intentionally OMITTED — see the SECURITY note
  # at the top; we do not want plaintext recovery passwords accumulating
  # in inventory_history.
  explode:
    - field: keys
      table: bitlocker_recovery_keys
      primary_key: [key_protector_id]
      columns:
        - { field: drive,             type: text                  }
        - { field: protection,        type: integer, index: false }
        - { field: key_protector_id,  type: text                  }
        - { field: recovery_password, type: text,    index: false }
