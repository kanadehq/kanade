# Example operator-defined HEALTH CHECK (#290) — Windows Update patch
# compliance.
#
# A host that's missing security updates is exposed until it patches.
# This surfaces "how far behind is each PC" fleet-wide on the Compliance
# page (and the Dashboard compliance card), and — via the `inventory:`
# block — explodes the actual pending updates into a `windows_patches`
# sub-table so an operator can SQL-filter "which PCs are still missing
# KB5040442?".
#
# Shape mirrors `check-bitlocker.yaml`: ONE JSON object on stdout that
# the `check:` hint (reads `status` / `detail`) and the `inventory:` hint
# (displays `pending_count` / `critical_count`, explodes `patches[]`)
# both consume — no fences needed when both hints share one payload.
#
# `run_as: system`: the Windows Update COM API (`Microsoft.Update.Session`)
# needs the elevated agent context, so the search succeeds in production
# even though a non-elevated `kanade exec` would not. Same COM call the
# user-invokable `windows-update-scan.yaml` uses — but that one prints a
# human list for the Client App; THIS one emits structured JSON for the
# fleet compliance projection.
#
# Install:
#   kanade job create      configs/jobs/check-windows-patches.yaml
#   kanade schedule create configs/schedules/check-windows-patches.yaml
id: check-windows-patches
version: 0.1.0
description: Windows Update patch compliance — pending security updates per PC
# A patch check is both a health-check and a security control.
tags: [health-check, patching, security]
execute:
  shell: powershell
  run_as: system
  # The COM searcher can be slow (it consults the configured update
  # source — Windows Update or a WSUS server) — generous headroom, same
  # as windows-update-scan.yaml.
  timeout: 300s
  script: |
    $ErrorActionPreference = 'Stop'
    # Windows PowerShell 5.1 on the agent: no ternary / no `??`, and
    # native-command errors don't honour -ErrorAction Stop. Everything
    # below is plain if/else and a single try/catch so a degraded WU
    # stack reports `unknown` rather than killing the job.
    try {
      $session  = New-Object -ComObject Microsoft.Update.Session
      $searcher = $session.CreateUpdateSearcher()
      # IsInstalled=0 → pending; Type='Software' → skip driver churn;
      # IsHidden=0 → respect admin-hidden updates.
      $result = $searcher.Search("IsInstalled=0 and Type='Software' and IsHidden=0")

      $patches = @(foreach ($u in $result.Updates) {
        # KBArticleIDs is a collection and can be empty (rare for
        # software updates); UpdateID is always present, so it is the
        # stable explode identity.
        $kb = ''
        if ($u.KBArticleIDs -and $u.KBArticleIDs.Count -gt 0) {
          $kb = "KB" + [string]$u.KBArticleIDs.Item(0)
        }
        $sev = [string]$u.MsrcSeverity   # Critical/Important/Moderate/Low or ''
        if (-not $sev) { $sev = 'Unspecified' }
        [pscustomobject]@{
          id       = [string]$u.Identity.UpdateID
          kb       = $kb
          title    = [string]$u.Title
          severity = $sev
          size_mb  = [math]::Round([double]$u.MaxDownloadSize / 1MB, 1)
        }
      })

      $pending  = $patches.Count
      # `.Where({...})` (the array intrinsic method) over a Where-Object
      # pipeline: faster and avoids the scalar-unrolling that makes a
      # single match need an `@(...)` wrapper to keep `.Count` honest.
      $critical = $patches.Where({ $_.severity -eq 'Critical' -or $_.severity -eq 'Important' }).Count

      if ($pending -eq 0) {
        $status = 'ok'
        $detail = 'up to date — no pending updates'
      } elseif ($critical -gt 0) {
        $status = 'fail'
        $detail = "$critical critical/important of $pending pending update(s)"
      } else {
        $status = 'warn'
        $detail = "$pending pending update(s), none critical"
      }
    } catch {
      # `$_.Exception` can be $null for some error shapes, so guard before
      # reaching for `.Message` (the ErrorRecord itself stringifies to a
      # usable message as a fallback).
      $msg = if ($_.Exception -and $_.Exception.Message) { $_.Exception.Message } else { [string]$_ }
      $status   = 'unknown'
      $detail   = "patch scan failed: $msg"
      $patches  = @()
      $pending  = $null
      $critical = $null
    }

    [pscustomobject]@{
      status        = $status
      detail        = $detail
      pending_count = $pending
      critical_count = $critical
      patches       = $patches
    } | ConvertTo-Json -Compress -Depth 4
check:
  name: windows_patches
  label: "Windows パッチ準拠性"
  # alert: auto-notify on a compliance transition (e.g. ok -> fail). Fires
  # ONCE on entering an `on:` status (not every poll). Commented out so the
  # sample doesn't send live notifications; uncomment + set notify_groups
  # to activate. Placeholders: {pc_id} {name} {label} {status} {detail}
  # {last_logon}.
  # alert:
  #   on: [fail]
  #   notify_groups: [it-admins]
  #   priority: warn
  #   title: "Windows パッチが未準拠です"
  #   body: "{label}: {status} — {detail}（PC: {pc_id} / 利用者: {last_logon}）"
inventory:
  display:
    - { field: status, label: Patch status }
    - { field: detail, label: Detail }
    - { field: pending_count, label: Pending, type: number }
    - { field: critical_count, label: Critical/Important, type: number }
    - field: patches
      label: Pending updates
      type: table
      columns:
        - { field: kb, label: KB }
        - { field: title, label: Title }
        - { field: severity, label: Severity }
        - { field: size_mb, label: Size (MB), type: number }
  # Explode the pending list into a derived table so cross-fleet queries
  # ("which PCs still miss KB5040442?", "every host with a Critical
  # pending update") are normal indexed SQL, not JSON greps. `track_history`
  # captures when an update first appeared pending and when it cleared
  # (installed), so the patch-rollout curve is queryable. Identity is the
  # WU UpdateID (stable across re-scans); `kb` / `title` are indexed for
  # operator-friendly lookups.
  explode:
    - field: patches
      table: windows_patches
      primary_key: [id]
      track_history: true
      columns:
        - { field: id,       type: text }
        - { field: kb,       type: text, index: true }
        - { field: title,    type: text, index: true }
        - { field: severity, type: text }
        - { field: size_mb,  type: real }
