# Issue #378 — one-shot audit-policy enable for lock / unlock
# collection.
#
# Security 4800 / 4801 (workstation lock / unlock) only exist when
# the "Other Logon/Logoff Events" audit subcategory is enabled,
# and stock Windows ships with it DISABLED. The
# `collect-winlog-events` collector is deliberately read-only
# (collectors collect; they don't reconfigure the box), so the
# enable lives here as its own job, fired exactly once per PC by
# the `enable-session-audit` schedule
# (configs/schedules/enable-session-audit.yaml, `mode:
# once_per_pc` — exit 0 marks the PC done forever, a failure
# retries on the next tick, and a PC that joins the fleet later is
# picked up automatically).
#
# Install (job + schedule):
#
#   kanade job create      configs/jobs/enable-session-audit.yaml
#   kanade schedule create configs/schedules/enable-session-audit.yaml
#
# GUID-form subcategory because display names are localized (this
# fleet has ja-JP hosts; "Other Logon/Logoff Events" would not
# match). `run_as: system` — audit-policy writes need
# SeSecurityPrivilege.
#
# Note: an operator who deliberately disables this subcategory
# later will NOT be fought — once a PC has succeeded, the
# `once_per_pc` schedule never re-fires there. Re-enable by
# clearing that PC's completion (or `kanade exec
# enable-session-audit --pcs <pc>` ad hoc).

id: enable-session-audit
version: 0.1.0
description: "Enable the 'Other Logon/Logoff Events' audit subcategory (Security 4800/4801, lock/unlock) — once per PC"

execute:
  shell: powershell
  timeout: 60s
  run_as: system
  script: |
    $ErrorActionPreference = 'Stop'

    # Native command: try/catch can't see a non-zero exit and
    # `Out-Null` wouldn't swallow stderr — capture both streams
    # and check $LASTEXITCODE (Gemini #379 medium, carried over
    # from the collector before this moved into its own job). EAP
    # drops to Continue around the call because PowerShell 5.1
    # turns redirected native stderr into a terminating
    # NativeCommandError under `$ErrorActionPreference = 'Stop'`.
    $prevEap = $ErrorActionPreference
    $ErrorActionPreference = 'Continue'
    $out = & auditpol /set /subcategory:"{0CCE921C-69AE-11D9-BED3-505054503030}" /success:enable 2>&1
    $ErrorActionPreference = $prevEap
    if ($LASTEXITCODE -ne 0) {
        # Non-zero exit → the once_per_pc schedule retries this PC
        # on its next tick.
        Write-Output "auditpol enable failed (exit ${LASTEXITCODE}): $out"
        exit 1
    }
    Write-Output "audit subcategory 'Other Logon/Logoff Events' (success) enabled on $env:COMPUTERNAME"
