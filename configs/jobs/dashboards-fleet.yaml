# Fleet analytics dashboards (#720) — declares `aggregate:` widgets for
# the SPA Analytics page over obs_events the fleet ALREADY emits:
# logon / boot / unexpected_shutdown from `collect-winlog-events`, and
# agent_started / agent_self_update from the agent itself. No new
# collector is needed.
#
# This is a DEFINITION-ONLY carrier: `aggregate:` is read by the backend
# straight from the job catalog (BUCKET_JOBS) at query time, so this job
# never has to run. The `execute:` block is a no-op and there is no
# schedule — registering it (`kanade job create`) is enough to make the
# dashboards appear.
#
# `aggregate:` widgets reference an obs_event `kind`, not this job's own
# output, so one carrier can chart events emitted by many other jobs.
#
#   kanade job create configs/jobs/dashboards-fleet.yaml
#
# See configs/jobs/collect-winlog-events.yaml for the source events, and
# the per-job `aggregate:` blocks (e.g. attendance dashboards) for the
# co-located pattern.

id: dashboards-fleet
version: 0.1.0
description: "Analytics dashboards: reliability / access / agent health (definition-only)"
tags: [dashboards]

# Never scheduled or run — a placeholder so the manifest is valid.
execute:
  shell: powershell
  timeout: 10s
  script: "exit 0"

aggregate:
  # ── Reliability ──────────────────────────────────────────────────
  - dashboard: Reliability
    title: Unexpected shutdowns by PC
    scope: fleet
    kind: unexpected_shutdown
    agg: count
    group_by: pc_id
    render: bar
  - dashboard: Reliability
    title: Unexpected shutdowns (total)
    scope: fleet
    kind: unexpected_shutdown
    agg: count
    render: stat
  - dashboard: Reliability
    title: Reboots by hour (fleet)
    scope: fleet
    kind: boot
    agg: count
    time_bucket: hour
    render: timeline
  - dashboard: Reliability
    title: This PC's reboots by hour
    scope: pc
    kind: boot
    agg: count
    time_bucket: hour
    render: timeline

  # ── Access / Security ────────────────────────────────────────────
  # NB on logon payloads: the SCHEDULED collect-winlog-events emits
  # `logon` from Winlogon 7001 (source winlog:System) with `user` (a SID
  # leaf name) but NO `logon_type`. `logon_type` only exists on the
  # Security 4624 events from the on-demand collect-winlog-logons-all
  # (source winlog:Security) — so the by-type widget is source-pinned to
  # it and stays empty until that job is run. `user` exists on both, so
  # the top-users / by-hour widgets work on the default fleet.
  - dashboard: Access
    title: Logons by type (Security 4624)
    scope: fleet
    kind: logon
    source: winlog:Security
    agg: count
    group_by: logon_type
    render: bar
  - dashboard: Access
    title: Top users by logon (fleet)
    scope: fleet
    kind: logon
    agg: count
    group_by: user
    render: bar
  - dashboard: Access
    title: Logons by hour (fleet)
    scope: fleet
    kind: logon
    agg: count
    time_bucket: hour
    render: timeline
  - dashboard: Access
    title: This PC's logons by hour
    scope: pc
    kind: logon
    agg: count
    time_bucket: hour
    render: timeline

  # ── Agent health ─────────────────────────────────────────────────
  - dashboard: Agent health
    title: Self-updates by PC
    scope: fleet
    kind: agent_self_update
    agg: count
    group_by: pc_id
    render: bar
  - dashboard: Agent health
    title: Agent restarts by PC
    scope: fleet
    kind: agent_started
    agg: count
    group_by: pc_id
    render: bar
