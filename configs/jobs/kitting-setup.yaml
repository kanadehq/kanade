# Sample kitting / first-boot job — fired once per PC by the
# `kitting-once` schedule (configs/schedules/kitting-once.yaml).
#
# Install:
#
#   kanade job create     configs/jobs/kitting-setup.yaml
#   kanade schedule create configs/schedules/kitting-once.yaml
#
# Real kitting scripts would do things like:
#   * Set the timezone / locale
#   * Install / configure antivirus, monitoring agent
#   * Set the hostname, join the domain
#   * Push baseline registry / GPO settings
#   * Pre-create the operator's account
#
# This sample only prints a setup confirmation line so it runs
# safely without admin and gives the SPA Results page something
# visible to inspect. Replace the body with your real bootstrap
# pipeline — exit 0 = "this PC is kitted, never run me on it
# again" (per the `when: per_pc: once` dedup in the schedule).
#
# Failure handling:
#   * exit != 0 → scheduler picks the PC up again on the next tick
#     and re-fires (until it succeeds, or the operator yanks the
#     schedule). Make the script idempotent.

id: kitting-setup
version: 0.1.0
description: First-boot setup pipeline (sample — no real side effects)
execute:
  shell: powershell
  timeout: 5m
  # v0.21: which (token, session) the agent uses to spawn the child.
  #   system     (default) — Session 0, LocalSystem privs, no GUI.
  #                          Use for HKLM / driver / system-wide install.
  #   user                 — user's session + user's (UAC-filtered) privs.
  #                          Use for HKCU / %APPDATA% / Slack notifications /
  #                          anything that needs the user's identity or
  #                          should show a window to them.
  #   system_gui           — user's session + LocalSystem privs.
  #                          Niche: admin installer with visible UI.
  run_as: system
  # Optional working directory for the spawned shell. Without this
  # the agent service's cwd (= %SystemRoot%\System32) is inherited,
  # which is almost never what scripts expect.
  #
  # v0.21.2: agent expands `~` (leading) → token's USERPROFILE,
  # then expands `%FOO%` env-vars against the token's environment.
  # PowerShell's `$env:FOO` syntax is NOT supported (use `%FOO%`).
  #
  # Examples:
  #   cwd: 'C:\ProgramData\Kanade\data'              # absolute, run_as: system
  #   cwd: '%PROGRAMDATA%\Kanade\data'                # same result, any run_as
  #   cwd: '~'                                        # run_as: user → C:\Users\<them>
  #   cwd: '~\src\foo'                                # → C:\Users\<them>\src\foo
  #   cwd: '%USERPROFILE%\src\foo'                    # same as above
  #   cwd: '%APPDATA%\Foo'                            # → C:\Users\<them>\AppData\Roaming\Foo
  script: |
    $ErrorActionPreference = 'Stop'
    Write-Output "kitting kanade-setup on $env:COMPUTERNAME at $(Get-Date -Format 'o')"
    Write-Output "running as: $env:USERNAME / session $((Get-Process -Id $pid).SessionId)"
    # Add your real bootstrap commands above this line.
