# Edge browser extension compliance + inventory (operator-defined).
#
# Scans EVERY local user's Edge profiles (id / name / version / enabled /
# install source) and emits ONE JSON object two hints consume (compose):
#
#   * check:     → Compliance page pass/fail against the policy below
#                  (blocklist / allowlist / sideload flag).
#   * inventory: → Inventory page table + the `inventory_edge_exts`
#                  explode table, so "which user on which PC has extension
#                  X" is an indexed cross-PC/user query, with history.
#
# run_as: system — SYSTEM can read every user's profile under C:\Users, so
# this covers all accounts on a shared / RDP / multi-user box (and runs
# even when nobody is interactively logged in). A per-user job would only
# ever see the active session. Reading other users' browser profile data
# is appropriate for a disclosed, policy-backed compliance control.
#
#   kanade job create      configs/jobs/edge-extensions.yaml
#   kanade schedule create configs/schedules/edge-extensions.yaml

id: edge-extensions
version: 0.2.0
description: Edge installed-extension compliance + inventory (all local users)
tags: [health-check, security, inventory]

execute:
  shell: powershell
  run_as: system
  timeout: 120s
  script: |
    $ErrorActionPreference = 'Stop'

    # Edge's `Secure Preferences` is large and Windows PowerShell 5.1's
    # ConvertFrom-Json chokes on it (depth / duplicate keys). Parse with
    # JavaScriptSerializer (System.Web.Extensions, always present on the
    # .NET Framework PS 5.1 runs on) into nested IDictionary / object[].
    Add-Type -AssemblyName System.Web.Extensions
    $jss = New-Object System.Web.Script.Serialization.JavaScriptSerializer
    $jss.MaxJsonLength = [int]::MaxValue
    $jss.RecursionLimit = 1024

    # ── Policy (operator-editable) ───────────────────────────────────
    # Banned extension IDs — any present → fail. e.g. @('aapbdbdomjkkjkaonfhkkikfgjllcleb')
    $Blocklist = @()
    # If non-empty, ANY extension whose id isn't listed (and isn't
    # policy-/component-installed) → fail. Leave empty to allow all.
    $Allowlist = @()
    # Warn on sideloaded / developer-mode extensions (not from the Web
    # Store, not policy-forced, not a browser component).
    $FlagSideloaded = $true

    # Chromium Extension::Location enum → human source. `from_webstore`
    # (when present) wins. policy/component are "managed"; unpacked /
    # external are "sideloaded".
    function Source-Of($s) {
      if ($s.ContainsKey('from_webstore') -and [bool]$s['from_webstore']) { return 'webstore' }
      $loc = if ($s.ContainsKey('location')) { [int]$s['location'] } else { -1 }
      switch ($loc) {
        1  { 'webstore' }
        4  { 'unpacked' }            # load-unpacked / dev mode
        2  { 'external' }            # external_pref
        3  { 'external_registry' }   # sideloaded via registry
        6  { 'external' }            # external_pref_download
        5  { 'component' }
        10 { 'component' }           # external_component
        7  { 'policy' }              # external_policy_download
        9  { 'policy' }              # external_policy
        8  { 'command_line' }
        default { "other($loc)" }
      }
    }

    # Resolve a possibly-localized extension name (`__MSG_key__`) from the
    # extension's newest version manifest + _locales messages.
    function Resolve-Name($id, $raw, $extRoot) {
      if ($raw -and $raw -notlike '__MSG_*') { return $raw }
      $dir = Join-Path $extRoot $id
      if (-not (Test-Path $dir)) { return $(if ($raw) { $raw } else { $id }) }
      # Version dirs are `<semver>_<n>` (e.g. `2.0.16_0`) — sort by parsed
      # [version], not alphabetically (else 10.x < 9.x picks the wrong one).
      $ver = Get-ChildItem $dir -Directory -ErrorAction SilentlyContinue |
        Sort-Object { try { [version](($_.Name -split '_')[0]) } catch { [version]'0.0' } } -Descending |
        Select-Object -First 1
      if (-not $ver) { return $(if ($raw) { $raw } else { $id }) }
      $mf = Join-Path $ver.FullName 'manifest.json'
      if (-not (Test-Path $mf)) { return $(if ($raw) { $raw } else { $id }) }
      try {
        $m = Get-Content $mf -Raw -ErrorAction Stop | ConvertFrom-Json
        $n = [string]$m.name
        if ($n -notlike '__MSG_*') { return $(if ($n) { $n } else { $id }) }
        $key = ($n -replace '^__MSG_','' -replace '__$','')
        $loc = if ($m.default_locale) { [string]$m.default_locale } else { 'en' }
        foreach ($l in @($loc,'en','en_US') | Select-Object -Unique) {
          $msgs = Join-Path $ver.FullName "_locales\$l\messages.json"
          if (Test-Path $msgs) {
            $mm = Get-Content $msgs -Raw -ErrorAction Stop | ConvertFrom-Json
            $e = $mm.$key
            if ($e -and $e.message) { return [string]$e.message }
          }
        }
      } catch {}
      return $id
    }

    # Real user profiles via Win32_UserProfile — robust to redirected /
    # non-C: profile paths and skips service/system profiles (`Special`)
    # without a hardcoded list. SYSTEM reads them all (multi-user coverage).
    $exts = @()
    $userProfiles = @(Get-CimInstance Win32_UserProfile -ErrorAction SilentlyContinue |
      Where-Object { -not $_.Special -and $_.LocalPath })
    foreach ($up in $userProfiles) {
        $userName = Split-Path -Leaf $up.LocalPath
        $root = Join-Path $up.LocalPath 'AppData\Local\Microsoft\Edge\User Data'
        if (-not (Test-Path $root)) { continue }
        $profiles = Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -eq 'Default' -or $_.Name -like 'Profile *' }
        foreach ($p in $profiles) {
          $extRoot = Join-Path $p.FullName 'Extensions'
          $prefsFile = Join-Path $p.FullName 'Secure Preferences'
          if (-not (Test-Path $prefsFile)) { $prefsFile = Join-Path $p.FullName 'Preferences' }
          if (-not (Test-Path $prefsFile)) { continue }
          # Open share-read (Edge holds the prefs file open for a logged-in
          # user) and read the stream directly — no temp copy needed since
          # FileShare ReadWrite|Delete lets us read the live file.
          $fs = $null; $sr = $null
          try {
            $fs = [System.IO.File]::Open($prefsFile, 'Open', 'Read', 'ReadWrite,Delete')
            $sr = New-Object System.IO.StreamReader($fs)
            $prefs = $jss.DeserializeObject($sr.ReadToEnd())
          } catch {
            [Console]::Error.WriteLine("edge-extensions: skip $userName/$($p.Name) (read failed: $_)")
            continue
          } finally {
            if ($sr) { $sr.Dispose() }
            if ($fs) { $fs.Dispose() }
          }
          if (-not ($prefs -is [System.Collections.IDictionary]) -or -not $prefs.ContainsKey('extensions')) { continue }
          $extsNode = $prefs['extensions']
          if (-not ($extsNode -is [System.Collections.IDictionary]) -or -not $extsNode.ContainsKey('settings')) { continue }
          $settings = $extsNode['settings']
          if (-not ($settings -is [System.Collections.IDictionary])) { continue }
          foreach ($id in @($settings.Keys)) {
            # Extension IDs are 32 lowercase a-p letters; skip anything else
            # (Chromium also stashes non-extension keys here).
            if ($id -notmatch '^[a-p]{32}$') { continue }
            $s = $settings[$id]
            if (-not ($s -is [System.Collections.IDictionary])) { continue }
            $manifest = if ($s.ContainsKey('manifest')) { $s['manifest'] } else { $null }
            $hasManifest = ($manifest -is [System.Collections.IDictionary])
            # A settings entry with no manifest is a Chromium bookkeeping
            # stub (no name/version/location), not a real installed
            # extension — skip so the inventory + count stay meaningful.
            if (-not $hasManifest) { continue }
            $rawName = if ($manifest.ContainsKey('name')) { [string]$manifest['name'] } else { '' }
            $version = if ($manifest.ContainsKey('version')) { [string]$manifest['version'] } else { '' }
            $state   = if ($s.ContainsKey('state')) { [int]$s['state'] } else { 0 }
            $exts += [pscustomobject]@{
              user    = $userName
              profile = $p.Name
              id      = $id
              name    = Resolve-Name $id $rawName $extRoot
              version = $version
              enabled = ($state -eq 1)
              source  = (Source-Of $s)
            }
          }
        }
    }
    $exts = @($exts | Sort-Object -Property user, profile, name)

    # ── Evaluate policy ──────────────────────────────────────────────
    $managed = @('policy','component')
    $blocked    = @($exts | Where-Object { $Blocklist -contains $_.id })
    # Sideloaded = anything not from the Web Store and not managed
    # (policy/component) — covers unpacked / external / external_registry /
    # command_line / unknown locations, not just a hardcoded few.
    $sideloaded = @($exts | Where-Object { $_.source -ne 'webstore' -and $_.source -notin $managed })
    $notAllowed = @()
    if ($Allowlist.Count -gt 0) {
      $notAllowed = @($exts | Where-Object { $Allowlist -notcontains $_.id -and $_.source -notin $managed })
    }
    # Offenders read "<user>/<name>" so a multi-user box says who.
    $fmt = { param($x) ($x | ForEach-Object { "$($_.user)/$($_.name)" }) -join ', ' }

    $status = 'ok'; $parts = @()
    if ($blocked.Count -gt 0) {
      $status = 'fail'; $parts += "blocked: " + (& $fmt $blocked)
    }
    if ($notAllowed.Count -gt 0) {
      $status = 'fail'; $parts += "not allow-listed: " + (& $fmt $notAllowed)
    }
    if ($FlagSideloaded -and $sideloaded.Count -gt 0) {
      if ($status -ne 'fail') { $status = 'warn' }
      $parts += "sideloaded: " + (& $fmt $sideloaded)
    }
    $detail = if ($parts.Count -gt 0) { $parts -join ' | ' } else { "$($exts.Count) extension(s), all compliant" }

    [pscustomobject]@{
      status     = $status
      detail     = $detail
      hostname   = [System.Environment]::MachineName
      count      = $exts.Count
      extensions = $exts
    } | ConvertTo-Json -Compress -Depth 5

# Compliance gate (Compliance page). status/detail are the default
# fields the agent reads.
check:
  name: edge_extensions
  label: "Edge 拡張機能のコンプライアンス"

# Cross-PC/user audit (Inventory page) — composes with check: by reading
# the rest of the same stdout object.
inventory:
  display:
    - { field: hostname, label: Hostname }
    - { field: count, label: Extensions }
    - field: extensions
      label: Installed extensions
      type: table
      columns:
        - { field: user,    label: User    }
        - { field: profile, label: Profile }
        - { field: name,    label: Name    }
        - { field: version, label: Version }
        - { field: enabled, label: Enabled }
        - { field: source,  label: Source  }
        - { field: id,      label: ID      }
  summary:
    - { field: hostname, label: Hostname }
    - { field: count, label: Extensions }
  # Flatten extensions[] into a queryable table keyed by (id, user,
  # profile) — an extension can exist for several users / profiles.
  # History tracks install / remove / version changes per key.
  #
  # DEPLOY NOTE: the explode table isn't auto-migrated (the projector does
  # CREATE TABLE IF NOT EXISTS, no ALTER). v0.2.0 changed the primary key
  # (added `user`) vs the v0.1.0 (id, profile) shape, so if you ran v0.1.0
  # drop the table once before applying:  DROP TABLE inventory_edge_exts;
  explode:
    - field: extensions
      table: inventory_edge_exts
      primary_key: [id, user, profile]
      track_history: true
      columns:
        - { field: user,    type: text, index: true }
        - { field: profile, type: text }
        - { field: id,      type: text, index: true }
        - { field: name,    type: text, index: true }
        - { field: version, type: text }
        # JSON bools bind as "true"/"false" text (the projector stringifies
        # them regardless of affinity), so query this column as = 'true'.
        - { field: enabled, type: text }
        - { field: source,  type: text, index: true }
