# USER-INVOKABLE job (#291) — "アップデート" (SoftwareUpdate) tab.
#
# Upgrades every winget-managed app on the box in one go. `run_as:
# system` so the MSI installers elevate without a UAC prompt in the
# user's face (the agent is LocalSystem). See fix-teams-cache.yaml for
# the full `client:` contract.
#
# Register (user-fired, no schedule):
#   kanade job create configs/jobs/winget-upgrade-all.yaml
id: winget-upgrade-all
tags: [update]   # operator taxonomy for the SPA tag filter
version: 1.0.0
description: Upgrade all winget-managed apps to their latest versions (operator note)
execute:
  shell: powershell
  run_as: system
  timeout: 1800s
  script: |
    $ErrorActionPreference = 'Stop'
    winget upgrade --all --silent --include-unknown --accept-source-agreements --accept-package-agreements
    # winget exits non-zero when there was simply nothing to upgrade
    # (0x8A15002B / no applicable upgrades); treat that as success.
    if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne -1978335189) {
      throw "winget upgrade --all failed with exit code $LASTEXITCODE"
    }
    Write-Output 'すべての対象アプリを最新化しました。'
client:
  name: "すべてのアプリを更新"
  description: "インストール済みアプリをまとめて最新版に更新します(時間がかかることがあります)"
  category: software_update
  icon: refresh-cw
