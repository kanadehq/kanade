# USER-INVOKABLE job (#291) — "困ったとき" (Troubleshoot) tab.
#
# Restarts the Print Spooler service — the standard fix for stuck print
# queues and "printer not responding". `run_as: system`: Spooler is a
# machine service. See fix-teams-cache.yaml for the full `client:`
# contract.
#
# Register (user-fired, no schedule):
#   kanade job create configs/jobs/restart-print-spooler.yaml
id: restart-print-spooler
version: 1.0.0
description: Restart the Windows Print Spooler service (operator note)
execute:
  shell: powershell
  run_as: system
  timeout: 60s
  script: |
    $ErrorActionPreference = 'Stop'
    Restart-Service -Name Spooler -Force
    $svc = Get-Service -Name Spooler
    if ($svc.Status -ne 'Running') { throw "Spooler is $($svc.Status) after restart" }
    Write-Output '印刷スプーラーを再起動しました。印刷をやり直してください。'
client:
  name: "印刷スプーラーを再起動"
  description: "印刷が止まる・プリンターが応答しないときに試してください"
  category: troubleshoot
  icon: printer
