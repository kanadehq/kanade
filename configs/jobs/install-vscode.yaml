# USER-INVOKABLE job (#291) — the software catalog (Catalog) tab.
#
# Self-service install of Visual Studio Code via winget. `run_as:
# system` so the machine-wide MSI elevates without a UAC prompt. See
# fix-teams-cache.yaml for the full `client:` contract.
#
# Register (user-fired, no schedule):
#   kanade job create configs/jobs/install-vscode.yaml
id: install-vscode
version: 1.0.0
description: Install Visual Studio Code via winget (operator note)
execute:
  shell: powershell
  run_as: system
  timeout: 600s
  script: |
    $ErrorActionPreference = 'Stop'
    winget install --id Microsoft.VisualStudioCode --silent --accept-source-agreements --accept-package-agreements
    # 0x8A15002F (-1978335185) = already installed; treat as success so a
    # re-run on an already-equipped machine isn't reported as a failure.
    if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne -1978335185) {
      throw "winget install failed with exit code $LASTEXITCODE"
    }
    Write-Output 'Visual Studio Code をインストールしました（または既にインストール済みです）。'
client:
  name: "VS Code をインストール"
  description: "コードエディタ Visual Studio Code"
  category: catalog
  icon: code
