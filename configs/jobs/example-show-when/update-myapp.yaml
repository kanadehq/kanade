# Example show_when pattern — part 2 of 2: the UPDATE button.
#
# This is the user-facing action. `client.show_when` keeps it OUT of the
# Client App catalog unless the `myapp-up-to-date` check (part 1) is `fail`
# — i.e. only machines that are stale or missing MyApp see the button. Once
# MyApp is current the check goes `ok` and the button disappears.
#
# Instant disappearance: this job ALSO carries a `check:` named the SAME
# slug (`myapp-up-to-date`). `jobs.execute` forwards `check:` (like
# `collect:`), so a button-press run re-evaluates and records the check on
# completion — checks are keyed by NAME, so this overwrites the detector's
# result and `check_cache.record` re-publishes the snapshot immediately. No
# wait for the detector's next scheduled run. The Client App re-pulls
# `jobs.list` when the run finishes, so the button drops off right away.
#
# Note the script FENCES its check JSON (`#KANADE-CHECK-…`): its stdout is
# also the user-visible progress text, so the machine-readable status must
# be fenced off from the human message (#821 multi-hint composition).
#
# Create (no schedule — it's user-triggered):
#   kanade job create configs/jobs/example-show-when/update-myapp.yaml
id: update-myapp
version: 0.1.0
description: Update MyApp to the target version (user-invokable)
tags: [software_update]
execute:
  shell: powershell
  run_as: system
  timeout: 30m            # near-silent installer; the #865 watchdog honors this
  script: |
    $ErrorActionPreference = 'Stop'
    $target = [version]'2.4.0'

    Write-Output "MyApp を更新しています… (完了まで数分かかることがあります)"
    # ... real installer invocation here, e.g.:
    #   Start-Process -Wait -FilePath \\fileshare\myapp\setup.exe -ArgumentList '/quiet'
    # (omitted in this example)

    # Re-read the installed version AFTER the update and emit it as the
    # same check the button is gated on, so the gate flips immediately.
    $installed = $null
    try {
      $p = 'HKLM:\SOFTWARE\Example\MyApp'
      if (Test-Path $p) { $installed = [version](Get-ItemProperty $p).Version }
    } catch { $installed = $null }
    $upToDate = $installed -ne $null -and $installed -ge $target

    if ($upToDate) { Write-Output "更新が完了しました（バージョン $installed）。" }
    else           { Write-Output "更新を試みましたが、まだ最新ではありません。時間をおいて再度お試しください。" }

    # Fenced so it never shows to the user; same slug as the detector.
    $status = if ($upToDate) { 'ok' } else { 'fail' }
    Write-Output '#KANADE-CHECK-BEGIN'
    @{ status = $status; detail = "installed $installed / target $target" } |
      ConvertTo-Json -Compress | Write-Output
    Write-Output '#KANADE-CHECK-END'
client:
  name: "MyApp を最新に更新"
  description: "新しいバージョンが利用可能です。クリックで更新します。"
  category: software_update
  icon: download
  # The display gate: show ONLY while the machine is not yet up to date.
  # Accepts a scalar (`is: fail`) or a list. Use [fail, unknown] to also
  # show it when the check couldn't run (fail-open); plain [fail] keeps it
  # hidden on an indeterminate check (fail-closed).
  show_when:
    check: myapp-up-to-date
    is: [fail]
check:
  name: myapp-up-to-date     # SAME slug as the detector → shared entry
  label: "MyApp のバージョン"
  health: false              # gate-only, like the detector — not a Health row
