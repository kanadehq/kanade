# Role-level NATS authorization for kanade — VALIDATED, NOT YET SHIPPED.
#
# This is the `authorization { users: [...] }` block that is meant to replace
# the single shared token in `nats-server.conf`. The broker the deploy scripts
# install does NOT run it yet: nothing in `deploy/` or `deploy-nats.ps1`
# references this file. It exists so the block can be proven correct before
# anyone switches a fleet over, and the switch is a separate change.
#
# The block is validated by a conformance test that starts a real
# nats-server with it and drives every role's real flows (the real `connect`
# helper, the backend and agent binaries, the `kanade run` / `kanade kill`
# CLI). A permission that is missing does not fail loudly — a JetStream read
# stalls, a publish is dropped, a request times out — so a hand-written
# subject list is not evidence. Run it with:
#
#   cargo build -p kanade-backend -p kanade-agent -p kanade
#   cargo test -p kanade-agent --test nats_role_conformance -- --ignored
#
# Three users, nothing else:
#
#   agent       every endpoint. The most numerous and least trusted role.
#   backend     the one process that administers JetStream and fans commands out.
#   breakglass  the CLI's `run` and `kill`, for use while the backend is down.
#
# Every user is default-deny: a subject appears below only because one of that
# role's real flows needs it, and the reason sits next to it. Where the
# starting inventory (derived from reading the code) and the measured flows
# disagreed, the measured flows won and the entry says so.
#
# Passwords
# ---------
# `$KANADE_CONFORMANCE_<ROLE>_PASSWORD` are nats-server environment variable
# references, so the checked-in file carries no secret and the test injects a
# throwaway value into the broker's environment. A real deployment would put a
# bcrypt hash here instead (`nats server passwd` mints one); nats-server
# accepts a `$2a$...` string in the same field and the client still presents
# the plaintext, so nothing else in this file changes.
#
# What a subject-level block cannot do
# ------------------------------------
# The three users are shared by every host of a role, so the broker cannot
# tell one agent from another. Concretely, an agent may write any key of
# `notifications_read` (not only its own host's), and may read another host's
# `commands.pc.<id>` inbox. Those are residuals of per-role identity, not of
# this block; per-agent identity (NKeys / JWT) is the later step. They are
# recorded in the conformance test rather than assumed away.
#
# Measured on nats-server 2.14.1 (the pinned version), where the starting
# inventory and the real flows disagreed:
#   * `allow_responses` covers JetStream acknowledgement replies and
#     flow-control replies, so neither `$JS.ACK.>` nor `$JS.FC.>` is granted:
#     the replay durable's acks advance, and a multi-MiB object read (which
#     makes the broker issue flow-control requests) completes.
#   * Every role publishes one empty message to a fresh _INBOX subject as a
#     liveness probe, hence `_INBOX.>` in every publish list.
#   * Object put needs `STREAM.MSG.GET.OBJ_<store>` (existing-object check);
#     object get needs `CONSUMER.CREATE.OBJ_<store>`. The agent never puts over
#     an existing object (it reuses an identical one or picks a distinct key),
#     so it holds no `STREAM.PURGE.OBJ_<store>`: the purge names the whole
#     stream and its filter sits in the body, so only the backend's own
#     deletions use it.
#   * A pull consumer's periodic `CONSUMER.INFO` is needed after a reconnect.
#   * Ephemeral pull consumers (notification replay) are created unnamed, so
#     `CONSUMER.CREATE.<stream>` carries no name.
#
# JetStream wire subjects (async-nats 0.50), which is what the lists below are
# written against:
#   KV get                    $JS.API.DIRECT.GET.KV_<bucket>.$KV.<bucket>.<key>
#   KV put / update / delete  JetStream publish to $KV.<bucket>.<key>
#   KV watch / watch_all /    an ordered push consumer, created with
#     keys()                  $JS.API.CONSUMER.CREATE.KV_<bucket> (no key in the
#                             subject, so reads are bucket-level), delivering
#                             on _INBOX.* with flow control on $JS.FC.*
#   get_key_value / get_*     $JS.API.STREAM.INFO.<name>
#   object store              $JS.API.STREAM.MSG.GET.OBJ_<store>, chunks and
#                             metadata on $O.<store>.C.* / $O.<store>.M.*;
#                             a put over an existing name or a delete purges
#                             via $JS.API.STREAM.PURGE.OBJ_<store>

authorization {
  users: [
    # ───────────────────────────── agent ─────────────────────────────
    {
      user: "agent"
      password: $KANADE_CONFORMANCE_AGENT_PASSWORD
      permissions: {
        publish: {
          allow: [
            # Liveness probe: every role's connect helper publishes one empty
            # message to a fresh _INBOX subject to tell a dead client from a
            # disconnected one (`nats_client::is_dead`, every 15 s). Without
            # this the probe is a permission violation on every tick. The
            # cost is that the role can also publish into another client's
            # reply inbox, i.e. spoof a reply; the reply payloads are
            # re-validated by their consumers, and narrowing this needs the
            # probe to stop publishing (a PING flush would do) first.
            "_INBOX.>"

            # Core telemetry (no stream, no ack).
            "heartbeat.*"
            "host_perf.*"
            "process_perf.*"
            "remote.frame.*"

            # JetStream publishes. Each is acknowledged, so the reply lands on
            # an _INBOX subject (see subscribe below).
            "results.*"
            "events.started.*.*"
            "events.notifications.*.*.*.*"
            "obs.*"

            # The only KV bucket an agent writes: its own notification
            # read-state. Everything else an agent reads is read-only.
            "$KV.notifications_read.>"

            # The only object stores an agent writes: job output spill-over
            # and collect bundles.
            "$O.result_output.>"
            "$O.collections.>"

            # JetStream API: stream info is the call that precedes every KV
            # or object-store access (get_key_value / get_object_store).
            "$JS.API.STREAM.INFO.KV_agent_config"
            "$JS.API.STREAM.INFO.KV_agent_groups"
            "$JS.API.STREAM.INFO.KV_agent_groups_derived"
            "$JS.API.STREAM.INFO.KV_script_current"
            "$JS.API.STREAM.INFO.KV_script_status"
            "$JS.API.STREAM.INFO.KV_jobs"
            "$JS.API.STREAM.INFO.KV_schedules"
            "$JS.API.STREAM.INFO.KV_fleet_config"
            "$JS.API.STREAM.INFO.KV_notifications_read"
            "$JS.API.STREAM.INFO.OBJ_scripts"
            "$JS.API.STREAM.INFO.OBJ_agent_releases"
            "$JS.API.STREAM.INFO.OBJ_result_output"
            "$JS.API.STREAM.INFO.OBJ_collections"
            "$JS.API.STREAM.INFO.EXEC"
            "$JS.API.STREAM.INFO.NOTIFICATIONS"
            "$JS.API.DIRECT.GET.KV_agent_config.>"
            "$JS.API.DIRECT.GET.KV_agent_groups.>"
            "$JS.API.DIRECT.GET.KV_agent_groups_derived.>"
            "$JS.API.DIRECT.GET.KV_script_current.>"
            "$JS.API.DIRECT.GET.KV_script_status.>"
            "$JS.API.DIRECT.GET.KV_jobs.>"
            "$JS.API.DIRECT.GET.KV_schedules.>"
            "$JS.API.DIRECT.GET.KV_fleet_config.>"
            "$JS.API.DIRECT.GET.KV_notifications_read.>"
            "$JS.API.CONSUMER.CREATE.KV_agent_config"
            "$JS.API.CONSUMER.CREATE.KV_agent_groups"
            "$JS.API.CONSUMER.CREATE.KV_agent_groups_derived"
            "$JS.API.CONSUMER.CREATE.KV_script_current"
            "$JS.API.CONSUMER.CREATE.KV_script_status"
            "$JS.API.CONSUMER.CREATE.KV_jobs"
            "$JS.API.CONSUMER.CREATE.KV_schedules"
            "$JS.API.CONSUMER.CREATE.KV_fleet_config"
            "$JS.API.CONSUMER.CREATE.KV_notifications_read"
            "$JS.API.STREAM.MSG.GET.OBJ_scripts"
            "$JS.API.STREAM.MSG.GET.OBJ_agent_releases"
            "$JS.API.STREAM.MSG.GET.OBJ_result_output"
            "$JS.API.STREAM.MSG.GET.OBJ_collections"
            "$JS.API.CONSUMER.CREATE.OBJ_scripts"
            "$JS.API.CONSUMER.CREATE.OBJ_agent_releases"
            "$JS.API.CONSUMER.CREATE.EXEC.*"
            "$JS.API.CONSUMER.INFO.EXEC.*"
            "$JS.API.CONSUMER.MSG.NEXT.EXEC.*"
            "$JS.API.CONSUMER.CREATE.NOTIFICATIONS"
            "$JS.API.CONSUMER.MSG.NEXT.NOTIFICATIONS.*"
            "$JS.API.CONSUMER.MSG.NEXT.KV_notifications_read.*"
          ]
        }
        subscribe: {
          allow: [
            # Replies to this agent's own requests and the delivery subject of
            # every ordered push consumer (KV watch / keys(), object get).
            "_INBOX.>"

            # NARROWING: the command plane is still broadcast in this
            # transitional block. Once commands move to a per-host path these
            # lines are the ones to delete (and the matching rows in the
            # conformance test's expectation table to flip to Denied).
            "commands.all"
            "commands.group.*"
            "commands.pc.*"

            "notifications.all"
            "notifications.group.*"
            "notifications.pc.*"
            "notif-amend"
            "agents.*.ping"
            "logs.fetch.*"
            "job.tail.*"
            "remote.ctrl.*"
            "kill.*"
          ]
        }
        allow_responses: true
      }
    }

    # ──────────────────────────── backend ────────────────────────────
    {
      user: "backend"
      password: $KANADE_CONFORMANCE_BACKEND_PASSWORD
      permissions: {
        publish: {
          allow: [
            # Liveness probe: every role's connect helper publishes one empty
            # message to a fresh _INBOX subject to tell a dead client from a
            # disconnected one (`nats_client::is_dead`, every 15 s). Without
            # this the probe is a permission violation on every tick. The
            # cost is that the role can also publish into another client's
            # reply inbox, i.e. spoof a reply; the reply payloads are
            # re-validated by their consumers, and narrowing this needs the
            # probe to stop publishing (a PING flush would do) first.
            "_INBOX.>"

            "commands.>"
            "kill.*"
            "notif-amend"
            "audit.>"
            "notifications.>"
            "obs.*"
            "agents.*.ping"
            "logs.fetch.*"
            "job.tail.*"
            "remote.ctrl.*"
            "$KV.>"
            "$O.>"
            "$JS.API.>"
          ]
        }
        subscribe: {
          allow: [
            "_INBOX.>"
            "heartbeat.>"
            "host_perf.>"
            "process_perf.>"
            "results.*"
            "remote.frame.*"
          ]
        }
        allow_responses: true
      }
    }

    # ─────────────────────────── breakglass ──────────────────────────
    {
      user: "breakglass"
      password: $KANADE_CONFORMANCE_BREAKGLASS_PASSWORD
      permissions: {
        publish: {
          allow: [
            # Liveness probe: every role's connect helper publishes one empty
            # message to a fresh _INBOX subject to tell a dead client from a
            # disconnected one (`nats_client::is_dead`, every 15 s). Without
            # this the probe is a permission violation on every tick. The
            # cost is that the role can also publish into another client's
            # reply inbox, i.e. spoof a reply; the reply payloads are
            # re-validated by their consumers, and narrowing this needs the
            # probe to stop publishing (a PING flush would do) first.
            "_INBOX.>"

            "commands.pc.*"
            "kill.*"
            "audit.operator.run.*"
            "audit.operator.kill.*"
          ]
        }
        subscribe: {
          allow: [
            "results.*"
          ]
        }
      }
    }
  ]
}
