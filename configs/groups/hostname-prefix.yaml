# Dynamic group (#1032): membership by hostname naming convention, straight off
# the `agents` table — needs NO inventory job to have run, so it resolves the
# moment agents register. Handy when a fleet encodes role/site in the hostname
# (SRV-*, LAB-*, TOKYO-*, …).
#
# `agents.hostname` is the OS hostname each agent registers with. Adjust the
# LIKE to your convention. The query must return a `pc_id` column.
id: srv-hosts
description: "Hosts whose name starts with SRV- (naming convention)"
tags: [targeting, hostname]
query: |
  SELECT pc_id
  FROM agents
  WHERE hostname LIKE 'SRV-%'
refresh: 15m
