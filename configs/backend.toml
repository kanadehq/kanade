# Spec §2.4.4 — same file drives Windows + Linux backends. teravars
# (≥ 0.1.5 fixes [vars] self-reference through load_merged) resolves
# vars.base / vars.log_dir up front, so sqlite_path and log.path can
# reference them cleanly.

[vars]
base    = '''{% if is_windows() %}{{ env(name="ProgramData") }}\Kanade\data{% else %}/var/lib/kanade{% endif %}'''
log_dir = '''{% if is_windows() %}{{ env(name="ProgramData") }}\Kanade\logs{% else %}/var/log/kanade{% endif %}'''

[server]
bind = '0.0.0.0:8080'
# Externally-reachable base URL of the SPA, used to build absolute links
# in account emails (password setup / reset). Optional: when unset the
# backend derives the base from each request's Host header, which is
# correct for a direct LAN deploy. Set it behind a reverse proxy / TLS
# terminator, or to harden the public forgot-password path against
# Host-header poisoning. (`bind` can't be used — 0.0.0.0 is a wildcard.)
# public_url = 'https://kanade.example.com'

# WebAuthn (passkey) relying party configuration. When present and valid,
# passkey sign-in, enrolment and management are enabled for the Web UI.
# Optional: omit or leave empty to disable the feature.
# Keep this backend behind a trusted proxy that appends the real client IP
# to X-Forwarded-For; direct public access can spoof the rate-limit bucket.
# WebAuthn support requires Rust 1.88 when building the backend.
#   rp_id      bare lowercase host name the credentials are bound to (no
#              scheme/port/path/wildcard/IP). Changing it later invalidates
#              every registered passkey — pick the one you will keep.
#   rp_origins exact public browser origins; https only (http://localhost for
#              local development). Each host must be rp_id or a subdomain.
# Passkey sign-in counts as two factors and does not ask for a TOTP code;
# adding/removing a passkey needs the password (+ TOTP code if enabled). See
# book/src/operations/passkeys.md.
# [server.webauthn]
# rp_id = 'kanade.example.com'
# rp_origins = ['https://kanade.example.com']
# rp_name = 'Kanade'  # optional, defaults to "Kanade"

[nats]
url = 'nats://127.0.0.1:4222'
# Base URL of the broker's HTTP monitoring endpoint (`http_port` in
# nats-server.conf, 8222 by default). The backend polls /connz there to
# learn which NATS user each agent's live connection authenticated as
# (#1270) — the broker's answer, not the agent's. Optional: when unset it
# is derived from `url` above by keeping the host and swapping in
# http://…:8222, which is right for the standard single-broker deploy.
# Unreachable or disabled monitoring is not fatal — the projection stops
# updating, values already recorded are kept, a host that was never
# correlated stays empty until the first successful poll, and the backend
# logs the outage once rather than once a minute.
# monitor_url = 'http://127.0.0.1:8222'

[db]
sqlite_path = '{{ vars.base }}/backend.db'

[log]
path  = '{{ vars.log_dir }}/backend.log'
level = 'info'

# Outbound SMTP relay for compliance-alert + generic email. Optional:
# omit the whole [mail] section and email features are simply off (the
# in-app / NATS notification path is unaffected). Only the non-secret
# connection settings live here — the SMTP password is provisioned to the
# registry via `deploy-backend.ps1 -MailPassword '<pw>'` (or
# $KANADE_MAIL_PASSWORD), never written to this file. Per-group recipient
# addresses are managed on the SPA Groups page (group_contacts KV), not
# here.
# [mail]
# host       = 'smtp.example.com'
# port       = 587
# encryption = 'starttls'              # starttls | tls | none
# from       = 'kanade-noreply@example.com'
# username   = 'kanade-noreply'        # omit for an unauthenticated relay
