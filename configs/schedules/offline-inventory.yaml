# `runs_on: agent` demonstration (v0.23).
#
# Use case: a fleet of laptops that roam off the corporate WAN.
# Want hourly hardware inventory regardless of connectivity. Backend
# isn't aware of the cron tick at all — each agent runs the cron
# locally, snapshots its hardware, and either publishes the result
# right away (online) or queues it in the async-nats client buffer
# (briefly offline) until the broker reappears.
#
# Persistence:
#   * Schedule + Manifest are read from BUCKET_SCHEDULES /
#     BUCKET_JOBS once at agent startup, then watched for live
#     edits. The agent caches the current snapshot in memory.
#   * `once_per_pc` dedup state lives in
#     `%ProgramData%\Kanade\data\local_completions.json` — survives
#     agent restarts so the script doesn't fire twice if the PC
#     reboots between ticks.
#
# Install:
#
#   kanade job create     configs/jobs/inventory-hw.yaml
#   kanade schedule create configs/schedules/offline-inventory.yaml

id: offline-inventory
cron: "0 0 * * * *"           # top of every hour
enabled: true
job_id: inventory-hw
target:
  all: true
runs_on: agent                # ← key v0.23 field
mode: once_per_pc
cooldown: 1h                  # fire at most once per hour per PC
# starting_deadline: 30m       # optional: skip if delivery was that late
