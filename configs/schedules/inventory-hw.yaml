# Schedule wrapper that fires the registered job `inventory-hw` (see
# `configs/jobs/inventory-hw.yaml`) with a per-PC 6-hour cadence.
#
# `per_pc: { every: 6h }` (#418): each PC's effective scan interval
# is 6h. The scheduler polls every minute internally and picks up
# PCs whose 6h window has elapsed — a PC that came online mid-window
# catches up within ~1 min of being due, without paying the
# storage/network cost of a true high-frequency sweep. (Pre-#418
# this took two fields — a 30-min poll cron + a 6h cooldown — and
# the poll period is no longer something this file configures.)
#
# Order of operations:
#
#   1. Register the job:
#         kanade job create configs/jobs/inventory-hw.yaml
#   2. Register this schedule:
#         kanade schedule create configs/schedules/inventory-hw.yaml
#
# Editing the job afterwards (via `kanade job create ...` again) takes
# effect on the next scheduled tick — no schedule re-create needed.

id: inventory-hw
when:
  per_pc: { every: 6h }
enabled: true
job_id: inventory-hw
# v0.18: target lives on the schedule, not the job. Same job_id can
# be wrapped in multiple schedules with different target/cadence.
target:
  all: true
# Stagger agent start times by up to 5 min so 3000 PCs don't all
# run Get-CimInstance at the same wall-clock instant.
jitter: 5m
# Optional: replace `target` semantics with wave fanout.
# rollout:
#   strategy: wave
#   waves:
#     - { group: canary, delay: 0s }
#     - { group: wave1,  delay: 5m }
