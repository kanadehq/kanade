# Schedule demonstrating `starting_deadline` (v0.22) and the
# `when: { cron: ... }` escape hatch (#418).
#
# Fires at 9:00 every weekday and shows a toast / notification to
# the logged-in user. If the broker / agent was offline at 9:00 and
# only delivered the Command at 11:00, we'd rather skip than have
# a "good morning" pop up two hours late.
#
# `when.cron` is the raw 6-field escape hatch: fires the whole
# target on every cron tick, no per-pc dedup (a greeting isn't a
# desired-state job). It is TEMPORARY — Phase 2 of #418 replaces it
# with a calendar form (`at: "09:00"`, `days: [mon-fri]`,
# `tz: agent-local`); reconcile-style work should use `per_pc` /
# `per_target` instead.
#
# `starting_deadline: 30m` → if the agent doesn't receive the
# Command within 30 minutes of 9:00, it publishes a synthetic
# skipped-result (exit_code 125 + explanatory stderr) so the
# operator sees the miss on the Results page.
#
# Compare with `configs/schedules/kitting-once.yaml` (no deadline),
# where catching up later is exactly what we want.

id: morning-greeting
when:
  cron: "0 0 9 * * mon-fri"   # 9:00 weekdays (sec min hour day month dow)
enabled: true
job_id: show-toast            # replace with your real toast/notify job
target:
  all: true
starting_deadline: 30m
