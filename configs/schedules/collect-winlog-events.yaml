# Schedule wrapper that fires the registered job
# `collect-winlog-events` on a 15-min tick. Issue #246.
#
# Cadence rationale: 15 min is short enough that a logon shows up
# on the SPA Activity timeline before a typical session settles
# in (operators don't have to wait 30 min before debugging "did
# the user log on?"), and long enough that a 1000-PC fleet doesn't
# bang on Get-WinEvent every minute. Empirically the script runs
# in ~1-3 s on a busy box, so a 1-min tick would work too, but
# the marginal SPA-latency improvement isn't worth the 15× broker
# traffic.
#
# `once_per_pc` + 10m cooldown: the schedule may tick multiple
# times during a slow rollout window, but the cooldown gates each
# PC to one execution per 10 min — guards against accidental
# double-fires (e.g. a manual `kanade exec` lands while the
# schedule fires nearby).
#
# `jitter` 3 min: stagger across the fleet so 1000 PCs don't all
# query Security log at the same wall-clock instant. 3 min spreads
# evenly over the cadence without making "when did this fire?"
# debugging painful (a 5-min jitter on a 15-min tick gets hard to
# reason about).
#
# Order of operations:
#
#   1. Register the job:
#         kanade job create configs/jobs/collect-winlog-events.yaml
#   2. Register this schedule:
#         kanade schedule create configs/schedules/collect-winlog-events.yaml

id: collect-winlog-events
cron: "0 */15 * * * *"   # every 15 min (sec min hour day month dow)
enabled: true
job_id: collect-winlog-events
target:
  all: true
mode: once_per_pc
cooldown: 10m
jitter: 3m
