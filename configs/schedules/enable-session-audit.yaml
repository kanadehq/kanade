# Issue #378 — fires `enable-session-audit` once per PC so lock /
# unlock (Security 4800 / 4801) start flowing into the
# `collect-winlog-events` timeline. Same lifecycle pattern as
# `kitting-once`:
#
#   * each tick enumerates alive agents
#   * a PC that completed with exit 0 is skipped forever
#   * a failed PC retries on the next tick (until it succeeds)
#   * a PC that joins the fleet later is picked up automatically
#
# No `cooldown` on purpose — "success → never again" is exactly
# the semantics for a one-shot policy enable. No
# `auto_disable_when_done` either, so replacement / newly imaged
# PCs keep getting caught forever.
#
# 15-min cadence (vs kitting-once's 30 s): a new PC missing
# lock/unlock events for up to ~15 min after first heartbeat is
# fine — the collect-winlog-events bootstrap window (24 h) will
# backfill the gap on its next tick anyway.
#
# Install:
#
#   kanade job create      configs/jobs/enable-session-audit.yaml
#   kanade schedule create configs/schedules/enable-session-audit.yaml

id: enable-session-audit
cron: "0 */15 * * * *"   # every 15 min (sec min hour day month dow)
enabled: true
job_id: enable-session-audit
target:
  all: true
mode: once_per_pc
