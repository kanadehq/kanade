# Schedule wrapper that fires the registered job `inventory-hw` (see
# `configs/jobs/inventory-hw.yaml`) at the top of every hour.
#
# Order of operations:
#
#   1. Register the job:
#         kanade job create configs/jobs/inventory-hw.yaml
#   2. Register this schedule:
#         kanade schedule create configs/schedules/hourly-inventory.yaml
#
# Editing the job afterwards (via `kanade job create ...` again) takes
# effect on the next scheduled tick — no schedule re-create needed.

id: hourly-inventory
cron: "0 0 * * * *"   # top of every hour (sec min hour day month dow)
enabled: true
job_id: inventory-hw
