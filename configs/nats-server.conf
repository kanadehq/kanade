# Sample nats-server config for kanade — JetStream + token auth.
#
# Start with:
#   nats-server -c nats-server.conf
#
# Then provision the matching token on every kanade host. The
# kanade-shared::nats_client::connect() helper resolves it in
# this order (see README "NATS authentication"):
#   (1) HKLM\SOFTWARE\kanade\<role>\NatsToken — the role's own
#       credential (role is agent / backend / cli). Hardened ACL
#       (SYSTEM + Administrators only). No deploy script writes
#       this yet — provision it by hand until the broker-side
#       `users` split lands (#1155).
#   (2) HKLM\SOFTWARE\kanade\agent\NatsToken  — production today
#       Where the single fleet-wide token lives, and what every
#       role falls back to, so an unmigrated fleet is unaffected.
#       Set via `.\deploy-agent.ps1 -NatsToken '<secret>'` /
#       `.\deploy-backend.ps1 -NatsToken '<secret>'`.
#   (3) $env:KANADE_NATS_TOKEN                — dev / CLI fallback
#       `$env:KANADE_NATS_TOKEN = '<secret>'`
#   (4) <none>                                — unauthenticated
#
# nats_url in agent.toml / backend.toml stays plain (the token never
# lands in config files or process listings).
#
# For dev / single-machine use without auth, drop the
# `authorization { ... }` block and start with `nats-server -js`
# — the kanade clients connect unauthenticated when neither (1)
# nor (2) is set.

port: 4222
http_port: 8222   # /jsz endpoint for `kanade jetstream status` curl probes

jetstream {
  # Absolute path — the Windows service starts with cwd = System32,
  # so a relative path like "./jetstream" silently writes JetStream
  # data under System32. `deploy-nats.ps1` provisions this directory.
  store_dir: "C:/ProgramData/Kanade/nats/jetstream"
  max_memory_store: 1GB        # JetStream in-memory soft limit
  max_file_store: 50GB         # disk soft limit
}

authorization {
  # CHANGE THIS. The value below is a placeholder in a public
  # repository — a fleet deployed with it has a credential anyone
  # can read. Generate one per fleet, e.g.
  #   [Convert]::ToBase64String((1..32|%{Get-Random -Max 256}))
  #
  # This is also a *single shared* token with no `permissions`, so
  # whoever holds it may publish and subscribe to every subject —
  # which means running code on any endpoint (agents act on their
  # command subjects without verifying the publisher) and reading
  # any remote-assistance session. See #1155; per-role credentials
  # (the client side already resolves them) are the next step, and
  # per-agent identity via NKeys / NATS JWT the one after.
  #
  # Note the earlier guidance here — "stick with token while
  # operating ≤ ~1000 hosts" — was about *operability*, not
  # authorization. Host count does not change what one leaked
  # credential grants; it only changes how many machines are in the
  # blast radius.
  token: "CHANGE-ME-generate-a-per-fleet-secret"
}
