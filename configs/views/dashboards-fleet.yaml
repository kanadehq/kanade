# Fleet analytics dashboards (#743) — a `view`: a standalone declarative
# read/aggregation over obs_events the fleet ALREADY emits (logon / boot /
# unexpected_shutdown from collect-winlog-events, agent_started /
# agent_self_update from the agent). No new collector.
#
# This replaces the old definition-only JOB carrier (configs/jobs/
# dashboards-fleet.yaml) that needed a noop `execute:` just to host these
# widgets. A view has no execute and no schedule — the backend reads it
# from BUCKET_VIEWS at query time and merges its widgets with the
# co-located `aggregate:` hints on jobs.
#
#   kanade view create configs/views/dashboards-fleet.yaml
#
# Widgets reference an obs_event `kind`, not a job's output, so one view
# can chart events emitted by many sources. (The Utilization dashboard
# itself stays co-located as `aggregate:` hints on its emit jobs.)

id: dashboards-fleet
description: "Fleet analytics: reliability / access / agent health"
tags: [dashboards]

widgets:
  # ── Reliability ──────────────────────────────────────────────────
  - dashboard: Reliability
    title: Unexpected shutdowns by PC
    scope: fleet
    kind: unexpected_shutdown
    agg: count
    group_by: pc_id
    render: bar
  - dashboard: Reliability
    title: Unexpected shutdowns (total)
    scope: fleet
    kind: unexpected_shutdown
    agg: count
    render: stat
  - dashboard: Reliability
    title: Reboots by hour (fleet)
    scope: fleet
    kind: boot
    agg: count
    time_bucket: hour
    render: timeline
  - dashboard: Reliability
    title: This PC's reboots by hour
    scope: pc
    kind: boot
    agg: count
    time_bucket: hour
    render: timeline

  # ── Access / Security ────────────────────────────────────────────
  # NB on logon payloads: the SCHEDULED collect-winlog-events emits
  # `logon` from Winlogon 7001 (source winlog:System) with `user` (a SID
  # leaf name) but NO `logon_type`. `logon_type` only exists on the
  # Security 4624 events from the on-demand collect-winlog-logons-all
  # (source winlog:Security) — so the by-type widget is source-pinned to
  # it and stays empty until that job is run. `user` exists on both, so
  # the top-users / by-hour widgets work on the default fleet.
  - dashboard: Access
    title: Logons by type (Security 4624)
    scope: fleet
    kind: logon
    source: winlog:Security
    agg: count
    group_by: logon_type
    render: bar
  - dashboard: Access
    title: Top users by logon (fleet)
    scope: fleet
    kind: logon
    agg: count
    group_by: user
    render: bar
  - dashboard: Access
    title: Logons by hour (fleet)
    scope: fleet
    kind: logon
    agg: count
    time_bucket: hour
    render: timeline
  - dashboard: Access
    title: This PC's logons by hour
    scope: pc
    kind: logon
    agg: count
    time_bucket: hour
    render: timeline

  # ── Agent health ─────────────────────────────────────────────────
  - dashboard: Agent health
    title: Self-updates by PC
    scope: fleet
    kind: agent_self_update
    agg: count
    group_by: pc_id
    render: bar
  - dashboard: Agent health
    title: Agent restarts by PC
    scope: fleet
    kind: agent_started
    agg: count
    group_by: pc_id
    render: bar
