# Fleet analytics dashboards (#743) — a `view`: a standalone declarative
# read/aggregation over obs_events the fleet ALREADY emits (logon / boot /
# unexpected_shutdown from the agent's native Event Log reader, idle / active
# from the idle sampler, agent_started / agent_self_update from the agent).
# No new collector.
#
# This replaces the old definition-only JOB carrier (configs/jobs/
# dashboards-fleet.yaml) that needed a noop `execute:` just to host these
# widgets. A view has no execute and no schedule — the backend reads it
# from BUCKET_VIEWS at query time and merges its widgets with the
# co-located `aggregate:` hints on jobs.
#
#   kanade view create configs/views/dashboards-fleet.yaml
#
# Widgets reference an obs_event `kind`, not a job's output, so one view
# can chart events emitted by many sources. (The Utilization dashboard
# itself stays co-located as `aggregate:` hints on its emit jobs.)

id: dashboards-fleet
description: "Fleet analytics: reliability / access / agent health"
tags: [dashboards]

widgets:
  # ── Uptime ───────────────────────────────────────────────────────
  # Per-PC operational swimlane reconstructed from the power / session /
  # sleep events the agent's native Event Log reader emits (boot / shutdown /
  # log_service_*, logon / logoff, sleep / resume) plus active / idle from the
  # idle sampler. Unlike the aggregation
  # widgets it reads no single `kind`/`agg`: the backend returns the raw
  # events in the window and the SPA folds them into lane spans (the same
  # strip the Events page renders). Per-PC only — pick a PC in the
  # Analytics scope to see it. `order: -10` pulls the Uptime tab first.
  - dashboard: Uptime
    title: Operational state
    description: Power / session / sleep intervals reconstructed from events
    order: -10
    scope: pc
    render: op_timeline

  # ── Reliability ──────────────────────────────────────────────────
  - dashboard: Reliability
    title: Unexpected shutdowns by PC
    description: Event 41 count per PC (top offenders)
    scope: fleet
    kind: unexpected_shutdown
    agg: count
    group_by: pc_id
    render: bar
  - dashboard: Reliability
    title: Unexpected shutdowns (total)
    description: Event 41 across the fleet
    scope: fleet
    kind: unexpected_shutdown
    agg: count
    render: stat
    # Promote this headline number to the main Dashboard's "Pinned
    # widgets" section. Any fleet-scope widget can opt in this way; it
    # renders there with the same component as on the Analytics page.
    pin_dashboard: true
  - dashboard: Reliability
    title: Reboots by hour (fleet)
    description: Boot events bucketed by local hour
    scope: fleet
    kind: boot
    agg: count
    time_bucket: hour
    render: timeline
  - dashboard: Reliability
    title: This PC's reboots by hour
    description: Boot events bucketed by local hour
    scope: pc
    kind: boot
    agg: count
    time_bucket: hour
    render: timeline

  # ── Access / Security ────────────────────────────────────────────
  # NB on logon payloads: the agent's native Event Log reader emits
  # `logon` from Winlogon 7001 (source winlog:System) with `user` (a leaf
  # account name, resolved from the SID; `sid` keeps the raw value) but NO
  # `logon_type`.
  # `logon_type` only exists on the Security 4624 events from the on-demand
  # collect-winlog-logons-all (source winlog:Security) — so the by-type
  # widget is source-pinned to it and stays empty until that job is run.
  # `user` exists on both, so the top-users / by-hour widgets work on the
  # default fleet.
  - dashboard: Access
    title: Logons by type (Security 4624)
    description: Needs the on-demand collect-winlog-logons-all job
    scope: fleet
    kind: logon
    source: winlog:Security
    agg: count
    group_by: logon_type
    render: bar
  - dashboard: Access
    title: Top users by logon (fleet)
    description: Winlogon 7001 + Security 4624, by user
    scope: fleet
    kind: logon
    agg: count
    group_by: user
    render: bar
  - dashboard: Access
    title: Logons by hour (fleet)
    description: Logon events bucketed by local hour
    scope: fleet
    kind: logon
    agg: count
    time_bucket: hour
    render: timeline
  - dashboard: Access
    title: This PC's logons by hour
    description: Logon events bucketed by local hour
    scope: pc
    kind: logon
    agg: count
    time_bucket: hour
    render: timeline

  # ── Agent health ─────────────────────────────────────────────────
  - dashboard: Agent health
    title: Self-updates by PC
    description: agent_self_update count per PC
    scope: fleet
    kind: agent_self_update
    agg: count
    group_by: pc_id
    render: bar
  - dashboard: Agent health
    title: Agent restarts by PC
    description: agent_started count per PC
    scope: fleet
    kind: agent_started
    agg: count
    group_by: pc_id
    render: bar
