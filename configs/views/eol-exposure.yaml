# End-of-life exposure — the signal that "on the latest version" still
# misses: a product line past its end-of-life gets NO more security
# fixes, so being current on it is not being safe. Correlates each
# host's OS (inventory-hw → inventory_facts) against endoflife.date
# release cycles (feed-eol → feeds, feed_id=eol).
#
#   kanade view create configs/views/eol-exposure.yaml
#
# Companion to kev-exposure.yaml on the same Security tab: KEV+winget
# answers "is a published fix waiting?"; this answers "will a fix ever
# come?". Windows 10 (EOL 2025-10-14) is the poster child — a fully
# "up to date" Win10 box is still end-of-life.
#
# Match honesty: installed-version → endoflife.date CYCLE is per-product.
# This first cut wires the OS (Windows / Windows Server) match; the feed
# also carries .NET / .NET Framework / PowerShell / Python / Node, ready
# for their own widgets. The OS match keys on the display version (25H2)
# with the edition suffix (-w consumer / -e enterprise-education) and the
# major (10/11), so it resolves to exactly one cycle per host.
id: eol-exposure
description: "End-of-life exposure: host OS vs endoflife.date support cycles"
tags: [security, lifecycle, dashboards]

sql_widgets:
  # ─── FLEET: pinned headline ──────────────────────────────────────
  # How many hosts run an OS whose support cycle has already ended
  # (a past `eol` date, or the coarse `true` state). 0 = good.
  - title: Hosts past OS end-of-life
    description: PCs whose Windows release is past its endoflife.date support cycle
    query: |
      WITH os AS (
        SELECT pc_id,
               json_extract(facts_json, '$.os_name')            AS os_name,
               json_extract(facts_json, '$.os_display_version') AS disp
        FROM inventory_facts WHERE job_id = 'inventory-hw'
      )
      SELECT count(DISTINCT o.pc_id) AS pcs
      FROM os o
      JOIN feeds f
        ON f.feed_id = 'eol'
       AND lower(json_extract(f.data, '$.product')) IN ('windows', 'windows-server')
       AND o.disp <> ''
       AND lower(json_extract(f.data, '$.cycle')) LIKE '%' || lower(o.disp) || '%'
       AND ((o.os_name LIKE '%Enterprise%' OR o.os_name LIKE '%Education%')
            = (json_extract(f.data, '$.cycle') LIKE '%-e'))
       AND ((o.os_name LIKE '%Server%') = (lower(json_extract(f.data, '$.product')) = 'windows-server'))
      WHERE lower(json_extract(f.data, '$.eol')) IN ('true', '1')
         OR date(json_extract(f.data, '$.eol')) <= date('now')
    refresh: 12h
    render: { kind: stat, value: pcs }
    placement: { analytics: Security, dashboard: { pin: true } }

  # ─── PER-PC: this host's OS support status (binds :pc_id) ────────
  - title: OS support status on this PC
    description: This host's Windows release vs its endoflife.date support cycle
    query: |
      WITH os AS (
        SELECT pc_id,
               json_extract(facts_json, '$.os_name')            AS os_name,
               json_extract(facts_json, '$.os_display_version') AS disp,
               json_extract(facts_json, '$.os_build')           AS build
        FROM inventory_facts WHERE job_id = 'inventory-hw' AND pc_id = :pc_id
      )
      SELECT CASE
               WHEN lower(json_extract(f.data, '$.eol')) IN ('true', '1')      THEN 'END OF LIFE'
               WHEN date(json_extract(f.data, '$.eol')) <= date('now')          THEN 'END OF LIFE'
               WHEN date(json_extract(f.data, '$.eol')) <= date('now','+180 day') THEN 'EOL < 180 days'
               ELSE 'supported'
             END                                     AS status,
             o.os_name                               AS os,
             o.disp                                  AS release,
             o.build                                 AS build,
             json_extract(f.data, '$.eol')           AS eol_date
      FROM os o
      JOIN feeds f
        ON f.feed_id = 'eol'
       AND lower(json_extract(f.data, '$.product')) IN ('windows', 'windows-server')
       AND o.disp <> ''
       AND lower(json_extract(f.data, '$.cycle')) LIKE '%' || lower(o.disp) || '%'
       AND ((o.os_name LIKE '%Enterprise%' OR o.os_name LIKE '%Education%')
            = (json_extract(f.data, '$.cycle') LIKE '%-e'))
       AND ((o.os_name LIKE '%Server%') = (lower(json_extract(f.data, '$.product')) = 'windows-server'))
    refresh: 12h
    render:
      kind: table
      columns: [status, os, release, build, eol_date]
      labels: { status: Status, os: OS, release: Release, build: Build, eol_date: "EOL date" }
    placement: { analytics: Security }
