# Spec §2.4.4 — same file drives Windows + Linux agents. The `[vars]`
# section is resolved via teravars (≥ 0.1.5 fixes self-reference
# through load_merged); is_windows() picks the right ProgramData /
# /var/lib path for the host.

[vars]
hostname = '{{ system.host }}'
base     = '''{% if is_windows() %}{{ env(name="ProgramData") }}\Kanade\data{% else %}/var/lib/kanade{% endif %}'''
log_dir  = '''{% if is_windows() %}{{ env(name="ProgramData") }}\Kanade\logs{% else %}/var/log/kanade{% endif %}'''

[agent]
id       = '{{ vars.hostname }}'
nats_url = 'nats://127.0.0.1:4222'

[log]
path  = '{{ vars.log_dir }}/agent.log'
level = 'info'

# Everything that used to live here ([agent] groups, [inventory]
# hw_interval / jitter / enabled, the implicit heartbeat cadence)
# is server-managed now via the agent_config + agent_groups KV
# buckets. Use `kanade config` and `kanade agent groups` to drive
# fleet-wide settings; this file is intentionally limited to the
# pinned infra knobs (NATS URL, pc_id, log paths) so a single toml
# can ship to every host unchanged.
